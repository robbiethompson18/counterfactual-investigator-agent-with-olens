<!--
  Static env viewer for environments/. No server. What the code declares (arms as build() makes them, comparisons,
  RETIRED, STARRED, README) comes from spec/ beside this page, built from main by the GitHub Pages workflow
  (`python -m environments spec --out`); an env whose code doesn't build there falls back to envs/<env>/spec/ on HF.
  Runs and rates (envs/<env>/index.json), Docent / expview / O-lens links (envs/<env>/links.json) and episode shards
  (by HTTP range request) come from the HF dataset under envs/, pinned to one commit; source files from GitHub at the
  commit the spec was built from. ?spec=hf ignores spec/ beside the page.

  Local:  python -m http.server 8000   (from the repo root, after `python -m environments index`), then
          http://localhost:8000/environments/_lib/page.html?base=/data/envs/&src=/
          base = a mirror of envs/ (data/envs/), src = the repo root to read source files from.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  --user:#1b241c;--asst:#1c1d21;--think:#29251a;--tool:#231f2b;--bar:#9da3ff;--track:#2c2e33;--add:#1e3a20;--addfg:#b9e3b4;--del:#45211c;--delfg:#f2b8ae;--pos:#81c784;--neg:#6d6a63;--up:#81c784;--down:#ef9a8a;--shadow:none}}

  --user:#1b241c;--asst:#1c1d21;--think:#29251a;--tool:#231f2b;--bar:#9da3ff;--track:#2c2e33;--add:#1e3a20;--addfg:#b9e3b4;--del:#45211c;--delfg:#f2b8ae;--pos:#81c784;--neg:#6d6a63;--up:#81c784;--down:#ef9a8a;--shadow:none}
*{box-sizing:border-box}

.hbar{display:grid;grid-template-columns:minmax(60px,1fr) 76px 56px;align-items:center;gap:8px;font-variant-numeric:tabular-nums}  /* fixed value + Δ columns, so every bar in a card has the same start and width */
.hbar .dl{justify-self:start}

.hbar .v{width:76px;text-align:right;color:var(--mute);font-size:11.5px}
.delta{display:inline-block;font:600 11.5px Inter;padding:1px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.delta.up{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)} .delta.down{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)} .delta.flat{background:var(--track);color:var(--mute)}

<body>
<header class="top"><div class="in"><a class="brand" href="#"><b>◆</b> Environments</a><span id="crumb"></span></div></header>
<main>
<div id="status" class="mute">loading…</div>
<div id="view"></div>
</main>
<script>
const REPO = "Robbie-Kylie-NN-sprint/counterfactual-investigator-agent-with-olens";
const GH = "robbiethompson18/counterfactual-investigator-agent-with-olens";
const DOCENT = "https://docent.transluce.org/dashboard/";
const params = new URLSearchParams(location.search);
let BASE = params.get("base");  // a local mirror of data/envs/, if given
const SRC = params.get("src");  // a local repo root to read source files from (default: GitHub at the spec's commit)
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const cache = {};
const md = t => window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(String(t))) : `<pre>${esc(t)}</pre>`;
const slug = s => String(s).replace(/\//g, ".").replace(/[^A-Za-z0-9_.+-]/g, "_");  // core.slug
const LEGACY = {ep: "episode"};

async function base() {
  if (BASE) return BASE;
  // pin every fetch to one commit: one API call, then only /resolve/<sha>/ (inside HF's anonymous limits)
  const r = await fetch(`https://huggingface.co/api/datasets/${REPO}/revision/main`);
  const sha = r.ok ? (await r.json()).sha : "main";
  return BASE = `https://huggingface.co/datasets/${REPO}/resolve/${sha}/envs/`;
}
// the code-side spec beside the page (spec/index.json lists the envs that built from main), else HF's envs/<env>/spec/
let CODE;
async function codeIndex() {
  if (CODE !== undefined) return CODE;
  if (params.get("spec") === "hf") return CODE = null;
  try { const r = await fetch("spec/index.json"); CODE = r.ok ? await r.json() : null; } catch { CODE = null; }
  return CODE;
}
async function getSpec(env, rel, asText = false) {
  const code = await codeIndex(), here = code?.envs.find(e => e.env === env && !e.error);
  if (!here) return asText ? getText(`${env}/spec/${rel}`) : getJSON(`${env}/spec/${rel}`);
  return fetchOnce("c:" + env + "/" + rel, async () => { const r = await fetch(`spec/${env}/${rel}`); if (!r.ok) throw new Error(`spec/${env}/${rel}: ${r.status}`); return asText ? r.text() : r.json(); });
}
function fetchOnce(key, f) { return cache[key] ??= f().catch(e => { delete cache[key]; throw e; }); }
async function getJSON(path) {
  return fetchOnce(path, async () => { const r = await fetch((await base()) + path); if (!r.ok) throw new Error(path + ": " + r.status); return r.json(); });
}
async function getText(path) {
  return fetchOnce("t:" + path, async () => { const r = await fetch((await base()) + path); if (!r.ok) throw new Error(path + ": " + r.status); return r.text(); });
}
const maybe = p => p.catch(() => null);
async function getEpisode(env, run, id) {
  const idx = await getJSON(`${env}/${run}/episodes/index.json`);
  const [shard, off, len] = idx[id];
  const r = await fetch((await base()) + `${env}/${run}/episodes/${shard}`, {headers: {Range: `bytes=${off}-${off + len - 1}`}});
  const buf = new Uint8Array(await r.arrayBuffer());  // 206 = just this episode; a server without Range sends the shard
  return JSON.parse(new TextDecoder().decode(r.status === 206 ? buf : buf.slice(off, off + len)));
}
async function sourceText(spec, path) {
  if (SRC) return fetchOnce("s:" + path, async () => { const r = await fetch(SRC + path); if (!r.ok) throw new Error(path + ": " + r.status); return r.text(); });
  const sha = (spec.git_sha || "main").replace("+dirty", "");
  return fetchOnce("s:" + path, async () => {
    for (const ref of [sha, "main"]) {  // the spec's commit may be unpushed (or a local merge); main is the fallback
      const r = await fetch(`https://raw.githubusercontent.com/${GH}/${ref}/${path}`);
      if (r.ok) return (ref === sha ? "" : `# (commit ${sha.slice(0, 10)} is not on GitHub: showing main)\n`) + await r.text();
    }
    throw new Error(path + ": not on GitHub");
  });
}
const ghLink = (spec, path) => `https://github.com/${GH}/blob/${(spec.git_sha || "main").replace("+dirty", "")}/${path}`;

// ---- rates with uncertainty: a Beta(1,1) prior, so k of n gives the posterior Beta(k+1, n-k+1); intervals are its
// equal-tailed 95% credible interval, drawn as a translucent band behind a line at the observed rate k/n
function lgamma(x) {  // Lanczos
  const g = [676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61503916999185, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (x < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * x))) - lgamma(1 - x);
  x -= 1; let a = 0.99999999999980993; const t = x + 7.5;
  for (let i = 0; i < 8; i++) a += g[i] / (x + i + 1);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}
function betacf(a, b, x) {  // continued fraction for the incomplete beta (Numerical Recipes)
  let c = 1, d = 1 - (a + b) * x / (a + 1); d = 1 / (Math.abs(d) < 1e-300 ? 1e-300 : d); let h = d;
  for (let m = 1; m <= 300; m++) {
    const m2 = 2 * m;
    for (const aa of [m * (b - m) * x / ((a - 1 + m2) * (a + m2)), -(a + m) * (a + b + m) * x / ((a + m2) * (a + 1 + m2))]) {
      d = 1 + aa * d; d = 1 / (Math.abs(d) < 1e-300 ? 1e-300 : d); c = 1 + aa / c; if (Math.abs(c) < 1e-300) c = 1e-300; h *= d * c;
    }
    if (Math.abs(d * c - 1) < 1e-12) break;
  }
  return h;
}
function ibeta(x, a, b) {  // regularized incomplete beta I_x(a, b)
  if (x <= 0) return 0; if (x >= 1) return 1;
  const bt = Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b) + a * Math.log(x) + b * Math.log(1 - x));
  return x < (a + 1) / (a + b + 2) ? bt * betacf(a, b, x) / a : 1 - bt * betacf(b, a, 1 - x) / b;
}
function betaQuantile(q, a, b) { let lo = 0, hi = 1; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; ibeta(m, a, b) < q ? lo = m : hi = m; } return (lo + hi) / 2; }
const CI = {};
function rateCI(k, n) { return CI[k + "/" + n] ??= [betaQuantile(0.025, k + 1, n - k + 1), betaQuantile(0.975, k + 1, n - k + 1)]; }
function ciBar(k, n, cls = "bar") {
  if (!n) return `<span class="${cls}"></span>`;
  const [lo, hi] = rateCI(k, n), f = x => (100 * x).toFixed(1);
  return `<span class="${cls}" title="${k}/${n}; 95% credible interval ${f(lo)}–${f(hi)}% (Beta(1,1) prior)"><i class="band" style="left:${f(lo)}%;width:${f(hi - lo)}%"></i><i class="pt" style="left:${f(k / n)}%"></i></span>`;
}
function rate(k, n) {
  if (!n) return '<span class="mute">–</span>';
  const [lo, hi] = rateCI(k, n);
  return `<span class="rate">${ciBar(k, n)}${k}/${n} = ${(100 * k / n).toFixed(0)}% <span class="ci">[${(100 * lo).toFixed(0)}, ${(100 * hi).toFixed(0)}]</span></span>`;
}
function primaryCell(pr) {
  if (!pr) return "";
  if (pr.type === "bool") return rate(pr.k, pr.n);
  if (pr.type === "number") return pr.mean == null ? "–" : `mean ${pr.mean.toFixed(2)} (n=${pr.n})`;
  return Object.entries(pr.counts || {}).map(([k, v]) => `${esc(k)}: ${v}`).join(", ");
}
function setCrumb(parts) {
  $("crumb").innerHTML = parts.map(([l, hsh]) => `<span class="pathsep">/</span>` + (hsh ? `<a href="#${hsh}">${esc(l)}</a>` : esc(l))).join("");
  document.title = parts.length ? parts.map(p => p[0]).reverse().join(" · ") + " · Environments" : "Environments";
}
const pctOf = p => p && p.n ? p.k / p.n : null;
// difference of two proportions with a 95% normal-approximation interval, in percentage points
// b's rate minus a's, in pp: the observed difference and the 95% credible interval of the difference of the two
// Beta(1,1) posteriors, by 20k seeded Monte Carlo draws (same draws every load)
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gammaDraw(a, u) {  // Marsaglia-Tsang (a >= 1 here: Beta(1,1) posteriors have both parameters >= 1)
  const d = a - 1 / 3, c = 1 / Math.sqrt(9 * d);
  for (;;) {
    let x, v;
    do { x = Math.sqrt(-2 * Math.log(u() || 1e-12)) * Math.cos(2 * Math.PI * u()); v = 1 + c * x; } while (v <= 0);
    v = v * v * v; const w = u();

// retired arms (RETIRED in env.py) are left out of comparisons, rates and runs unless the hash has retired=show
async function envData(env, h = {}) {
  const [idx, spec, links] = await Promise.all([maybe(getJSON(`${env}/index.json`)), maybe(getSpec(env, "env.json")), maybe(getJSON(`${env}/links.json`))]);
  if (!idx && !spec) throw new Error(`no index or spec for ${env}`);
  const D = {env, idx: idx || {runs: [], pairs: {}, arms: spec.arms, arm_factors: spec.arm_factors, primary: spec.primary, title: env},
             spec, links: links || {runs: {}}, showRetired: h.retired === "show"};
  const R = new Set(spec?.retired || []);
  if (R.size && !D.showRetired) {
    const live = a => !R.has(a);
    const seen = new Set();  // a set that shrinks to an earlier comparison's arms is dropped
    D.spec = {...spec, comparisons: spec.comparisons.map(c => ({...c, arms: c.arms.filter(live)}))
      .filter(c => c.arms.length >= 2 && !seen.has(c.arms.join()) && seen.add(c.arms.join()))};
    D.idx = {...D.idx, runs: D.idx.runs.map(r => ({...r, arms: Object.fromEntries(Object.entries(r.arms).filter(([a]) => live(a)))}))
      .filter(r => Object.keys(r.arms).length)};
  }
  D.retiredNote = R.size ? `<span class="mute">${R.size} retired arms (RETIRED in env.py) ${D.showRetired ? "shown" : "hidden"}:
    <a href="#${setParam("retired", D.showRetired ? "" : "show")}">${D.showRetired ? "hide" : "show"} them</a></span>` : "";
  return D;
}
// a run's target model plus its thinking mode: never pool thinking on with off (different rates)
const targetKey = r => r.target + (r.thinking === false ? " · thinking off" : r.thinking === true ? " · thinking on" : "");

function pooled(idx) {
  const by = {}, items = {}, itemsBy = {}, targets = new Set();
  for (const r of idx.runs) for (const [arm, a] of Object.entries(r.arms)) {
    const tgt = targetKey(r);
    targets.add(tgt);
    const p = by[arm + "\u0000" + tgt] ??= {k: 0, n: 0, eps: 0, runs: 0, type: a.primary.type};
    p.eps += a.n; p.runs += 1;
    if (a.primary.type === "bool") {
      p.k += a.primary.k; p.n += a.primary.n;
      for (const [it, [k, n]] of Object.entries(a.primary.items || {})) {
        const q = items[arm + "\u0000" + tgt + "\u0000" + it] ??= {k: 0, n: 0};
        q.k += k; q.n += n;

  let m = 0;

// resolve {"$b"} from the arm's blobs; {"$f"} stays a ref (fetched on demand, compared by hash)
function resolve(x, blobs) {

  if (m.tool_calls) s = (isRef(s) ? "" : s) + m.tool_calls.map(t => `\n→ ${t.function?.name}(${t.function?.arguments})`).join("");
  return s;

  for (const p of Object.keys(ep.files || {}).sort()) out.push([`file · ${p}`, ep.files[p], "file"]);
  if ((ep.setup || []).length) out.push(["setup (run before the first turn)", ep.setup.join("\n"), "harness"]);
  if ((ep.prefill || []).length) out.push(["prefill (run for real, shown as the agent's first tool turns)", ep.prefill.map(([id, c]) => `${id}: ${c}`).join("\n"), "harness"]);

// ---------------------------------------------------------------- diff

function foldLines(s, keep = 3) {
  const lines = s.split("\n");

    `<span class="fold" onclick="this.nextElementSibling.hidden=false;this.remove()">… ${lines.length - 2 * keep} unchanged lines (click to show) …</span>` +
    `<span hidden>${esc(lines.slice(keep, -keep).join("\n"))}\n</span>` + esc(lines.slice(-keep).join("\n"));
}
function diffHtml(a, b) {
  if (!window.Diff) return `<div class="mute">jsdiff didn't load; showing both</div><div class="diff">${esc(a)}</div><div class="diff">${esc(b)}</div>`;
  const parts = Diff.diffLines(a, b);
  let h = "";
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i], q = parts[i + 1];
    if (p.removed && q?.added && p.value.length + q.value.length < 40000) {  // a changed block: word-level inside it
      for (const w of Diff.diffWordsWithSpace(p.value, q.value)) h += w.added ? `<ins>${esc(w.value)}</ins>` : w.removed ? `<del>${esc(w.value)}</del>` : esc(w.value);
      i++;
    } else if (p.added) h += `<ins>${esc(p.value)}</ins>`;
    else if (p.removed) h += `<del>${esc(p.value)}</del>`;

  const A = new Map(sa.map(s => [s[0], s]));
  return names.map(n => {
    const a = A.get(n)?.[1], b = B.get(n)?.[1];
    const same = a !== undefined && b !== undefined && (isRef(a) && isRef(b) ? a.$f === b.$f : !isRef(a) && !isRef(b) && a === b);

}
async function renderDiff(env, armA, armB, item, el) {
  el.innerHTML = '<p class="mute">building diff…</p>';
  const [ea, eb] = await Promise.all([built(env, armA, item), built(env, armB, item)]);
  if (!ea || !eb) { el.innerHTML = `<p class="mute">item ${esc(item)} isn't built for ${esc(!ea ? armA : armB)}</p>`; return; }
  const pairs = pairSections(sections(ea), sections(eb));
  const changed = pairs.filter(p => !p.same);
  let h = `<p><b>${changed.length}</b> of ${pairs.length} sections differ between <span class="mono">${esc(armA)}</span> (<del>red</del>) and <span class="mono">${esc(armB)}</span> (<ins>green</ins>) on item <span class="mono">${esc(item)}</span>.
    ${changed.length ? "" : "The two arms send byte-identical inputs on this item."}</p>`;
  for (const p of pairs) {
    const tag = p.same ? '<span class="tag">same</span>' : p.a === undefined ? '<span class="tag add">only in B</span>' : p.b === undefined ? '<span class="tag ch">only in A</span>' : '<span class="tag ch">changed</span>';

// the env list, built in the browser from each envs/<env>/index.json (on HF: the env dirs come from one tree-API call),
// so an upload from a checkout that lacks some envs can't hide them; a local mirror uses its envs/index.json
async function envList() {
  let envs;
  const r = params.get("base") ? null : await maybe(fetch(`https://huggingface.co/api/datasets/${REPO}/tree/main/envs`));
  if (r?.ok) {
    const dirs = (await r.json()).filter(x => x.type === "directory").map(x => x.path.split("/").pop());
    const idxs = await Promise.all(dirs.map(e => maybe(getJSON(`${e}/index.json`))));
    envs = idxs.map((x, i) => x && {env: dirs[i], title: x.title, status: x.status, starred: x.starred, primary: x.primary, n_runs: x.runs.length,
      targets: x.runs.reduce((t, run) => (t[run.target] = (t[run.target] || 0) + (run.n_episodes || 0), t), {}),
      latest: x.runs.map(run => run.created || "").sort().pop() || ""}).filter(Boolean);
  } else envs = ((await maybe(getJSON("index.json")))?.envs || []).map(e => ({...e, latest: ""}));
  // what the code says (title, status, star) wins over the run index; envs in code with no runs yet still show
  const code = await codeIndex();
  for (const c of (code?.envs || []).filter(c => !c.error)) {
    const e = envs.find(x => x.env === c.env);
    if (e) Object.assign(e, {title: c.title, status: c.status, starred: c.starred, primary: c.primary});
    else envs.push({env: c.env, title: c.title, status: c.status, starred: c.starred, primary: c.primary, n_runs: 0, targets: {}, latest: ""});
  }
  envs.sort((a, b) => a.env.localeCompare(b.env));
  return {generated: envs.map(e => e.latest).sort().pop() || "", envs};
}

    const ts = P.targets.filter(t => c.arms.some(a => P.by[a + "\u0000" + t]?.n));
    const body = ts.length ? ts.map(t => `<span class="tg">${esc(modelName(t))}</span>` + c.arms.map((a, i) => {
      const p = P.by[a + "\u0000" + t], v = pctOf(p);
      const d = i ? deltaBadge(matchedDelta(P, c.arms[0], a, t, c.items)) : "";
      return `<span class="arm" title="${esc(a)}">${esc(a)}${retiredTag(D, a)}</span><span class="hbar">${p?.n ? ciBar(p.k, p.n, "b") : '<span class="b"></span>'}
        <span class="v">${v == null ? "not run" : `${(100 * v).toFixed(0)}% <span style="color:var(--faint)">/${p.n}</span>`}</span><span class="dl">${d}</span></span>`;
    }).join("")).join("") : c.arms.map(a => `<span class="arm">${esc(a)}${retiredTag(D, a)}</span><span class="mute">not run</span>`).join("");
    return `<a class="card" href="#${hashOf({env: D.env, compare: c.name, retired: D.showRetired ? "show" : null})}">
      <div class="t">${esc(c.name)}</div><div class="why">${esc(c.why || (c.kind === "pair" ? `${c.arms[0]} → ${c.arms[1]}` : ""))}${c.items ? ` · ${c.items.length} items` : ""}</div>
      <div class="mini">${body}</div></a>`;
  };
  $("tab").innerHTML = `<p class="lede">Pairs are the env's declared clean counterfactuals (<span class="mono">PAIRS</span>); sets are arms worth viewing side by side
    (<span class="mono">COMPARISONS</span>). Bars are the primary rate pooled over runs per model, thinking on and off apart; the pill is each arm minus the first on the items both were run on,
    coloured when its 95% interval excludes zero. Bands are 95% credible intervals (Beta(1,1) prior), the line the observed rate.</p>` +
    Object.entries(groups).map(([g, cs]) => `<h3>${esc(g)}</h3><div class="cards">${cs.map(card).join("")}</div>`).join("");
}

async function comparePage(h) {
  const D = await envData(h.env, h);
  const c = D.spec.comparisons.find(x => x.name === h.compare);
  if (!c) throw new Error(`no comparison ${h.compare}` + (D.showRetired ? "" : " (it may only have retired arms: add &retired=show)"));
  setCrumb([[h.env, "env=" + h.env], [c.name]]);
  const P = pooled(D.idx);
  const baseArm = h.base && c.arms.includes(h.base) ? h.base : c.arms[0];
  const other = h.other && c.arms.includes(h.other) && h.other !== baseArm ? h.other : c.arms.find(a => a !== baseArm);
  const shared = itemsOf(D.spec, baseArm).filter(it => itemsOf(D.spec, other).includes(it));
  const items = c.items ? shared.filter(it => c.items.map(String).includes(it)) : shared;
  const item = items.includes(h.item) ? h.item : items[0];
  const go = o => "#" + hashOf({env: h.env, compare: c.name, base: baseArm === c.arms[0] ? null : baseArm, other, item, retired: h.retired, ...o});
  const usedT = P.targets.filter(t => c.arms.some(a => P.by[a + "\u0000" + t]));
  const pct = p => p && p.n ? p.k / p.n : null;
  // which sections differ from the base arm, per arm (on this item): the set's "what changes" overview
  const eps = await Promise.all(c.arms.map(a => built(h.env, a, item).catch(() => null)));
  const sb = eps[c.arms.indexOf(baseArm)] ? sections(eps[c.arms.indexOf(baseArm)]) : [];
  const changes = c.arms.map((a, i) => !eps[i] ? null : pairSections(sb, sections(eps[i])).filter(p => !p.same && !p.name.startsWith("meta")).map(p => p.name));  // what the model sees
  // one scale for every Δ bar on the page, so they compare: the widest credible interval, rounded up to 10pp
  const S = Math.max(10, ...c.arms.flatMap(a => a === baseArm ? [] : usedT.map(t => { const x = matchedDelta(P, baseArm, a, t, c.items);
    return x ? Math.ceil(Math.max(Math.abs(x.lo), Math.abs(x.hi)) / 10) * 10 : 0; })));
  const effects = usedT.map(t => {
    const mm = matched(P, baseArm, other, t, c.items);
    if (!mm) return "";
    const [a, b, nIt] = mm, x = deltaOf(a, b);
    const cls = x.lo > 0 ? "up" : x.hi < 0 ? "down" : "";
    return `<div class="effect"><div class="m" title="${esc(t)}">${esc(modelName(t))}</div><div class="big ${cls}">${x.d >= 0 ? "+" : ""}${x.d.toFixed(0)}<span style="font-size:15px">pp</span></div>
      <div class="sub">${(100 * pctOf(a)).toFixed(0)}% → ${(100 * pctOf(b)).toFixed(0)}% · n ${a.n} / ${b.n} on ${nIt} shared items<br>95% CrI ${x.lo.toFixed(0)} to ${x.hi.toFixed(0)}pp</div></div>`;
  }).join("");
  $("view").innerHTML = `<p><a href="#env=${h.env}&tab=compare">← comparisons</a>${D.retiredNote ? " · " + D.retiredNote : ""}</p>
  <h1>${esc(c.name)} <span class="badge" style="vertical-align:4px">${c.kind === "pair" ? "pair" : "set"}</span></h1>
  <p class="lede">${c.why ? esc(c.why) + ". " : ""}Effect of <span class="mono">${esc(baseArm)}</span> → <span class="mono">${esc(other)}</span> on <span class="mono">${esc(D.idx.primary)}</span>, pooled over runs on the items both arms were run on:</p>
  ${effects ? `<div class="effects">${effects}</div>` : '<p class="mute">No runs of both arms yet.</p>'}
  <h2>Arms</h2>
  <div class="scroll"><table><tr><th>arm</th><th>diff vs base</th><th>sections that differ from the base on item ${esc(item)}</th>${usedT.map(t => `<th title="${esc(t)}">${esc(modelName(t))}<br><span style="font-weight:400;text-transform:none">all items · this item</span></th>`).join("")}</tr>
  ${c.arms.map((a, i) => {
    const isB = a === baseArm;
    return `<tr class="${a === other ? "on" : ""}"><td class="mono"><a href="#${hashOf({env: h.env, arm: a, item})}">${esc(a)}</a>${retiredTag(D, a)}
      <br><span style="font-family:Inter,system-ui">${armExpview(D, a, "expview ↗")}</span></td>
      <td>${isB ? "<b>base</b>" : `<a href="${go({other: a})}">${a === other ? "<b>shown</b>" : "show"}</a> · <a href="${go({base: a, other: baseArm})}" title="make this the base">base</a>`}</td>
      <td class="mono">${isB ? "" : changes[i] == null ? '<span class="mute">not built on this item</span>' : changes[i].length ? changes[i].map(esc).join("<br>") : '<span class="mute">identical</span>'}</td>
      ${usedT.map(t => {
        const p = P.by[a + "\u0000" + t], q = P.items[a + "\u0000" + t + "\u0000" + item], b = P.by[baseArm + "\u0000" + t];
        const x = !isB && p?.type === "bool" ? matchedDelta(P, baseArm, a, t, c.items) : null;
        const d = x ? `<div class="rate" style="margin-top:4px">${deltaBar(x, S)}${deltaBadge(x)} <span class="ci">[${x.lo.toFixed(0)}, ${x.hi.toFixed(0)}]</span></div>` : "";
        return `<td>${p ? (p.type === "bool" ? rate(p.k, p.n) + d : `${p.eps} eps`) : '<span class="mute">not run</span>'}${q ? `<br><span class="mono mute">this item ${q.k}/${q.n}</span>` : ""}</td>`;
      }).join("")}</tr>`;
  }).join("")}
  </table></div>
  ${perItemTable(D, P, baseArm, other, usedT, items, go)}
  <div class="row"><label>item <select onchange="location.hash='${go({item: "__"})}'.replace('__', encodeURIComponent(this.value))">${items.map(it => `<option ${it === item ? "selected" : ""}>${esc(it)}</option>`).join("")}</select></label>
    <span class="mute">${items.length} items${c.items ? " (the pair's subset)" : ""} · built for sample 0 on ${esc(D.spec.built_for?.today)}</span></div>
  <h2>Rollouts on item ${esc(item)}</h2>
  <p class="lede">Chips are episodes on this item (✓ / ✗ = ${esc(D.idx.primary)}): click opens Docent, ↗ the transcript here, ev the episode in expview (lens when it has O-lens reads).</p>
  <div class="cols" style="grid-template-columns:1fr 1fr">${rolloutsHtml(D, baseArm, item)}${rolloutsHtml(D, other, item)}</div>
  <h2>What changes: <span class="mono">${esc(baseArm)}</span> → <span class="mono">${esc(other)}</span></h2>
  <div id="diff"></div>`;
  await renderDiff(h.env, baseArm, other, item, $("diff"));
}

function perItemTable(D, P, a, b, targets, items, go) {
  const rows = [];
  for (const t of targets) for (const it of items) {
    const x = P.items[a + "\u0000" + t + "\u0000" + it], y = P.items[b + "\u0000" + t + "\u0000" + it];
    if (x || y) rows.push({t, it, x, y, d: x && y && x.n && y.n ? y.k / y.n - x.k / x.n : null});
  }
  if (!rows.length) return "";
  rows.sort((p, q) => (p.t > q.t) - (p.t < q.t) || Math.abs(q.d ?? -1) - Math.abs(p.d ?? -1));
  const f = q => q ? `${q.k}/${q.n}` : "–";
  return `<details class="sec"><summary>Per item, ${esc(a)} vs ${esc(b)} <span class="mute">(${rows.length} rows, biggest gaps first; which items carry the effect)</span></summary><div class="body scroll">
    <table><tr><th>target</th><th>item</th><th class="mono">${esc(a)}</th><th class="mono">${esc(b)}</th><th>Δ</th></tr>
    ${rows.map(r => `<tr class="click" onclick="location.hash='${go({item: r.it})}'"><td class="mono">${esc(r.t)}</td><td class="mono">${esc(r.it)}</td><td>${f(r.x)}</td><td>${f(r.y)}</td><td>${r.d == null ? "" : (r.d >= 0 ? "+" : "") + (100 * r.d).toFixed(0) + "pp"}</td></tr>`).join("")}
    </table></div></details>`;
}

function armsTab(D, h) {
  const F = D.spec.arm_factors || {}, keys = [...new Set(Object.values(F).flatMap(Object.keys))];
  const filt = Object.fromEntries(keys.filter(k => h[k]).map(k => [k, h[k]]));
  const R = new Set(D.spec.retired || []), showRetired = D.showRetired;
  const keep = arm => (showRetired || !R.has(arm)) && Object.entries(filt).every(([k, v]) => (F[arm] || {})[k] === v);
  const P = pooled(D.idx);
  const arms = D.spec.arms.filter(keep);
  const sel = k => `<label>${esc(k)} <select onchange="location.hash=setParam('${k}', this.value)"><option value="">all</option>${
    [...new Set(Object.values(F).map(f => f[k]).filter(Boolean))].sort().map(v => `<option ${filt[k] === v ? "selected" : ""}>${esc(v)}</option>`).join("")}</select></label>`;
  $("tab").innerHTML = `${keys.length ? `<div class="row">Filter by factor: ${keys.map(sel).join(" ")}</div>` : ""}
  <div class="row">Tick two arms to diff them: <button id="dodiff" disabled>diff</button> <span class="mute">${arms.length} arms</span></div>
  <div class="scroll"><table><tr><th></th><th>arm</th>${keys.map(k => `<th>${esc(k)}</th>`).join("")}<th>items</th>${P.targets.map(t => `<th title="${esc(t)}">${esc(modelName(t))}</th>`).join("")}</tr>
  ${arms.map(a => `<tr><td><input type="checkbox" class="pick" value="${esc(a)}"></td><td class="mono"><a href="#${hashOf({env: D.env, arm: a})}">${esc(a)}</a>${retiredTag(D, a)}</td>
    ${keys.map(k => `<td class="mono">${esc((F[a] || {})[k] || "")}</td>`).join("")}<td>${itemsOf(D.spec, a).length}</td>
    ${P.targets.map(t => { const p = P.by[a + "\u0000" + t]; return `<td>${p ? (p.type === "bool" ? rate(p.k, p.n) : p.eps + " eps") : ""}</td>`; }).join("")}</tr>`).join("")}
  </table></div>`;
  const picks = () => [...document.querySelectorAll(".pick:checked")].map(x => x.value);
  for (const x of document.querySelectorAll(".pick")) x.onchange = () => { $("dodiff").disabled = picks().length !== 2; };
  $("dodiff").onclick = () => { const [a, b] = picks(); location.hash = hashOf({env: D.env, diff: a + "," + b}); };
}

  const secs = sections(ep);

function canonHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  let moved = false;
  for (const [old, neu] of Object.entries(LEGACY)) if (h.has(old)) { h.set(neu, h.get(old)); h.delete(old); moved = true; }
  if (moved) history.replaceState(null, "", "#" + h.toString());
  return Object.fromEntries(h);
}

async function route() {
  const h = canonHash();
  $("status").textContent = "loading…";
  try {
    if (h.run) await runPage(h.env, h.run, h.arm, h.episode);
    else if (h.compare) await comparePage(h);
    else if (h.diff) await diffPage(h);
    else if (h.env && h.arm) await armPage(h);
    else if (h.env) await envPage(h);
    else await home();
    $("status").textContent = "";
  } catch (e) { $("status").textContent = "error: " + e.message; console.error(e); }
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
</body>
