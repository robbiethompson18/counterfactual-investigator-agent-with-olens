<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Environments</title>
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.2.0/diff.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<!--
  Static env viewer for environments/. No server: it reads the generated files of the HF dataset under envs/, pinned to
  one commit (envs/index.json, envs/<env>/index.json for runs and rates, envs/<env>/spec/ for every arm as build() makes
  it, envs/<env>/links.json for Docent / expview links), episode shards by HTTP range request, and the env's source
  from GitHub at the commit the spec was built from.

  Local:  python -m http.server 8000   (from the repo root, after `python -m environments index`), then
          http://localhost:8000/environments/_lib/page.html?base=/data/envs/&src=/
          base = a mirror of envs/ (data/envs/), src = the repo root to read source files from.
-->
<style>
:root{--bg:#fbfaf7;--card:#fff;--fg:#1f1e1b;--mute:#6b675e;--line:#dedad0;--acc:#2f5d8a;--code:#f4f2ec;--sel:#e3e9f1;
  --user:#eef3ec;--asst:#fff;--think:#f6f1e3;--tool:#f1eef5;--bar:#2f5d8a;--track:#e7e3da;
  --add:#dcefd8;--addfg:#1c4a17;--del:#f6dcd8;--delfg:#7a1d12;--pos:#2e7d32;--neg:#9a968d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18191b;--card:#1c1e21;--fg:#e6e4df;--mute:#9a968d;
  --line:#33363a;--acc:#8fb4dd;--code:#222428;--sel:#26313d;--user:#1d2620;--asst:#1c1e21;--think:#27241b;--tool:#231f2b;--bar:#8fb4dd;--track:#2c2f33;
  --add:#1e3a20;--addfg:#b9e3b4;--del:#43201c;--delfg:#f2b8ae;--pos:#81c784;--neg:#6b675e}}
:root[data-theme="dark"]{--bg:#18191b;--card:#1c1e21;--fg:#e6e4df;--mute:#9a968d;--line:#33363a;--acc:#8fb4dd;--code:#222428;--sel:#26313d;
  --user:#1d2620;--asst:#1c1e21;--think:#27241b;--tool:#231f2b;--bar:#8fb4dd;--track:#2c2f33;--add:#1e3a20;--addfg:#b9e3b4;--del:#43201c;--delfg:#f2b8ae;--pos:#81c784;--neg:#6b675e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:1280px;margin:0 auto;padding:16px}
a{color:var(--acc)} h1{font-size:20px;margin:4px 0 12px} h2{font-size:16px;margin:20px 0 8px} h3{font-size:14px;margin:14px 0 6px}
.mute{color:var(--mute)} .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line)}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;font-size:12px;color:var(--mute)} tr.click{cursor:pointer} tr.click:hover{background:var(--sel)} tr.on{background:var(--sel)}
.scroll{overflow-x:auto}
.rate{display:flex;align-items:center;gap:6px;white-space:nowrap}
.bar{width:60px;height:8px;background:var(--track);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bar)}
.msg{border:1px solid var(--line);border-radius:6px;margin:6px 0;padding:8px;white-space:pre-wrap;word-break:break-word;font:12.5px/1.45 ui-monospace,Menlo,monospace;max-height:70vh;overflow:auto}
.msg.user{background:var(--user)} .msg.assistant{background:var(--asst)} .msg.tool{background:var(--tool)} .msg.system{background:var(--code)}
.role{font:600 11px system-ui;color:var(--mute);margin-bottom:4px;white-space:normal} .think{background:var(--think);padding:6px;border-radius:4px;margin-bottom:6px}
select,button,input{font:inherit;padding:3px 6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:8px 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:8px 0 12px}
.tabs a{padding:6px 10px;text-decoration:none;color:var(--mute);border-bottom:2px solid transparent}
.tabs a.on{color:var(--fg);border-color:var(--acc)}
.chip{display:inline-block;padding:1px 7px;margin:2px 3px 2px 0;border:1px solid var(--line);border-radius:10px;font:12px ui-monospace,Menlo,monospace;text-decoration:none;color:var(--fg);background:var(--card)}
.chip.on{background:var(--sel);border-color:var(--acc)} .chip.pos{border-color:var(--pos);color:var(--pos)} .chip.neg{color:var(--neg)}
.sec{border:1px solid var(--line);border-radius:6px;margin:8px 0;background:var(--card)}
.sec>summary{padding:6px 10px;cursor:pointer;font:600 12px system-ui} .sec>summary .mute{font-weight:400}
.sec .body{padding:0 10px 10px}
.diff{white-space:pre-wrap;word-break:break-word;font:12.5px/1.45 ui-monospace,Menlo,monospace;background:var(--code);padding:8px;border-radius:4px;max-height:75vh;overflow:auto}
.diff ins{background:var(--add);color:var(--addfg);text-decoration:none} .diff del{background:var(--del);color:var(--delfg)}
.diff .fold{display:block;color:var(--mute);cursor:pointer;font-style:italic;margin:2px 0}
.tag{font:11px system-ui;padding:0 6px;border-radius:8px;background:var(--track);color:var(--mute);margin-left:6px}
.tag.ch{background:var(--del);color:var(--delfg)} .tag.add{background:var(--add);color:var(--addfg)}
.grid td.d{background:var(--del)} .grid td.s{color:var(--mute)}
.readme{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 16px;max-height:60vh;overflow:auto}
.readme pre{background:var(--code);padding:8px;overflow:auto} .readme table{width:auto}
pre.code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;font:12px/1.45 ui-monospace,Menlo,monospace;max-height:80vh}
.cols{display:grid;grid-template-columns:260px 1fr;gap:16px} @media (max-width:800px){.cols{grid-template-columns:1fr}}
.files a{display:block;font:12px ui-monospace,Menlo,monospace;text-decoration:none;padding:1px 4px;word-break:break-all} .files a.on{background:var(--sel)}
</style>
</head>
<body>
<main>
<h1><a href="#">Environments</a> <span id="crumb" class="mute"></span></h1>
<div id="status" class="mute">loading…</div>
<div id="view"></div>
</main>
<script>
const REPO = "Robbie-Kylie-NN-sprint/counterfactual-investigator-agent-with-olens";
const GH = "robbiethompson18/counterfactual-investigator-agent-with-olens";
const DOCENT = "https://docent.transluce.org/dashboard/";
const params = new URLSearchParams(location.search);
let BASE = params.get("base");  // a local mirror of data/envs/, if given
const SRC = params.get("src");  // a local repo root to read source files from (default: GitHub at the spec's commit)
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const cache = {};
const md = t => window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(String(t))) : `<pre>${esc(t)}</pre>`;
const slug = s => String(s).replace(/\//g, ".").replace(/[^A-Za-z0-9_.+-]/g, "_");  // core.slug
const LEGACY = {ep: "episode"};

async function base() {
  if (BASE) return BASE;
  // pin every fetch to one commit: one API call, then only /resolve/<sha>/ (inside HF's anonymous limits)
  const r = await fetch(`https://huggingface.co/api/datasets/${REPO}/revision/main`);
  const sha = r.ok ? (await r.json()).sha : "main";
  return BASE = `https://huggingface.co/datasets/${REPO}/resolve/${sha}/envs/`;
}
function fetchOnce(key, f) { return cache[key] ??= f().catch(e => { delete cache[key]; throw e; }); }
async function getJSON(path) {
  return fetchOnce(path, async () => { const r = await fetch((await base()) + path); if (!r.ok) throw new Error(path + ": " + r.status); return r.json(); });
}
async function getText(path) {
  return fetchOnce("t:" + path, async () => { const r = await fetch((await base()) + path); if (!r.ok) throw new Error(path + ": " + r.status); return r.text(); });
}
const maybe = p => p.catch(() => null);
async function getEpisode(env, run, id) {
  const idx = await getJSON(`${env}/${run}/episodes/index.json`);
  const [shard, off, len] = idx[id];
  const r = await fetch((await base()) + `${env}/${run}/episodes/${shard}`, {headers: {Range: `bytes=${off}-${off + len - 1}`}});
  const buf = new Uint8Array(await r.arrayBuffer());  // 206 = just this episode; a server without Range sends the shard
  return JSON.parse(new TextDecoder().decode(r.status === 206 ? buf : buf.slice(off, off + len)));
}
async function sourceText(spec, path) {
  if (SRC) return fetchOnce("s:" + path, async () => { const r = await fetch(SRC + path); if (!r.ok) throw new Error(path + ": " + r.status); return r.text(); });
  const sha = (spec.git_sha || "main").replace("+dirty", "");
  return fetchOnce("s:" + path, async () => {
    for (const ref of [sha, "main"]) {  // the spec's commit may be unpushed (or a local merge); main is the fallback
      const r = await fetch(`https://raw.githubusercontent.com/${GH}/${ref}/${path}`);
      if (r.ok) return (ref === sha ? "" : `# (commit ${sha.slice(0, 10)} is not on GitHub: showing main)\n`) + await r.text();
    }
    throw new Error(path + ": not on GitHub");
  });
}
const ghLink = (spec, path) => `https://github.com/${GH}/blob/${(spec.git_sha || "main").replace("+dirty", "")}/${path}`;

function rate(k, n) {
  if (!n) return '<span class="mute">–</span>';
  const p = k / n;
  return `<span class="rate"><span class="bar"><i style="width:${(100 * p).toFixed(0)}%"></i></span>${k}/${n} = ${(100 * p).toFixed(0)}%</span>`;
}
function primaryCell(pr) {
  if (!pr) return "";
  if (pr.type === "bool") return rate(pr.k, pr.n);
  if (pr.type === "number") return pr.mean == null ? "–" : `mean ${pr.mean.toFixed(2)} (n=${pr.n})`;
  return Object.entries(pr.counts || {}).map(([k, v]) => `${esc(k)}: ${v}`).join(", ");
}
function hashOf(obj) { return Object.entries(obj).filter(([, v]) => v != null && v !== "").map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join("&"); }
function setParam(k, v) {
  const h = new URLSearchParams(location.hash.slice(1));
  v ? h.set(k, v) : h.delete(k);
  return h.toString();
}

// ---------------------------------------------------------------- data

async function envData(env) {
  const [idx, spec, links] = await Promise.all([maybe(getJSON(`${env}/index.json`)), maybe(getJSON(`${env}/spec/env.json`)), maybe(getJSON(`${env}/links.json`))]);
  if (!idx && !spec) throw new Error(`no index or spec for ${env}`);
  return {env, idx: idx || {runs: [], pairs: {}, arms: spec.arms, arm_factors: spec.arm_factors, primary: spec.primary, title: env},
          spec, links: links || {runs: {}}};
}
// a run's target model plus its thinking mode: never pool thinking on with off (different rates)
const targetKey = r => r.target + (r.thinking === false ? " · thinking off" : r.thinking === true ? " · thinking on" : "");
// pooled primary per (arm, target) and per (arm, target, item), over runs
function pooled(idx) {
  const by = {}, items = {}, targets = new Set();
  for (const r of idx.runs) for (const [arm, a] of Object.entries(r.arms)) {
    const tgt = targetKey(r);
    targets.add(tgt);
    const p = by[arm + "\u0000" + tgt] ??= {k: 0, n: 0, eps: 0, runs: 0, type: a.primary.type};
    p.eps += a.n; p.runs += 1;
    if (a.primary.type === "bool") {
      p.k += a.primary.k; p.n += a.primary.n;
      for (const [it, [k, n]] of Object.entries(a.primary.items || {})) {
        const q = items[arm + "\u0000" + tgt + "\u0000" + it] ??= {k: 0, n: 0};
        q.k += k; q.n += n;
      }
    }
  }
  return {by, items, targets: [...targets].sort()};
}
async function armSpec(env, arm) { return getJSON(`${env}/spec/arms/${slug(arm)}.json`); }
// resolve {"$b"} from the arm's blobs; {"$f"} stays a ref (fetched on demand, compared by hash)
function resolve(x, blobs) {
  if (Array.isArray(x)) return x.map(v => resolve(v, blobs));
  if (x && typeof x === "object") {
    if ("$b" in x) return blobs[x.$b];
    if ("$f" in x) return x;
    return Object.fromEntries(Object.entries(x).map(([k, v]) => [k, resolve(v, blobs)]));
  }
  return x;
}
const isRef = v => v && typeof v === "object" && "$f" in v;
async function text(env, v) {
  if (isRef(v)) return getText(`${env}/spec/blobs/${v.$f}.txt`);
  if (typeof v === "string") return v;
  return JSON.stringify(v, null, 1);
}
async function built(env, arm, item) {
  const a = await armSpec(env, arm);
  const ep = a.items[item];
  return ep ? resolve(ep, a.blobs) : null;
}
function itemsOf(spec, arm) { return (spec.arm_specs[arm] || {}).items || []; }

// an episode as named sections, in the order the model meets them; values are strings or {"$f"} refs
function msgText(m) {
  let s = typeof m.content === "string" || isRef(m.content) ? m.content : m.content == null ? "" : JSON.stringify(m.content, null, 1);
  if (m.tool_calls) s = (isRef(s) ? "" : s) + m.tool_calls.map(t => `\n→ ${t.function?.name}(${t.function?.arguments})`).join("");
  return s;
}
function sections(ep) {
  const out = [];
  (ep.messages || []).forEach((m, i) => out.push([`message ${i} · ${m.role}`, msgText(m), m.role]));
  for (const t of ep.tools || []) out.push([`tool · ${t.function?.name ?? t.name ?? "?"}`, JSON.stringify(t, null, 1), "tool"]);
  for (const p of Object.keys(ep.files || {}).sort()) out.push([`file · ${p}`, ep.files[p], "file"]);
  if ((ep.setup || []).length) out.push(["setup (run before the first turn)", ep.setup.join("\n"), "harness"]);
  if ((ep.prefill || []).length) out.push(["prefill (run for real, shown as the agent's first tool turns)", ep.prefill.map(([id, c]) => `${id}: ${c}`).join("\n"), "harness"]);
  if (Object.keys(ep.state || {}).length) out.push(["app state at the start", JSON.stringify(ep.state, null, 1), "harness"]);
  const box = ep.tools?.length || Object.keys(ep.files || {}).length || ep.setup?.length || ep.prefill?.length;
  if (box) out.push(["harness (sandbox, handlers)", JSON.stringify({image: ep.image, hostname: ep.hostname, workdir: ep.workdir, env: ep.env,
    extra_tmpfs: ep.extra_tmpfs, handlers: ep.handlers, aliases: ep.aliases, prefill_tool: ep.prefill_tool, tool_footer: ep.tool_footer}, null, 1), "harness"]);
  if (Object.keys(ep.meta || {}).length) out.push(["meta (for measure(), not shown to the model)", JSON.stringify(ep.meta, null, 1), "meta"]);
  return out;
}

// ---------------------------------------------------------------- diff

function foldLines(s, keep = 3) {
  const lines = s.split("\n");
  if (lines.length <= 2 * keep + 3) return esc(s);
  return esc(lines.slice(0, keep).join("\n")) + "\n" +
    `<span class="fold" onclick="this.nextElementSibling.hidden=false;this.remove()">… ${lines.length - 2 * keep} unchanged lines (click to show) …</span>` +
    `<span hidden>${esc(lines.slice(keep, -keep).join("\n"))}\n</span>` + esc(lines.slice(-keep).join("\n"));
}
function diffHtml(a, b) {
  if (!window.Diff) return `<div class="mute">jsdiff didn't load; showing both</div><div class="diff">${esc(a)}</div><div class="diff">${esc(b)}</div>`;
  const parts = Diff.diffLines(a, b);
  let h = "";
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i], q = parts[i + 1];
    if (p.removed && q?.added && p.value.length + q.value.length < 40000) {  // a changed block: word-level inside it
      for (const w of Diff.diffWordsWithSpace(p.value, q.value)) h += w.added ? `<ins>${esc(w.value)}</ins>` : w.removed ? `<del>${esc(w.value)}</del>` : esc(w.value);
      i++;
    } else if (p.added) h += `<ins>${esc(p.value)}</ins>`;
    else if (p.removed) h += `<del>${esc(p.value)}</del>`;
    else h += foldLines(p.value);
  }
  return `<div class="diff">${h}</div>`;
}
// sections of A and B paired by name -> [{name, a, b, same}]
function pairSections(sa, sb) {
  const B = new Map(sb.map(s => [s[0], s])), names = [...sa.map(s => s[0]), ...sb.map(s => s[0]).filter(n => !sa.some(s => s[0] === n))];
  const A = new Map(sa.map(s => [s[0], s]));
  return names.map(n => {
    const a = A.get(n)?.[1], b = B.get(n)?.[1];
    const same = a !== undefined && b !== undefined && (isRef(a) && isRef(b) ? a.$f === b.$f : !isRef(a) && !isRef(b) && a === b);
    return {name: n, a, b, same};
  });
}
async function renderDiff(env, armA, armB, item, el) {
  el.innerHTML = '<p class="mute">building diff…</p>';
  const [ea, eb] = await Promise.all([built(env, armA, item), built(env, armB, item)]);
  if (!ea || !eb) { el.innerHTML = `<p class="mute">item ${esc(item)} isn't built for ${esc(!ea ? armA : armB)}</p>`; return; }
  const pairs = pairSections(sections(ea), sections(eb));
  const changed = pairs.filter(p => !p.same);
  let h = `<p><b>${changed.length}</b> of ${pairs.length} sections differ between <span class="mono">${esc(armA)}</span> (<del>red</del>) and <span class="mono">${esc(armB)}</span> (<ins>green</ins>) on item <span class="mono">${esc(item)}</span>.
    ${changed.length ? "" : "The two arms send byte-identical inputs on this item."}</p>`;
  for (const p of pairs) {
    const tag = p.same ? '<span class="tag">same</span>' : p.a === undefined ? '<span class="tag add">only in B</span>' : p.b === undefined ? '<span class="tag ch">only in A</span>' : '<span class="tag ch">changed</span>';
    h += `<details class="sec" ${p.same ? "" : "open"} data-name="${esc(p.name)}"><summary>${esc(p.name)} ${tag}</summary><div class="body"></div></details>`;
  }
  el.innerHTML = h;
  for (const d of el.querySelectorAll("details.sec")) {
    const p = pairs.find(x => x.name === d.dataset.name);
    const fill = async () => {
      if (d.dataset.done) return; d.dataset.done = 1;
      const [ta, tb] = await Promise.all([p.a === undefined ? "" : text(env, p.a), p.b === undefined ? "" : text(env, p.b)]);
      d.querySelector(".body").innerHTML = p.same ? `<div class="diff">${foldLines(ta, 8)}</div>` : diffHtml(ta, tb);
    };
    if (d.open) fill(); else d.addEventListener("toggle", fill, {once: true});
  }
}

// ---------------------------------------------------------------- rollouts

function episodesFor(D, arm, item) {
  const pre = `${slug(arm)}~${item == null ? "" : slug(item) + "~"}`, out = [];
  for (const [run, r] of Object.entries(D.links.runs || {})) {
    const eps = Object.entries(r.episodes || {}).filter(([id]) => id.startsWith(pre));
    if (eps.length) out.push({run, target: targetKey(r), collection: r.docent_collection, expview: r.expview, expviewItems: r.expview_items, eps});
  }
  return out;
}
const expviewUrl = (D, ds, item) => `${D.links.expview_base || "https://expview.pages.dev/"}#dataset=${ds}${item ? "&item=" + encodeURIComponent(item) : ""}`;
function epChip(D, r, [id, [docent, v]]) {
  const run = r.run, coll = r.collection;
  const cls = v === true ? "pos" : v === false ? "neg" : "";
  const label = id.split("~").slice(1).join("~") + (v === true ? " ✓" : v === false ? " ✗" : v == null ? " –" : ` ${v}`);
  const dl = docent && coll ? `${DOCENT}${coll}/agent_run/${docent}` : null;
  return `<a class="chip ${cls}" href="${dl || "#" + hashOf({env: D.env, run, episode: id})}" target="${dl ? "_blank" : ""}" rel="noopener" title="${dl ? "open in Docent" : "no Docent run: open here"}">${esc(label)}</a>` +
    `<a class="chip" href="#${hashOf({env: D.env, run, episode: id})}" title="transcript on this page">↗</a>` +
    (r.expviewItems ? `<a class="chip" href="${expviewUrl(D, r.expview, id)}" target="_blank" rel="noopener" title="open in expview">ev</a>` : "");
}
function rolloutsHtml(D, arm, item, max = 12) {
  const runs = episodesFor(D, arm, item);
  if (!runs.length) return `<p class="mute">no rollouts of ${esc(arm)}${item == null ? "" : " on " + esc(item)} yet</p>`;
  return runs.map(r => {
    const k = r.eps.filter(e => e[1][1] === true).length, n = r.eps.filter(e => typeof e[1][1] === "boolean").length;
    return `<div class="row" style="margin:4px 0"><span class="mono" style="min-width:300px"><a href="#${hashOf({env: D.env, run: r.run, arm})}">${esc(r.run)}</a>
      <span class="mute">${esc(r.target || "")}</span></span> ${n ? rate(k, n) : ""}
      ${r.collection ? `<a href="${DOCENT}${r.collection}" target="_blank" rel="noopener">Docent</a>` : ""}
      ${r.expview ? `<a href="${expviewUrl(D, r.expview)}" target="_blank" rel="noopener">expview</a>` : ""}</div>
      <div>${r.eps.slice(0, max).map(e => epChip(D, r, e)).join("")}${r.eps.length > max ? ` <span class="mute">+${r.eps.length - max} more</span>` : ""}</div>`;
  }).join("");
}

// ---------------------------------------------------------------- pages

async function home() {
  $("crumb").textContent = "";
  const idx = await getJSON("index.json");
  $("view").innerHTML = `<p class="mute">Every behavioural env in <a href="https://github.com/${GH}/tree/main/environments">environments/</a>: its arms as build() makes them, diffs between arms,
    the comparisons we think matter, and the rollouts (Docent, expview, transcripts). Generated ${esc(idx.generated)}.</p>
  <div class="scroll"><table><tr><th>env</th><th>title</th><th>status</th><th>primary</th><th>runs</th><th>episodes by target model</th></tr>

const retiredTag = (D, arm) => (D.spec?.retired || []).includes(arm) ? '<span class="tag" title="RETIRED in env.py: tried and set aside">retired</span>' : "";

function tabs(env, on) {
  const T = [["compare", "Comparisons"], ["arms", "Arms"], ["runs", "Runs"], ["about", "About"], ["source", "Source"]];
  return `<div class="tabs">${T.map(([k, l]) => `<a href="#env=${env}&tab=${k}" class="${on === k ? "on" : ""}">${l}</a>`).join("")}</div>`;

async function envPage(h) {
  const env = h.env, tab = h.tab || "compare";
  $("crumb").textContent = "/ " + env;
  const D = await envData(env);
  const head = `<p>${esc(D.idx.title)}. Primary measure <span class="mono">${esc(D.idx.primary)}</span>${D.spec?.behavior ? `: ${esc(D.spec.behavior)}` : ""}</p>`;
  if (!D.spec && tab !== "runs") { $("view").innerHTML = head + tabs(env, tab) + `<p class="mute">No spec for ${esc(env)} yet: run <span class="mono">python -m environments spec ${esc(env)}</span>.</p>`; return; }
  const body = {compare: compareList, arms: armsTab, runs: runsTab, about: aboutTab, source: sourceTab}[tab];

function compareList(D) {
  const P = pooled(D.idx), groups = {};
  for (const c of D.spec.comparisons) (groups[c.group || (c.kind === "pair" ? "pairs (PAIRS)" : "sets")] ??= []).push(c);
  const cell = (arm, t) => { const p = P.by[arm + "\u0000" + t]; return p && p.type === "bool" && p.n ? `${(100 * p.k / p.n).toFixed(0)}%<span class="mute">/${p.n}</span>` : '<span class="mute">·</span>'; };
  $("tab").innerHTML = `<p class="mute">PAIRS are the env's declared clean counterfactuals; sets are arm groups worth viewing side by side (<span class="mono">COMPARISONS</span> in env.py).
    Each cell is the primary rate pooled over runs, per target model. Click one to see what changes and the rollouts.</p>` +
    Object.entries(groups).map(([g, cs]) => `<h3>${esc(g)}</h3><div class="scroll"><table><tr><th>comparison</th><th>arms</th>${P.targets.map(t => `<th class="mono">${esc(t.replace(/@[^ ]*/, ""))}</th>`).join("")}</tr>
    ${cs.map(c => `<tr class="click" onclick="location.hash='${hashOf({env: D.env, compare: c.name})}'"><td><b>${esc(c.name)}</b>${c.why ? `<br><span class="mute">${esc(c.why)}</span>` : ""}${c.items ? `<br><span class="mute">${c.items.length} items</span>` : ""}</td>
      <td class="mono">${c.arms.map(a => esc(a) + retiredTag(D, a)).join("<br>")}</td>${P.targets.map(t => `<td class="mono">${c.arms.map(a => cell(a, t)).join("<br>")}</td>`).join("")}</tr>`).join("")}
    </table></div>`).join("");
}

async function comparePage(h) {
  const D = await envData(h.env);
  const c = D.spec.comparisons.find(x => x.name === h.compare);
  if (!c) throw new Error("no comparison " + h.compare);
  $("crumb").textContent = `/ ${h.env} / ${c.name}`;
  const P = pooled(D.idx);
  const baseArm = h.base && c.arms.includes(h.base) ? h.base : c.arms[0];
  const other = h.other && c.arms.includes(h.other) && h.other !== baseArm ? h.other : c.arms.find(a => a !== baseArm);
  const shared = itemsOf(D.spec, baseArm).filter(it => itemsOf(D.spec, other).includes(it));
  const items = c.items ? shared.filter(it => c.items.map(String).includes(it)) : shared;
  const item = items.includes(h.item) ? h.item : items[0];
  const go = o => "#" + hashOf({env: h.env, compare: c.name, base: baseArm === c.arms[0] ? null : baseArm, other, item, ...o});
  const usedT = P.targets.filter(t => c.arms.some(a => P.by[a + "\u0000" + t]));
  const pct = p => p && p.n ? p.k / p.n : null;
  // which sections differ from the base arm, per arm (on this item): the set's "what changes" overview
  const eps = await Promise.all(c.arms.map(a => built(h.env, a, item).catch(() => null)));
  const sb = eps[c.arms.indexOf(baseArm)] ? sections(eps[c.arms.indexOf(baseArm)]) : [];
  const changes = c.arms.map((a, i) => !eps[i] ? null : pairSections(sb, sections(eps[i])).filter(p => !p.same).map(p => p.name));
  $("view").innerHTML = `<p><a href="#env=${h.env}&tab=compare">← ${esc(h.env)} comparisons</a> · ${c.kind === "pair" ? "pair (PAIRS)" : "set"}${c.why ? ` · ${esc(c.why)}` : ""}</p>
  <div class="scroll"><table><tr><th>arm</th><th>diff vs base</th><th>sections that differ from the base on item ${esc(item)}</th>${usedT.map(t => `<th class="mono">${esc(t)}<br><span style="font-weight:400">all items · this item</span></th>`).join("")}</tr>
  ${c.arms.map((a, i) => {
    const isB = a === baseArm;
    return `<tr class="${a === other ? "on" : ""}"><td class="mono"><a href="#${hashOf({env: h.env, arm: a, item})}">${esc(a)}</a>${retiredTag(D, a)}</td>
      <td>${isB ? "<b>base</b>" : `<a href="${go({other: a})}">${a === other ? "<b>shown</b>" : "show"}</a> · <a href="${go({base: a, other: baseArm})}" title="make this the base">base</a>`}</td>
      <td class="mono">${isB ? "" : changes[i] == null ? '<span class="mute">not built on this item</span>' : changes[i].length ? changes[i].map(esc).join("<br>") : '<span class="mute">identical</span>'}</td>
      ${usedT.map(t => {
        const p = P.by[a + "\u0000" + t], q = P.items[a + "\u0000" + t + "\u0000" + item], b = P.by[baseArm + "\u0000" + t];
        const d = !isB && pct(p) != null && pct(b) != null ? ` <span class="mute">(${pct(p) >= pct(b) ? "+" : ""}${(100 * (pct(p) - pct(b))).toFixed(0)}pp)</span>` : "";
        return `<td>${p ? (p.type === "bool" ? rate(p.k, p.n) + d : `${p.eps} eps`) : '<span class="mute">not run</span>'}${q ? `<br><span class="mono mute">this item ${q.k}/${q.n}</span>` : ""}</td>`;
      }).join("")}</tr>`;
  }).join("")}
  </table></div>
  ${perItemTable(D, P, baseArm, other, usedT, items, go)}
  <div class="row"><label>item <select onchange="location.hash='${go({item: "__"})}'.replace('__', encodeURIComponent(this.value))">${items.map(it => `<option ${it === item ? "selected" : ""}>${esc(it)}</option>`).join("")}</select></label>
    <span class="mute">${items.length} items${c.items ? " (the pair's subset)" : ""} · built for sample 0 on ${esc(D.spec.built_for?.today)}</span></div>
  <h2>Rollouts on item ${esc(item)}</h2>
  <div class="cols" style="grid-template-columns:1fr 1fr"><div><h3 class="mono">${esc(baseArm)}</h3>${rolloutsHtml(D, baseArm, item)}</div><div><h3 class="mono">${esc(other)}</h3>${rolloutsHtml(D, other, item)}</div></div>
  <h2>What changes: <span class="mono">${esc(baseArm)}</span> → <span class="mono">${esc(other)}</span></h2>
  <div id="diff"></div>`;
  await renderDiff(h.env, baseArm, other, item, $("diff"));
}

function perItemTable(D, P, a, b, targets, items, go) {
  const rows = [];
  for (const t of targets) for (const it of items) {
    const x = P.items[a + "\u0000" + t + "\u0000" + it], y = P.items[b + "\u0000" + t + "\u0000" + it];
    if (x || y) rows.push({t, it, x, y, d: x && y && x.n && y.n ? y.k / y.n - x.k / x.n : null});
  }
  if (!rows.length) return "";
  rows.sort((p, q) => (p.t > q.t) - (p.t < q.t) || Math.abs(q.d ?? -1) - Math.abs(p.d ?? -1));
  const f = q => q ? `${q.k}/${q.n}` : "–";
  return `<details class="sec"><summary>Per item, ${esc(a)} vs ${esc(b)} <span class="mute">(${rows.length} rows, biggest gaps first; which items carry the effect)</span></summary><div class="body scroll">
    <table><tr><th>target</th><th>item</th><th class="mono">${esc(a)}</th><th class="mono">${esc(b)}</th><th>Δ</th></tr>
    ${rows.map(r => `<tr class="click" onclick="location.hash='${go({item: r.it})}'"><td class="mono">${esc(r.t)}</td><td class="mono">${esc(r.it)}</td><td>${f(r.x)}</td><td>${f(r.y)}</td><td>${r.d == null ? "" : (r.d >= 0 ? "+" : "") + (100 * r.d).toFixed(0) + "pp"}</td></tr>`).join("")}
    </table></div></details>`;
}

function armsTab(D, h) {
  const F = D.spec.arm_factors || {}, keys = [...new Set(Object.values(F).flatMap(Object.keys))];
  const filt = Object.fromEntries(keys.filter(k => h[k]).map(k => [k, h[k]]));
  const R = new Set(D.spec.retired || []), showRetired = h.retired === "show";
  const keep = arm => (showRetired || !R.has(arm)) && Object.entries(filt).every(([k, v]) => (F[arm] || {})[k] === v);
  const P = pooled(D.idx);
  const arms = D.spec.arms.filter(keep);
  const sel = k => `<label>${esc(k)} <select onchange="location.hash=setParam('${k}', this.value)"><option value="">all</option>${
    [...new Set(Object.values(F).map(f => f[k]).filter(Boolean))].sort().map(v => `<option ${filt[k] === v ? "selected" : ""}>${esc(v)}</option>`).join("")}</select></label>`;
  $("tab").innerHTML = `${keys.length ? `<div class="row">Filter by factor: ${keys.map(sel).join(" ")}</div>` : ""}
  <div class="row">Tick two arms to diff them: <button id="dodiff" disabled>diff</button> <span class="mute">${arms.length} arms</span>
    ${R.size ? `<span class="mute">· ${R.size} retired arms (RETIRED in env.py) ${showRetired ? "shown" : "hidden"}: <a href="#${setParam("retired", showRetired ? "" : "show")}">${showRetired ? "hide" : "show"} them</a></span>` : ""}</div>
  <div class="scroll"><table><tr><th></th><th>arm</th>${keys.map(k => `<th>${esc(k)}</th>`).join("")}<th>items</th>${P.targets.map(t => `<th class="mono">${esc(t.replace(/@[^ ]*/, ""))}</th>`).join("")}</tr>
  ${arms.map(a => `<tr><td><input type="checkbox" class="pick" value="${esc(a)}"></td><td class="mono"><a href="#${hashOf({env: D.env, arm: a})}">${esc(a)}</a>${retiredTag(D, a)}</td>
    ${keys.map(k => `<td class="mono">${esc((F[a] || {})[k] || "")}</td>`).join("")}<td>${itemsOf(D.spec, a).length}</td>
    ${P.targets.map(t => { const p = P.by[a + "\u0000" + t]; return `<td>${p ? (p.type === "bool" ? rate(p.k, p.n) : p.eps + " eps") : ""}</td>`; }).join("")}</tr>`).join("")}
  </table></div>`;
  const picks = () => [...document.querySelectorAll(".pick:checked")].map(x => x.value);
  for (const x of document.querySelectorAll(".pick")) x.onchange = () => { $("dodiff").disabled = picks().length !== 2; };
  $("dodiff").onclick = () => { const [a, b] = picks(); location.hash = hashOf({env: D.env, diff: a + "," + b}); };
}

async function armPage(h) {
  const D = await envData(h.env), arm = h.arm;
  $("crumb").textContent = `/ ${h.env} / ${arm}`;
  const items = itemsOf(D.spec, arm), item = items.includes(h.item) ? h.item : items[0];
  const ep = await built(h.env, arm, item);
  const inC = D.spec.comparisons.filter(c => c.arms.includes(arm));
  $("view").innerHTML = `<p><a href="#env=${h.env}&tab=arms">← ${esc(h.env)} arms</a>${retiredTag(D, arm)} · factors <span class="mono">${esc(JSON.stringify(D.spec.arm_factors?.[arm] || {}))}</span></p>
  ${inC.length ? `<p>In comparisons: ${inC.map(c => `<a class="chip" href="#${hashOf({env: h.env, compare: c.name, item})}">${esc(c.name)}</a>`).join("")}</p>` : ""}
  <div class="row"><label>item <select onchange="location.hash='${hashOf({env: h.env, arm})}&item='+encodeURIComponent(this.value)">${items.map(it => `<option ${it === item ? "selected" : ""}>${esc(it)}</option>`).join("")}</select></label>
    <label>diff against <select onchange="if(this.value)location.hash='${hashOf({env: h.env})}&diff='+encodeURIComponent('${arm},'+this.value)+'&item=${encodeURIComponent(item)}'"><option value="">…</option>${D.spec.arms.filter(a => a !== arm).map(a => `<option>${esc(a)}</option>`).join("")}</select></label>
    <span class="mono mute">uv run python -m environments run ${esc(h.env)} --arms ${esc(arm)} --items ${esc(item)}</span></div>
  <h2>Rollouts on item ${esc(item)}</h2>${rolloutsHtml(D, arm, item)}
  <h2>What the model gets (build(${esc(arm)}, ${esc(item)}), sample 0)</h2><div id="ep"></div>`;
  if (!ep) { $("ep").innerHTML = `<p class="mute">not built: ${esc(D.spec.build_errors?.[arm + "~" + item] || "")}</p>`; return; }
  const secs = sections(ep);
  $("ep").innerHTML = secs.map(([name, v, kind], i) => `<details class="sec" ${kind === "file" || kind === "harness" || kind === "meta" || kind === "tool" ? "" : "open"} data-i="${i}">
    <summary>${esc(name)}${isRef(v) ? ` <span class="mute">${(v.len / 1024).toFixed(0)} KB</span>` : ""}</summary><div class="body"><div class="msg ${esc(kind)}"></div></div></details>`).join("");
  for (const d of $("ep").querySelectorAll("details")) {
    const fill = async () => { if (d.dataset.done) return; d.dataset.done = 1; d.querySelector(".msg").textContent = await text(h.env, secs[+d.dataset.i][1]); };
    if (d.open) fill(); else d.addEventListener("toggle", fill, {once: true});
  }
}

async function runPage(env, run, arm, epId) {
  $("crumb").textContent = `/ ${env} / ${run}`;
  const D = await envData(env);
  const r = D.idx.runs.find(x => x.run === run);
  const epIdx = await getJSON(`${env}/${run}/episodes/index.json`);
  const ids = Object.keys(epIdx);
  const arms = Object.keys(r.arms).sort();
  if (!arm && epId) arm = arms.find(a => epId.startsWith(slug(a) + "~"));
  arm = arm || arms[0];
  const mine = ids.filter(id => id.startsWith(slug(arm) + "~"));
  const L = D.links.runs?.[run] || {};
  $("view").innerHTML = `<p><a href="#env=${env}&tab=runs">← ${esc(env)} runs</a> · target <span class="mono">${esc(r.target)}</span> · ${r.n_episodes} episodes
    ${r.docent_collection ? ` · <a href="${DOCENT}${r.docent_collection}" target="_blank" rel="noopener">Docent collection</a>` : ""}
    ${L.expview ? ` · <a href="${expviewUrl(D, L.expview)}" target="_blank" rel="noopener">expview</a>` : ""}</p>
  <div class="scroll"><table><tr><th>arm</th><th>n</th><th>errors</th><th>unscorable</th><th>${esc(D.idx.primary)}</th></tr>
  ${arms.map(a => { const x = r.arms[a]; return `<tr class="click ${a === arm ? "on" : ""}" onclick="location.hash='${hashOf({env, run, arm: a})}'">
    <td class="mono">${esc(a)}</td><td>${x.n}</td><td>${x.errors}</td><td>${x.unscorable}</td><td>${primaryCell(x.primary)}</td></tr>`; }).join("")}
  </table></div>
  <div class="row"><label>episode <select id="ep" onchange="location.hash='${hashOf({env, run, arm})}&episode='+encodeURIComponent(this.value)">
    ${mine.map(id => `<option ${id === epId ? "selected" : ""}>${esc(id)}</option>`).join("")}</select></label>
    ${D.spec ? `<a href="#${hashOf({env, arm})}">this arm's inputs</a>` : ""}</div>
  <div id="episode"></div>`;
  if (mine.length) showEpisode(env, run, epId && mine.includes(epId) ? epId : mine[0]);
}

async function showEpisode(env, run, id) {
  const el = $("episode");
  el.innerHTML = '<p class="mute">loading episode…</p>';
  const ep = await getEpisode(env, run, id);
  const links = [ep.docent_url ? `<a href="${esc(ep.docent_url)}" target="_blank" rel="noopener">Docent</a>` : ""].filter(Boolean).join(" · ");
  el.innerHTML = `<p class="mono">${esc(ep.id)} · finish ${esc(ep.finish)} ${ep.today ? "· date " + esc(ep.today) : ""} ${links ? "· " + links : ""}
    ${ep.build_check && ep.build_check !== "match" ? `<br><b>${esc(ep.build_check)}</b>` : ""}</p>
  ${(ep.messages || []).map(m => `<div class="msg ${esc(m.role)}"><div class="role">${esc(m.role)}${m.tool_calls ? " · " + m.tool_calls.map(t => esc(t.function.name)).join(", ") : ""}</div>`
    + (m.reasoning_content ? `<div class="think">${esc(m.reasoning_content)}</div>` : "") + esc(typeof m.content === "string" ? m.content : JSON.stringify(m.content))
    + (m.tool_calls ? m.tool_calls.map(t => `\n→ ${esc(t.function.name)}(${esc(t.function.arguments)})`).join("") : "") + "</div>").join("")}`;
}

function canonHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  let moved = false;
  for (const [old, neu] of Object.entries(LEGACY)) if (h.has(old)) { h.set(neu, h.get(old)); h.delete(old); moved = true; }
  if (moved) history.replaceState(null, "", "#" + h.toString());
  return Object.fromEntries(h);
}

async function route() {
  const h = canonHash();
  $("status").textContent = "";
  try {
    if (h.run) await runPage(h.env, h.run, h.arm, h.episode);
    else if (h.compare) await comparePage(h);
    else if (h.diff) await diffPage(h);
    else if (h.env && h.arm) await armPage(h);
    else if (h.env) await envPage(h);
    else await home();
  } catch (e) { $("status").textContent = "error: " + e.message; console.error(e); }
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
