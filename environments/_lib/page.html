<!--
  Static env viewer for environments/. No server. What the code declares (arms as build() makes them, comparisons,
  RETIRED, STARRED, README) comes from spec/ beside this page, built from main by the GitHub Pages workflow
  (`python -m environments spec --out`); an env whose code doesn't build there falls back to envs/<env>/spec/ on HF.
  Runs and rates (envs/<env>/index.json), Docent / expview / O-lens links (envs/<env>/links.json) and episode shards
  (by HTTP range request) come from the HF dataset under envs/, pinned to one commit; source files from GitHub at the
  commit the spec was built from. ?spec=hf ignores spec/ beside the page.

  Local:  python -m http.server 8000   (from the repo root, after `python -m environments index`), then
          http://localhost:8000/environments/_lib/page.html?base=/data/envs/&src=/
          base = a mirror of envs/ (data/envs/), src = the repo root to read source files from.
-->

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

.anschart .lab{fill:var(--fg);font-variant-numeric:tabular-nums} .anschart .ttl{fill:var(--fg);font-weight:600;font-size:12px} .anschart .ci{stroke:var(--mute);stroke-width:1.2}

<body>
<header class="top"><div class="in"><a class="brand" href="#"><b>◆</b> Environments</a><a href="#evals=1" style="font-size:13px">Evals</a><span id="crumb"></span></div></header>
<main>
<div id="status" class="mute">loading…</div>
<div id="view"></div>
<div id="drawcard" class="drawcard" hidden></div>
</main>
<script>
const REPO = "Robbie-Kylie-NN-sprint/counterfactual-investigator-agent-with-olens";
const GH = "robbiethompson18/counterfactual-investigator-agent-with-olens";
const DOCENT = "https://docent.transluce.org/dashboard/";
const params = new URLSearchParams(location.search);
let BASE = params.get("base");  // a local mirror of data/envs/, if given
const SRC = params.get("src");  // a local repo root to read source files from (default: GitHub at the spec's commit)
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const cache = {};
const md = t => window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(String(t))) : `<pre>${esc(t)}</pre>`;
const slug = s => String(s).replace(/\//g, ".").replace(/[^A-Za-z0-9_.+-]/g, "_");  // core.slug
const LEGACY = {ep: "episode"};

async function base() {
  if (BASE) return BASE;
  // pin every fetch to one commit: one API call, then only /resolve/<sha>/ (inside HF's anonymous limits)
  const r = await fetch(`https://huggingface.co/api/datasets/${REPO}/revision/main`);
  const sha = r.ok ? (await r.json()).sha : "main";
  return BASE = `https://huggingface.co/datasets/${REPO}/resolve/${sha}/envs/`;
}
// the code-side spec beside the page (spec/index.json lists the envs that built from main), else HF's envs/<env>/spec/
let CODE;
async function codeIndex() {
  if (CODE !== undefined) return CODE;
  if (params.get("spec") === "hf") return CODE = null;
  try { const r = await fetch("spec/index.json"); CODE = r.ok ? await r.json() : null; } catch { CODE = null; }
  return CODE;
}
async function getSpec(env, rel, asText = false) {
  const code = await codeIndex(), here = code?.envs.find(e => e.env === env && !e.error);
  if (!here) return asText ? getText(`${env}/spec/${rel}`) : getJSON(`${env}/spec/${rel}`);
  return fetchOnce("c:" + env + "/" + rel, async () => { const r = await fetch(`spec/${env}/${rel}`); if (!r.ok) throw new Error(`spec/${env}/${rel}: ${r.status}`); return asText ? r.text() : r.json(); });
}
function fetchOnce(key, f) { return cache[key] ??= f().catch(e => { delete cache[key]; throw e; }); }
async function getJSON(path) {
  return fetchOnce(path, async () => { const r = await fetch((await base()) + path); if (!r.ok) throw new Error(path + ": " + r.status); return r.json(); });
}
async function getText(path) {
  return fetchOnce("t:" + path, async () => { const r = await fetch((await base()) + path); if (!r.ok) throw new Error(path + ": " + r.status); return r.text(); });
}
const maybe = p => p.catch(() => null);
async function getEpisode(env, run, id) {
  const idx = await getJSON(`${env}/${run}/episodes/index.json`);
  const [shard, off, len] = idx[id];
  const r = await fetch((await base()) + `${env}/${run}/episodes/${shard}`, {headers: {Range: `bytes=${off}-${off + len - 1}`}});
  const buf = new Uint8Array(await r.arrayBuffer());  // 206 = just this episode; a server without Range sends the shard
  return JSON.parse(new TextDecoder().decode(r.status === 206 ? buf : buf.slice(off, off + len)));
}
async function sourceText(spec, path) {
  if (SRC) return fetchOnce("s:" + path, async () => { const r = await fetch(SRC + path); if (!r.ok) throw new Error(path + ": " + r.status); return r.text(); });
  const sha = (spec.git_sha || "main").replace("+dirty", "");
  return fetchOnce("s:" + path, async () => {
    for (const ref of [sha, "main"]) {  // the spec's commit may be unpushed (or a local merge); main is the fallback
      const r = await fetch(`https://raw.githubusercontent.com/${GH}/${ref}/${path}`);
      if (r.ok) return (ref === sha ? "" : `# (commit ${sha.slice(0, 10)} is not on GitHub: showing main)\n`) + await r.text();
    }
    throw new Error(path + ": not on GitHub");
  });
}
const ghLink = (spec, path) => `https://github.com/${GH}/blob/${(spec.git_sha || "main").replace("+dirty", "")}/${path}`;

// ---- rates with uncertainty: a Beta(1,1) prior, so k of n gives the posterior Beta(k+1, n-k+1); intervals are its
// equal-tailed 95% credible interval, drawn as a translucent band behind a line at the observed rate k/n
function lgamma(x) {  // Lanczos
  const g = [676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61503916999185, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (x < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * x))) - lgamma(1 - x);
  x -= 1; let a = 0.99999999999980993; const t = x + 7.5;
  for (let i = 0; i < 8; i++) a += g[i] / (x + i + 1);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}
function betacf(a, b, x) {  // continued fraction for the incomplete beta (Numerical Recipes)
  let c = 1, d = 1 - (a + b) * x / (a + 1); d = 1 / (Math.abs(d) < 1e-300 ? 1e-300 : d); let h = d;
  for (let m = 1; m <= 300; m++) {
    const m2 = 2 * m;
    for (const aa of [m * (b - m) * x / ((a - 1 + m2) * (a + m2)), -(a + m) * (a + b + m) * x / ((a + m2) * (a + 1 + m2))]) {
      d = 1 + aa * d; d = 1 / (Math.abs(d) < 1e-300 ? 1e-300 : d); c = 1 + aa / c; if (Math.abs(c) < 1e-300) c = 1e-300; h *= d * c;
    }
    if (Math.abs(d * c - 1) < 1e-12) break;

// ---------------------------------------------------------------- data

// retired arms (RETIRED in env.py) are left out of comparisons, rates and runs unless the hash has retired=show
async function envData(env, h = {}) {
  const [idx, spec, links] = await Promise.all([maybe(getJSON(`${env}/index.json`)), maybe(getSpec(env, "env.json")), maybe(getJSON(`${env}/links.json`))]);
  if (!idx && !spec) throw new Error(`no index or spec for ${env}`);
  const D = {env, idx: idx || {runs: [], pairs: {}, arms: spec.arms, arm_factors: spec.arm_factors, primary: spec.primary, title: env},
             spec, links: links || {runs: {}}, showRetired: h.retired === "show"};
  const R = new Set(spec?.retired || []);
  if (R.size && !D.showRetired) {
    const live = a => !R.has(a);
    // a set that shrinks to an earlier comparison's arms is dropped (one read per model, per_target, is a different set)
    const seen = new Set(), key = c => JSON.stringify([c.arms, c.per_target ?? null]);
    D.spec = {...spec, comparisons: spec.comparisons.map(c => ({...c, arms: c.arms.filter(live)}))
      .filter(c => c.arms.length >= 2 && !seen.has(key(c)) && seen.add(key(c)))};
    D.idx = {...D.idx, runs: D.idx.runs.map(r => ({...r, arms: Object.fromEntries(Object.entries(r.arms).filter(([a]) => live(a)))}))
      .filter(r => Object.keys(r.arms).length)};
  }
  D.retiredNote = R.size ? `<span class="mute">${R.size} retired arms (RETIRED in env.py) ${D.showRetired ? "shown" : "hidden"}:
    <a href="#${setParam("retired", D.showRetired ? "" : "show")}">${D.showRetired ? "hide" : "show"} them</a></span>` : "";
  return D;
}
// a run's target model plus its thinking mode: never pool thinking on with off (different rates)
const targetKey = r => r.target + (r.thinking === false ? " · thinking off" : r.thinking === true ? " · thinking on" : "");
// pooled primary per (arm, target) and per (arm, target, item), over runs
function pooled(idx) {
  const by = {}, items = {}, itemsBy = {}, targets = new Set();
  for (const r of idx.runs) for (const [arm, a] of Object.entries(r.arms)) {
    const tgt = targetKey(r);
    targets.add(tgt);
    const p = by[arm + "\u0000" + tgt] ??= {k: 0, n: 0, eps: 0, runs: 0, type: a.primary.type};
    p.eps += a.n; p.runs += 1;
    if (a.primary.type === "bool") {
      p.k += a.primary.k; p.n += a.primary.n;
      for (const [it, [k, n]] of Object.entries(a.primary.items || {})) {
        const q = items[arm + "\u0000" + tgt + "\u0000" + it] ??= {k: 0, n: 0};
        q.k += k; q.n += n;

  return s.n ? s : null;
}

  if (m.tool_calls) s = (isRef(s) ? "" : s) + m.tool_calls.map(t => `\n→ ${t.function?.name}(${t.function?.arguments})`).join("");

// ---------------------------------------------------------------- diff

function foldLines(s, keep = 3) {
  const lines = s.split("\n");
  if (lines.length <= 2 * keep + 3) return esc(s);
  return esc(lines.slice(0, keep).join("\n")) + "\n" +
    `<span class="fold" onclick="this.nextElementSibling.hidden=false;this.remove()">… ${lines.length - 2 * keep} unchanged lines (click to show) …</span>` +
    `<span hidden>${esc(lines.slice(keep, -keep).join("\n"))}\n</span>` + esc(lines.slice(-keep).join("\n"));
}
function diffHtml(a, b) {
  if (!window.Diff) return `<div class="mute">jsdiff didn't load; showing both</div><div class="diff">${esc(a)}</div><div class="diff">${esc(b)}</div>`;
  const parts = Diff.diffLines(a, b);
  let h = "";
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i], q = parts[i + 1];
    if (p.removed && q?.added && p.value.length + q.value.length < 40000) {  // a changed block: word-level inside it
      for (const w of Diff.diffWordsWithSpace(p.value, q.value)) h += w.added ? `<ins>${esc(w.value)}</ins>` : w.removed ? `<del>${esc(w.value)}</del>` : esc(w.value);
      i++;
    } else if (p.added) h += `<ins>${esc(p.value)}</ins>`;
    else if (p.removed) h += `<del>${esc(p.value)}</del>`;
    else h += foldLines(p.value);
  }
  return `<div class="diff">${h}</div>`;
}

function pairSections(sa, sb) {
  const B = new Map(sb.map(s => [s[0], s])), names = [...sa.map(s => s[0]), ...sb.map(s => s[0]).filter(n => !sa.some(s => s[0] === n))];
  const A = new Map(sa.map(s => [s[0], s]));
  return names.map(n => {
    const a = A.get(n)?.[1], b = B.get(n)?.[1];
    const same = a !== undefined && b !== undefined && (isRef(a) && isRef(b) ? a.$f === b.$f : !isRef(a) && !isRef(b) && a === b);
    return {name: n, a, b, same};
  });
}
async function renderDiff(env, armA, armB, item, el) {
  el.innerHTML = '<p class="mute">building diff…</p>';
  const [ea, eb] = await Promise.all([built(env, armA, item), built(env, armB, item)]);
  if (!ea || !eb) { el.innerHTML = `<p class="mute">item ${esc(item)} isn't built for ${esc(!ea ? armA : armB)}</p>`; return; }
  const pairs = pairSections(sections(ea), sections(eb));
  const changed = pairs.filter(p => !p.same);
  let h = `<p><b>${changed.length}</b> of ${pairs.length} sections differ between <span class="mono">${esc(armA)}</span> (<del>red</del>) and <span class="mono">${esc(armB)}</span> (<ins>green</ins>) on item <span class="mono">${esc(item)}</span>.
    ${changed.length ? "" : "The two arms send byte-identical inputs on this item."}</p>`;
  for (const p of pairs) {
    const tag = p.same ? '<span class="tag">same</span>' : p.a === undefined ? '<span class="tag add">only in B</span>' : p.b === undefined ? '<span class="tag ch">only in A</span>' : '<span class="tag ch">changed</span>';
    h += `<details class="sec" ${p.same ? "" : "open"} data-name="${esc(p.name)}"><summary>${esc(p.name)} ${tag}</summary><div class="body"></div></details>`;
  }
  el.innerHTML = h;
  for (const d of el.querySelectorAll("details.sec")) {
    const p = pairs.find(x => x.name === d.dataset.name);
    const fill = async () => {
      if (d.dataset.done) return; d.dataset.done = 1;
      const [ta, tb] = await Promise.all([p.a === undefined ? "" : text(env, p.a), p.b === undefined ? "" : text(env, p.b)]);
      d.querySelector(".body").innerHTML = p.same ? `<div class="diff">${foldLines(ta, 8)}</div>` : diffHtml(ta, tb);

}

// ---------------------------------------------------------------- rollouts

// episodes of an arm (on one item, or all), pooled over runs and grouped by model: [{target, eps: [{run, id, docent,
// v, collection, read}]}]. Runs are storage, not something the page shows: an episode is (model, episode id).

  const pre = `${slug(arm)}~${item == null ? "" : slug(item) + "~"}`, by = {};
  for (const [run, r] of Object.entries(D.links.runs || {}))
    for (const [id, [docent, v]] of Object.entries(r.episodes || {}))
      if (id.startsWith(pre)) (by[targetKey(r)] ??= []).push({run, id, docent, v, collection: r.docent_collection, read: (r.reads || {})[id]});

// the run rides along in the link only to tell apart top-up runs that reused sample numbers; the page never shows it
const epHash = (D, target, e) => hashOf({env: D.env, model: target, episode: e.id, run: e.run});
// expview lives beside this page (expview/ on the same site; ?expview= overrides): it reads the env run folders
// directly, so every env, arm and episode has a page, with any O-lens / judge runs attached to the episode
const EV = params.get("expview") || "expview/";
const evq = o => EV + "#" + Object.entries(o).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join("&");
// an episode is (model, episode id); expview resolves the run itself. `run` goes along only when top-up runs repeated
// the episode id for this model, so the link opens the exact one

  const dl = e.docent && e.collection ? `${DOCENT}${e.collection}/agent_run/${e.docent}` : null, here = "#" + epHash(D, target, e);

    (dl ? `<a class="x" href="${here}" title="transcript on this page">↗</a>` : "") +

  if (!groups.length) return `<div class="card">${head}<p class="mute" style="margin:0">no rollouts${item == null ? "" : " on this item"} yet</p></div>`;

  const envs = code.envs.map((c, i) => {
    const runs = idxs[i]?.runs || [];
    return {env: c.env, title: c.title || c.env, status: c.error ? "BROKEN" : c.status, starred: c.starred, primary: c.primary || idxs[i]?.primary,
      error: c.error, n_runs: runs.length, targets: runs.reduce((t, r) => (t[r.target] = (t[r.target] || 0) + (r.n_episodes || 0), t), {}),
      latest: runs.map(r => r.created || "").sort().pop() || ""};
  });
  return {generated: envs.map(e => e.latest).sort().pop() || "", envs};
}

const retiredTag = (D, arm) => (D.spec?.retired || []).includes(arm) ? '<span class="tag" title="RETIRED in env.py: tried and set aside">retired</span>' : "";

function tabs(env, on) {

  return `<div class="tabs">${T.map(([k, l]) => `<a href="#env=${env}&tab=${k}" class="${on === k ? "on" : ""}">${l}</a>`).join("")}</div>`;
}

async function envPage(h) {
  const env = h.env, tab = h.tab || "compare";

function compareList(D) {
  const P = pooled(D.idx), groups = {};
  for (const c of D.spec.comparisons) (groups[c.group || (c.kind === "pair" ? "Pairs" : "Sets")] ??= []).push(c);
  const card = c => {
    const ts = P.targets.filter(t => c.arms.some(a => P.by[a + "\u0000" + t]?.n));
    const body = ts.length ? ts.map(t => `<span class="tg">${esc(modelName(t))}</span>` + c.arms.map((a, i) => {
      const p = c.items ? onItems(P, a, t, c.items) : P.by[a + "\u0000" + t], v = pctOf(p);
      const d = i ? deltaBadge(matchedDelta(P, c.arms[0], a, t, c.items)) : "";
      return `<span class="arm" title="${esc(a)}">${esc(a)}${retiredTag(D, a)}</span><span class="hbar">${p?.n ? ciBar(p.k, p.n, "b") : '<span class="b"></span>'}
        <span class="v">${v == null ? "not run" : `${(100 * v).toFixed(0)}% <span style="color:var(--faint)">/${p.n}</span>`}</span><span class="dl">${d}</span></span>`;
    }).join("")).join("") : c.arms.map(a => `<span class="arm">${esc(a)}${retiredTag(D, a)}</span><span class="mute">not run</span>`).join("");
    return `<a class="card" href="#${hashOf({env: D.env, compare: c.name, retired: D.showRetired ? "show" : null})}">
      <div class="t">${esc(c.name)}</div><div class="why">${esc(c.why || (c.kind === "pair" ? `${c.arms[0]} → ${c.arms[1]}` : ""))}${c.items ? ` · ${c.items.length} items` : ""}</div>
      <div class="mini">${body}</div></a>`;
  };
  $("tab").innerHTML = `<p class="lede">Pairs are the env's declared clean counterfactuals (<span class="mono">PAIRS</span>); sets are arms worth viewing side by side
    (<span class="mono">COMPARISONS</span>). Bars are the primary rate over every episode per model, thinking on and off apart; the pill is each arm minus the first on the items both were run on,
    coloured when its 95% interval excludes zero. Bands are 95% credible intervals (Beta(1,1) prior), the line the observed rate.</p>` +
    Object.entries(groups).map(([g, cs]) => `<h3>${esc(g)}</h3><div class="cards">${cs.map(card).join("")}</div>`).join("");
}

async function comparePage(h) {
  const D = await envData(h.env, h);
  const c = D.spec.comparisons.find(x => x.name === h.compare);
  if (!c) throw new Error(`no comparison ${h.compare}` + (D.showRetired ? "" : " (it may only have retired arms: add &retired=show)"));
  setCrumb([[h.env, "env=" + h.env], [c.name]]);
  const P = pooled(D.idx);
  const baseArm = h.base && c.arms.includes(h.base) ? h.base : c.arms[0];
  const other = h.other && c.arms.includes(h.other) && h.other !== baseArm ? h.other : c.arms.find(a => a !== baseArm);
  const shared = itemsOf(D.spec, baseArm).filter(it => itemsOf(D.spec, other).includes(it));
  const items = c.items ? shared.filter(it => c.items.map(String).includes(it)) : shared;
  const item = items.includes(h.item) ? h.item : items[0];
  const go = o => "#" + hashOf({env: h.env, compare: c.name, base: baseArm === c.arms[0] ? null : baseArm, other, item, retired: h.retired, ...o});
  const usedT = P.targets.filter(t => c.arms.some(a => P.by[a + "\u0000" + t]));
  const pct = p => p && p.n ? p.k / p.n : null;
  // which sections differ from the base arm, per arm (on this item): the set's "what changes" overview
  const eps = await Promise.all(c.arms.map(a => built(h.env, a, item).catch(() => null)));
  const sb = eps[c.arms.indexOf(baseArm)] ? sections(eps[c.arms.indexOf(baseArm)]) : [];
  const changes = c.arms.map((a, i) => !eps[i] ? null : pairSections(sb, sections(eps[i])).filter(p => !p.same && !p.name.startsWith("meta")).map(p => p.name));  // what the model sees
  // one scale for every Δ bar on the page, so they compare: the widest credible interval, rounded up to 10pp
  const S = Math.max(10, ...c.arms.flatMap(a => a === baseArm ? [] : usedT.map(t => { const x = matchedDelta(P, baseArm, a, t, c.items);
    return x ? Math.ceil(Math.max(Math.abs(x.lo), Math.abs(x.hi)) / 10) * 10 : 0; })));
  const effects = usedT.map(t => {
    const mm = matched(P, baseArm, other, t, c.items);
    if (!mm) return "";
    const [a, b, nIt] = mm, x = deltaOf(a, b);
    const cls = x.lo > 0 ? "up" : x.hi < 0 ? "down" : "";
    return `<div class="effect"><div class="m" title="${esc(t)}">${esc(modelName(t))}</div><div class="big ${cls}">${x.d >= 0 ? "+" : ""}${x.d.toFixed(0)}<span style="font-size:15px">pp</span></div>
      <div class="sub">${(100 * pctOf(a)).toFixed(0)}% → ${(100 * pctOf(b)).toFixed(0)}% · n ${a.n} / ${b.n} on ${nIt} shared items<br>95% CrI ${x.lo.toFixed(0)} to ${x.hi.toFixed(0)}pp</div></div>`;
  }).join("");
  $("view").innerHTML = `<p><a href="#env=${h.env}&tab=compare">← comparisons</a>${D.retiredNote ? " · " + D.retiredNote : ""}</p>
  <h1>${esc(c.name)} <span class="badge" style="vertical-align:4px">${c.kind === "pair" ? "pair" : "set"}</span></h1>
  <p class="lede">${c.why ? esc(c.why) + ". " : ""}Effect of <span class="mono">${esc(baseArm)}</span> → <span class="mono">${esc(other)}</span> on <span class="mono">${esc(D.idx.primary)}</span>, pooled over every episode, on the items both arms were run on:</p>
  ${effects ? `<div class="effects">${effects}</div>` : '<p class="mute">No runs of both arms yet.</p>'}
  <h2>Arms</h2>
  <div class="scroll"><table><tr><th>arm</th><th>diff vs base</th><th>sections that differ from the base on item ${esc(item)}</th>${usedT.map(t => `<th title="${esc(t)}">${esc(modelName(t))}<br><span style="font-weight:400;text-transform:none">all items · this item</span></th>`).join("")}</tr>
  ${c.arms.map((a, i) => {
    const isB = a === baseArm;
    return `<tr class="${a === other ? "on" : ""}"><td class="mono"><a href="#${hashOf({env: h.env, arm: a, item})}">${esc(a)}</a>${retiredTag(D, a)}
      <br><span style="font-family:Inter,system-ui">${armExpview(D, a, "expview ↗")}</span></td>
      <td>${isB ? "<b>base</b>" : `<a href="${go({other: a})}">${a === other ? "<b>shown</b>" : "show"}</a> · <a href="${go({base: a, other: baseArm})}" title="make this the base">base</a>`}</td>
      <td class="mono">${isB ? "" : changes[i] == null ? '<span class="mute">not built on this item</span>' : changes[i].length ? changes[i].map(esc).join("<br>") : '<span class="mute">identical</span>'}</td>
      ${usedT.map(t => {
        const p = P.by[a + "\u0000" + t], q = P.items[a + "\u0000" + t + "\u0000" + item], b = P.by[baseArm + "\u0000" + t];
        const x = !isB && p?.type === "bool" ? matchedDelta(P, baseArm, a, t, c.items) : null;
        const d = x ? `<div class="rate" style="margin-top:4px">${deltaBar(x, S)}${deltaBadge(x)} <span class="ci">[${x.lo.toFixed(0)}, ${x.hi.toFixed(0)}]</span></div>` : "";
        return `<td>${p ? (p.type === "bool" ? rate(p.k, p.n) + d : `${p.eps} eps`) : '<span class="mute">not run</span>'}${q ? `<br><span class="mono mute">this item ${q.k}/${q.n}</span>` : ""}</td>`;
      }).join("")}</tr>`;
  }).join("")}
  </table></div>
  ${perItemTable(D, P, baseArm, other, usedT, items, go)}
  <div class="row"><label>item <select onchange="location.hash='${go({item: "__"})}'.replace('__', encodeURIComponent(this.value))">${items.map(it => `<option ${it === item ? "selected" : ""}>${esc(it)}</option>`).join("")}</select></label>
    <span class="mute">${items.length} items${c.items ? " (the pair's subset)" : ""} · built for sample 0 on ${esc(D.spec.built_for?.today)}</span></div>
  <h2>Rollouts on item ${esc(item)}</h2>
  <p class="lede">Chips are episodes on this item (✓ / ✗ = ${esc(D.idx.primary)}): click opens Docent, ↗ the transcript here, ev the episode in expview (lens when it has O-lens reads).</p>
  <div class="cols" style="grid-template-columns:1fr 1fr">${rolloutsHtml(D, baseArm, item)}${rolloutsHtml(D, other, item)}</div>
  <h2>What changes: <span class="mono">${esc(baseArm)}</span> → <span class="mono">${esc(other)}</span></h2>
  <div id="diff"></div>`;
  await renderDiff(h.env, baseArm, other, item, $("diff"));
}

function perItemTable(D, P, a, b, targets, items, go) {
  const rows = [];
  for (const t of targets) for (const it of items) {
    const x = P.items[a + "\u0000" + t + "\u0000" + it], y = P.items[b + "\u0000" + t + "\u0000" + it];
    if (x || y) rows.push({t, it, x, y, d: x && y && x.n && y.n ? y.k / y.n - x.k / x.n : null});
  }
  if (!rows.length) return "";
  rows.sort((p, q) => (p.t > q.t) - (p.t < q.t) || Math.abs(q.d ?? -1) - Math.abs(p.d ?? -1));
  const f = q => q ? `${q.k}/${q.n}` : "–";
  return `<details class="sec"><summary>Per item, ${esc(a)} vs ${esc(b)} <span class="mute">(${rows.length} rows, biggest gaps first; which items carry the effect)</span></summary><div class="body scroll">
    <table><tr><th>target</th><th>item</th><th class="mono">${esc(a)}</th><th class="mono">${esc(b)}</th><th>Δ</th></tr>
    ${rows.map(r => `<tr class="click" onclick="location.hash='${go({item: r.it})}'"><td class="mono">${esc(r.t)}</td><td class="mono">${esc(r.it)}</td><td>${f(r.x)}</td><td>${f(r.y)}</td><td>${r.d == null ? "" : (r.d >= 0 ? "+" : "") + (100 * r.d).toFixed(0) + "pp"}</td></tr>`).join("")}
    </table></div></details>`;
}

function armsTab(D, h) {
  const F = D.spec.arm_factors || {}, keys = [...new Set(Object.values(F).flatMap(Object.keys))];
  const filt = Object.fromEntries(keys.filter(k => h[k]).map(k => [k, h[k]]));
  const R = new Set(D.spec.retired || []), showRetired = D.showRetired;
  const keep = arm => (showRetired || !R.has(arm)) && Object.entries(filt).every(([k, v]) => (F[arm] || {})[k] === v);
  const P = pooled(D.idx);
  const arms = D.spec.arms.filter(keep);
  const sel = k => `<label>${esc(k)} <select onchange="location.hash=setParam('${k}', this.value)"><option value="">all</option>${
    [...new Set(Object.values(F).map(f => f[k]).filter(Boolean))].sort().map(v => `<option ${filt[k] === v ? "selected" : ""}>${esc(v)}</option>`).join("")}</select></label>`;
  $("tab").innerHTML = `${keys.length ? `<div class="row">Filter by factor: ${keys.map(sel).join(" ")}</div>` : ""}
  <div class="row">Tick two arms to diff them: <button id="dodiff" disabled>diff</button> <span class="mute">${arms.length} arms</span></div>
  <div class="scroll"><table><tr><th></th><th>arm</th>${keys.map(k => `<th>${esc(k)}</th>`).join("")}<th>items</th>${P.targets.map(t => `<th title="${esc(t)}">${esc(modelName(t))}</th>`).join("")}</tr>
  ${arms.map(a => `<tr><td><input type="checkbox" class="pick" value="${esc(a)}"></td><td class="mono"><a href="#${hashOf({env: D.env, arm: a})}">${esc(a)}</a>${retiredTag(D, a)}</td>
    ${keys.map(k => `<td class="mono">${esc((F[a] || {})[k] || "")}</td>`).join("")}<td>${itemsOf(D.spec, a).length}</td>
    ${P.targets.map(t => { const p = P.by[a + "\u0000" + t]; return `<td>${p ? (p.type === "bool" ? rate(p.k, p.n) : p.eps + " eps") : ""}</td>`; }).join("")}</tr>`).join("")}
  </table></div>`;
  const picks = () => [...document.querySelectorAll(".pick:checked")].map(x => x.value);
  for (const x of document.querySelectorAll(".pick")) x.onchange = () => { $("dodiff").disabled = picks().length !== 2; };
  $("dodiff").onclick = () => { const [a, b] = picks(); location.hash = hashOf({env: D.env, diff: a + "," + b}); };
}

  ${inC.length ? `<p>In comparisons: ${inC.map(c => `<a class="chip" href="#${hashOf({env: h.env, compare: c.name, item})}">${esc(c.name)}</a>`).join("")}</p>` : ""}
  <div class="row"><label>item <select onchange="location.hash='${hashOf({env: h.env, arm})}&item='+encodeURIComponent(this.value)">${items.map(it => `<option ${it === item ? "selected" : ""}>${esc(it)}</option>`).join("")}</select></label>
    <label>diff against <select onchange="if(this.value)location.hash='${hashOf({env: h.env})}&diff='+encodeURIComponent('${arm},'+this.value)+'&item=${encodeURIComponent(item)}'"><option value="">…</option>${D.spec.arms.filter(a => a !== arm).map(a => `<option>${esc(a)}</option>`).join("")}</select></label>
    <span class="mono mute">uv run python -m environments run ${esc(h.env)} --arms ${esc(arm)} --items ${esc(item)}</span></div>
  <h2>Rollouts on item ${esc(item)}</h2>${rolloutsHtml(D, arm, item)}
  <h2>What the model gets (build(${esc(arm)}, ${esc(item)}), sample 0)</h2><div id="ep"></div>`;
  if (!ep) { $("ep").innerHTML = `<p class="mute">not built: ${esc(D.spec.build_errors?.[arm + "~" + item] || "")}</p>`; return; }
  const secs = sections(ep);
  $("ep").innerHTML = secs.map(([name, v, kind], i) => `<details class="sec" ${kind === "file" || kind === "harness" || kind === "meta" || kind === "tool" ? "" : "open"} data-i="${i}">

// ---------------------------------------------------------------- evals (cfbench; an eval can span envs, models and pairs)

// condition colours, the same in every chart (CLAUDE.md): transcript tools blue, O-lens orange, placebo black, no tools gray
const CONDS = {
  no_transcript: ["env diff only (no tool calls)", "var(--c-none)", "no tools"],
  transcript_agentic: ["transcript tools", "var(--c-ts)", "transcript"],
  olens_agentic: ["transcript + O-lens tools", "var(--c-olens)", "O-lens"],
  olens_placebo_agentic: ["transcript + O-lens placebo", "var(--c-placebo)", "placebo"],
  probe: ["linear probe of the model's answer (deterministic, no investigator)", "var(--c-probe)", "probe"],
  transcript_inline: ["prompt + reply in context, one turn (no tools)", "var(--c-ts-in)", "transcript (1 turn)"],
  olens_inline: ["prompt + reply + O-lens reads in context, one turn", "var(--c-olens-in)", "O-lens (1 turn)"],
  olens_placebo_inline: ["prompt + reply + another question's O-lens reads, one turn", "var(--c-placebo-in)", "placebo (1 turn)"],
};
// each condition's % right minus transcript tools' over the same items (environments/_lib/evals.py paired_vs)
function pairedTable(rows, caption) {
  if (!rows || !rows.length) return "";
  const sgn = v => (v >= 0 ? "+" : "") + (100 * v).toFixed(1);
  return `<p class="lede">${caption} Paired by item (an item's score = the mean over its draws): the difference in % right with a 95% bootstrap CI over items, the sign test over the items that differ (better / worse), two-sided and one-sided (the condition beats transcript tools).</p>
    <div class="scroll"><table><tr><th>condition</th><th>vs</th><th>items</th><th>Δ % right [95% CI]</th><th>better / worse</th><th>p (two-sided)</th><th>p (one-sided, &gt;)</th></tr>
    ${condOrder(rows.map(x => x.condition)).map(c => rows.find(x => x.condition === c)).map(x => `<tr><td>${swatch(x.condition)}${esc(condShort(x.condition))}</td><td>${esc(condShort(x.ref))}</td><td class="num">${x.n}</td>
      <td class="num"><b>${sgn(x.diff)}</b> <span class="mute">[${sgn(x.ci[0])}, ${sgn(x.ci[1])}]</span></td><td class="num">${x.better} / ${x.worse}</td>
      <td class="num">${x.p_two < 0.001 ? x.p_two.toExponential(1) : x.p_two.toFixed(3)}</td><td class="num"><b>${x.p_one < 0.001 ? x.p_one.toExponential(1) : x.p_one.toFixed(3)}</b></td></tr>`).join("")}</table></div>`;
}
const condOrder = cs => [...cs].sort((a, b) => (Object.keys(CONDS).indexOf(a) + 99 * !(a in CONDS)) - (Object.keys(CONDS).indexOf(b) + 99 * !(b in CONDS)));
const condLabel = c => CONDS[c]?.[0] || c, condColor = c => CONDS[c]?.[1] || "var(--c-other)", condShort = c => CONDS[c]?.[2] || c;

// evals/ sits beside envs/ (HF, or the local mirror)

// answer-task chart: a panel per (env, version, base → cf, investigator) pooling the ticked runs, one bar per condition =

// the shown arm answered with one letter in every sample (e.g. followed the hint 8/8); n_cf stands in for its sample count

    const pred = R.predictors.join("+"), key = [g.env, g.version || "", g.base, g.cf, pred].join("\u0000");
    const P = panels[key] ??= {env: g.env, version: g.version, base: g.base, cf: g.cf, pair: g.pair, pred, runs: new Set(), items: {}, letters: new Set()};
    P.runs.add(R.slug);
    for (const it of g.items) {
      if (unan && !unanimous(it)) continue;
      const I = P.items[it.item ?? ""] ??= {};
      for (const [k, ds] of Object.entries(it.draws)) (I[k] ??= []).push(...ds.map(d => +d.correct));

      <text x="${x}" y="${f(y(hi) - 5)}" class="lab" text-anchor="middle">${pp(st.mean)}%</text><text x="${x}" y="${H - B + 16}" class="ax" text-anchor="middle">${esc(condShort(k))}</text>`;

      <td>${esc(shortModel(p.models[0]))} <span class="mute">(${pp(p.truth[0])}%)</span></td><td class="num">${pp(p.mean_p[0])}%</td>

      <td class="num"><b>${p.auroc == null ? "–" : p.auroc.toFixed(2)}</b> <span class="mute">n ${p.n[0]}/${p.n[1]}</span></td></tr>`).join("") : ""}</table></div>` : "";
  // sections: env → version → base → cf, a card per model, every run
  const sections = {};
  for (const R of runs) for (const g of R.groups.filter(keep)) (sections[[g.env, g.version || "", g.pair || "", g.reverse, g.base, g.cf].join("\u0000")] ??= []).push([R, g]);
  const body = Object.values(sections).map(gs => {
    const g0 = gs[0][1];
    return `<h2><span class="mono">${esc(g0.env)}</span>${g0.version ? ` · ${esc(g0.version)}` : ""} · ${esc(g0.base)} → ${esc(g0.cf)}
      ${g0.pair ? ` <span class="mute" style="font-weight:400;font-size:14px">pair ${esc(g0.pair)}${g0.reverse ? ", reversed" : ""}</span>` : ""}</h2>` +
      `<div class="evcases">${gs.map(([R, g]) => (runs.length > 1 ? `<div><h3 style="margin-top:0">${esc(R.slug)}</h3>` : "<div>") + evalCard(R, g) + "</div>").join("")}</div>`;
  }).join("");
  $("view").innerHTML = `<p><a href="#evals=1">← evals</a></p><h1>${esc(ev.title)}</h1>
    ${retired ? `<p class="mute"><span class="tag">retired</span> Set aside (RETIRED_EVALS in environments/_lib/evals.py): not on the Evals list; this page stays for reference.</p>` : ""}
    <p class="mute">envs: ${ev.envs.map(e => `<a class="chip" href="#env=${esc(e)}">${esc(e)}</a> <a class="mute" href="#${hashOf({eval: h.eval, env: e})}">only its cases</a>`).join(" ")}
      ${h.env ? ` · <a href="#${hashOf({eval: h.eval})}">all envs</a>` : ""}</p>
    <p>Every investigator conversation in expview: ${all.filter(R => R.expview).map(R => `<a class="chip" href="${evq({dataset: R.expview})}" target="_blank" rel="noopener">${esc(R.slug)} ↗</a>`).join(" ")}</p>
    ${ans.length ? answerChartBlock(ans, h, keep) : ""}
    <details class="sec"><summary>About this eval</summary><div class="body readme">${md(ev.description || "")}</div></details>
    ${runs.length ? `<p class="lede">Each chart has the observed rate before (base arm) and after (counterfactual arm), bands = 95% credible intervals (Beta(1,1)), and every investigator
      draw as a point, coloured by condition; the dashed line is the null "the edit does nothing" (predict the base rate the investigator was shown). Click a point for
      everything that investigator saw and said (prompt, tool calls and results, submit) in expview.</p>` : ""}
    ${claim.length ? claimSection(ev, claim, keep, h) : ""}
    ${claim.length ? questionTable([...claim], h) : ""}
    ${runs.length ? `${runs.map(R => rmseCiBlock(R.rmse, R.rmse_null, R.boot, `${esc(R.slug)} · harness v${R.harness_version}`)).join("")}
      ${ev.pooled && !h.run && !h.env ? rmseCiBlock(ev.pooled.rmse, ev.pooled.rmse_null, ev.pooled.boot, `pooled over ${ev.pooled.runs.length} runs`) : ""}
      ${pairedHtml}<details class="sec"><summary>RMSE over all cases (vs "the edit does nothing")</summary><div class="body">${summary}</div></details>${body}` : ""}${ansSummary}${ans.length ? questionTable([...ans], h) : ""}${ansBody}
    ${older.length ? `<details class="sec"><summary>Older runs (${older.length}): superseded by the runs above</summary><div class="body"><ul>${older.map(R =>
      `<li><a class="mono" href="#${hashOf({eval: h.eval, run: R.run})}">${esc(R.slug)}</a> <span class="mute">${esc(R.date)} · ${R.n_cases} cases · ${R.versions ? esc(R.versions.join(", ")) : ""}${R.inputs ? ` · inputs ${esc(R.inputs)}` : ""}</span></li>`).join("")}</ul></div></details>` : ""}`;
}

// claim evals (cfbench/evals CLAUDE.md, TASK = "claim"): the investigator gives P(a claim is true), truth 0 or 1 per case,
// e.g. "the target model is the alignment-faking one". Scored by Brier (af_which/score.py); 0.25 = always answering 0.5.
const br = (x, ci) => {
  const cls = ci && ci[1] < 0.25 ? "up" : ci && ci[0] > 0.25 ? "down" : "flat";
  return `<span class="delta ${cls}" title="95% bootstrap CI over items ${ci ? ci.map(v => v.toFixed(3)).join("–") : ""}; 0.25 = always 0.5">${x.toFixed(3)}</span>${ci ? ` <span class="mute">[${ci.map(v => v.toFixed(2)).join(", ")}]</span>` : ""}`;
};
// % right per condition as bars with 95% CI whiskers, chance (50%) dashed: a claim eval's table rows of one version
function accuracyBars(rows) {
  const conds = condOrder(rows.map(x => x.condition)), L = 44, T = 16, B = 40, H = 240, cw = 96, W = L + 16 + cw * conds.length + 10;
  const y = v => T + (1 - v) * (H - T - B), f = v => v.toFixed(1);
  let s = "";
  for (const v of [0, 0.25, 0.5, 0.75, 1]) s += `<line x1="${L}" x2="${W - 10}" y1="${f(y(v))}" y2="${f(y(v))}" class="${v === 0.5 ? "null" : "grid"}"/><text x="${L - 6}" y="${f(y(v) + 4)}" class="ax" text-anchor="end">${100 * v}%</text>`;
  conds.forEach((k, i) => {
    const x = rows.find(r => r.condition === k), cx = L + 16 + cw * i + cw / 2, [lo, hi] = x.accuracy_ci || [x.accuracy, x.accuracy];
    s += `<rect x="${f(cx - 26)}" y="${f(y(x.accuracy))}" width="52" height="${f(y(0) - y(x.accuracy))}" fill="${condColor(k)}" opacity="0.85"><title>${esc(condLabel(k))}: ${pct(x.accuracy)} right, 95% CI ${pct(lo)}–${pct(hi)}</title></rect>`;
    s += `<line x1="${cx}" x2="${cx}" y1="${f(y(hi))}" y2="${f(y(lo))}" stroke="var(--fg,#222)" stroke-width="1.5"/><line x1="${cx - 8}" x2="${cx + 8}" y1="${f(y(hi))}" y2="${f(y(hi))}" stroke="var(--fg,#222)" stroke-width="1.5"/><line x1="${cx - 8}" x2="${cx + 8}" y1="${f(y(lo))}" y2="${f(y(lo))}" stroke="var(--fg,#222)" stroke-width="1.5"/>`;
    s += `<text x="${cx}" y="${f(y(hi) - 5)}" class="ax" text-anchor="middle">${pct(x.accuracy)}</text><text x="${cx}" y="${H - B + 18}" class="lab" text-anchor="middle">${esc(condShort(k))}</text>`;
  });
  return `<div class="scroll"><svg class="evchart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="% right per condition with 95% CIs">${s}</svg></div>`;
}
// claim evals whose score.py reports % right (guess = p >= 0.5, e.g. hint_qwen_dsv4): that is the headline, AUROC second
function accuracyTable(t, models) {
  const ci = c => c ? ` <span class="mute">[${c.map(v => pct(v)).join(", ")}]</span>` : "";
  const rows = t.rows.map(x => `<tr><td>${swatch(x.condition)}${esc(condShort(x.condition))}</td><td>${esc(x.version)}</td><td class="num">${x.n_items}</td>
    <td class="num"><b>${pct(x.accuracy)}</b>${ci(x.accuracy_ci)}</td>
    ${models.map(m => `<td class="num">${x.accuracy_by_class?.[m] == null ? "–" : pct(x.accuracy_by_class[m])}</td>`).join("")}
    <td class="num">${x.auroc == null ? "–" : x.auroc.toFixed(2)}</td><td class="num mute">${x.mean_brier == null ? "–" : x.mean_brier.toFixed(3)}</td><td class="num">${x.invalid || 0}</td></tr>`).join("");
  const versions = [...new Set(t.rows.map(x => x.version))], top = versions.includes("pooled") ? "pooled" : versions[0];
  return `<h3>Inputs <span class="mono">${esc(t.inputs || "?")}</span> <span class="mute" style="font-weight:400;font-size:13px">runs ${t.runs.map(esc).join(" + ")}</span></h3>
    ${accuracyBars(t.rows.filter(x => x.version === top))}
    <p class="lede">% of guesses right (guess = p ≥ 0.5; classes balanced, so chance is 50%, dashed), with a 95% bootstrap CI over items; per class; AUROC of p (calibration-free); Brier for reference.</p>
    <div class="scroll"><table><tr><th>investigator</th><th>version</th><th>items</th><th>% right [95% CI]</th>
      ${models.map(m => `<th>% right on<br><span class="mono">${esc(shortModel(m))}</span></th>`).join("")}<th>AUROC</th><th>Brier (reference)</th><th>invalid</th></tr>${rows}</table></div>
    ${Object.entries(t.paired || {}).map(([v, ps]) => pairedTable(ps, `Against transcript tools, ${esc(v)}.`)).join("")}`;
}
function claimSection(ev, claim, keep, h) {
  const faker = m => (claim.flatMap(R => R.groups).find(g => g.model === m) || {}).k_cf === 1;
  const models = [...new Set(claim.flatMap(R => R.models))].sort((a, b) => faker(b) - faker(a));
  const pairEval = claim.some(R => R.groups.some(g => g.n_shown === 2));
  const tables = (ev.claim_tables || []).map(t => {
    if (t.rows.some(x => x.accuracy != null)) return accuracyTable(t, models);  // evals scored by % right (their score.py)
    const pairCols = t.rows.some(x => x.pick_accuracy != null);
    const rows = t.rows.map(x => `<tr${x.version === "pooled" ? ' class="pooled"' : ""}><td>${swatch(x.condition)}${esc(condShort(x.condition))}</td><td>${x.version === "pooled" ? "<b>pooled</b>" : esc(x.version)}</td><td class="num">${x.n}</td>
      <td class="num">${br(x.mean_brier, x.mean_brier_ci)}</td><td class="num">${br(x.brier_pbar, x.brier_pbar_ci)}</td>
      ${models.map(m => `<td class="num">${x.pbar[m] == null ? "–" : x.pbar[m].toFixed(2)}</td>`).join("")}
      <td class="num"><b>${x.auroc == null ? "–" : x.auroc.toFixed(2)}</b></td>
      ${pairCols ? `<td class="num">${x.pick_accuracy == null ? "–" : pct(x.pick_accuracy)}</td><td class="num">${x.order_consistency == null ? "–" : x.order_consistency.toFixed(3)}</td>` : ""}
      <td class="num">${x.invalid || 0}</td></tr>`).join("");
    return `<h3>Inputs <span class="mono">${esc(t.inputs || "?")}</span> <span class="mute" style="font-weight:400;font-size:13px">runs ${t.runs.map(esc).join(" + ")}</span></h3>
      <div class="scroll"><table><tr><th>investigator</th><th>version</th><th>predictions</th><th title="mean over every prediction of (p - truth)²">mean Brier [95% CI]</th>
        <th title="per model, the mean p over its cases; then the mean over the two models of (p̄ - truth)²">Brier(p̄) [95% CI]</th>
        ${models.map(m => `<th>p̄ ${pairEval ? "when A = " : ""}${esc(shortModel(m))}<br><span class="mute">truth ${faker(m) ? 1 : 0}</span></th>`).join("")}
        <th title="the faker's predictions vs the other model's: 1 = always higher for the faker, 0.5 = can't tell">AUROC</th>
        ${pairCols ? `<th title="share of predictions on the right side of 0.5">pick accuracy</th><th title="mean over items of |p(order 0) - (1 - p(order 1))|: 0 = swapping A and B mirrors the answer">order consistency</th>` : ""}
        <th>invalid</th></tr>${rows}</table></div>`;
  }).join("");
  // dot strips: per (inputs, version) one chart, a column pair per condition, every draw clickable
  const strips = {};
  for (const R of claim) for (const g of R.groups.filter(keep)) (strips[[R.inputs || "", g.version || ""].join("\u0000")] ??= []).push([R, g]);
  const body = Object.values(strips).map(gs => {
    const [R0, g0] = gs[0];
    const ctx = models.map(m => { const g = gs.find(([, g]) => g.model === m)?.[1]; return !g ? "" : ev.name.startsWith("af_") ? `${esc(shortModel(m))}: public ${g.k_base}/${g.n_base}, preview ${g.k_cf_pool}/${g.n_cf_pool} = ${pp(g.k_cf_pool / g.n_cf_pool)}% (${faker(m) ? "the faker" : "doesn't fake"})`
      : `${esc(shortModel(m))}: claim ${faker(m) ? "true" : "false"}, counterfactual arm ${g.k_cf_pool}/${g.n_cf_pool}`; }).filter(Boolean).join(" · ");
    return `<h2>${g0.version ? esc(g0.version) : ""} <span class="mute" style="font-weight:400;font-size:14px">inputs ${esc(R0.inputs || "?")}</span></h2>
      <p class="mute" style="font-size:12.5px">Real rates over the eval's goals, for context: ${ctx}.</p>
      <div class="card evcase">${claimChart(gs, models, faker, pairEval)}</div>`;
  }).join("");
  const byAccuracy = (ev.claim_tables || []).some(t => t.rows.some(x => x.accuracy != null));
  // evals scored as % right lead with the table and the paired differences; the class-by-class dot strips (two "models" with
  // truth 1 and 0) read as a before/after chart there, so they are left out (every conversation is in expview, linked above)
  const scoreLink = `<a href="https://github.com/${GH}/blob/main/cfbench/evals/${esc(ev.name)}/score.py" target="_blank" rel="noopener">cfbench/evals/${esc(ev.name)}/score.py</a>`;
  if (byAccuracy) return `<p class="lede">The investigator gives P(${esc(ev.claim || "the eval's claim is true for the case")}); the truth is 1 or 0 by the case's class.
      Scored by ${scoreLink}: % right with guess = p ≥ 0.5 (classes balanced, chance 50%), AUROC second.</p>
    ${tables}`;
  return `<p class="lede">The investigator gives P(${pairEval ? "model A is" : "the target model is"} the alignment-faking one); the truth is 1 for the faker's cases and 0 for the other model's.
      Scored by Brier score: <b>0.25 = always answering 0.5</b>, lower is better; green = the 95% CI is below 0.25, red = above.
      The numbers are <a href="https://github.com/${GH}/blob/main/cfbench/evals/af_which/score.py" target="_blank" rel="noopener">cfbench/evals/af_which/score.py</a>'s.</p>
    ${tables}
    <p class="lede">Every prediction as a dot, by investigator and by which model ${pairEval ? "was A" : "was the target"}; the bar is the mean. Click a dot for that conversation.</p>${body}`;
}
function claimChart(gs, models, faker, pairEval) {
  const live = (R, k) => !R.current_conds || R.current_conds.includes(k);  // a later rerun of a condition replaces this run's
  const conds = condOrder([...new Set(gs.flatMap(([R, g]) => Object.keys(g.draws).filter(k => live(R, k))))]);
  const colW = 92, W = 60 + conds.length * (2 * colW + 30), H = 266, T = 14, B = 66, y = v => T + (1 - v) * (H - T - B), f = v => v.toFixed(1);
  let s = "";
  for (const v of [0, 0.25, 0.5, 0.75, 1]) s += `<line x1="44" x2="${W - 8}" y1="${f(y(v))}" y2="${f(y(v))}" class="${v === 0.5 ? "null" : "grid"}"/><text x="38" y="${f(y(v) + 4)}" class="ax" text-anchor="end">${v}</text>`;
  conds.forEach((k, ci) => {
    models.forEach((m, mi) => {
      const x = 60 + ci * (2 * colW + 30) + mi * colW + colW / 2;
      let all = [], j = 0;
      for (const [R, g] of gs.filter(([R, g]) => g.model === m && live(R, k))) {
        const ds = (g.draws[k] || []).filter(d => d.p != null);
        ds.forEach(d => {
          const dx = ((j++ * 7919) % 41 - 20) * 0.9;
          s += `<a href="#" onclick="drawCard(${regDraw(R, g, k, d)}, event)"><circle cx="${f(x + dx)}" cy="${f(y(d.p))}" r="3.2" fill="${condColor(k)}" class="pt faint"><title>${esc(condLabel(k))} · ${esc(shortModel(m))}${d.item ? ` · ${esc(d.item)}` : ""}: p = ${(100 * d.p).toFixed(0)}% · click for the conversation</title></circle></a>`;
        });
        all = all.concat(ds);
      }
      if (all.length) {  // one mean per column, over every group drawn in it (a pooled version spans envs)
        const mean = all.reduce((t, d) => t + d.p, 0) / all.length;
        s += `<line x1="${x - 24}" x2="${x + 24}" y1="${f(y(mean))}" y2="${f(y(mean))}" stroke="${condColor(k)}" class="mean"><title>mean ${pp(mean)}%</title></line>`;
      }
      s += `<text x="${x}" y="${H - B + 16}" class="ax" text-anchor="middle">${pairEval ? "A = " : ""}${esc(/deepseek/i.test(m) ? "DSv4 Flash" : /glm/i.test(m) ? "GLM 5.3" : shortModel(m))}</text>`;
      s += `<text x="${x}" y="${H - B + 29}" class="ax" text-anchor="middle">truth ${faker(m) ? 1 : 0}</text>`;
    });
    s += `<text x="${60 + ci * (2 * colW + 30) + colW}" y="${H - B + 47}" class="lab" text-anchor="middle">${esc(condShort(k))}</text>`;
  });
  return `<div class="scroll"><svg class="evchart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="predictions by model and investigator">${s}</svg></div>`;
}

function aboutTab(D) {
  const s = D.spec;
  const kv = o => `<pre class="code">${esc(JSON.stringify(o, null, 1))}</pre>`;
  $("tab").innerHTML = `<p class="mute">Spec built ${esc(s.generated)} from commit <a href="https://github.com/${GH}/tree/${esc((s.git_sha || "").replace("+dirty", ""))}/environments/${esc(s.env)}">${esc((s.git_sha || "?").slice(0, 10))}</a>
    (source hash ${esc(s.source_hash)}).${Object.keys(s.build_errors || {}).length ? ` <b>${Object.keys(s.build_errors).length} builds failed</b>: ${esc(Object.entries(s.build_errors).slice(0, 3).map(([k, v]) => k + ": " + v).join("; "))}` : ""}</p>
  <h3>README</h3><div class="readme">${md(s.readme || "(no README)")}</div>
  <h3>env.py docstring</h3><pre class="code">${esc(s.doc)}</pre>
  <div class="cols" style="grid-template-columns:1fr 1fr 1fr"><div><h3>REQUIRES</h3>${kv(s.requires)}</div><div><h3>CAPS</h3>${kv(s.caps)}</div><div><h3>DEFAULTS</h3>${kv(s.defaults)}</div></div>`;
}

async function sourceTab(D, h) {
  const s = D.spec, file = h.file && s.source_files.includes(h.file) ? h.file : s.source_files.find(f => f.endsWith(`/${s.env}/env.py`)) || s.source_files[0];
  $("tab").innerHTML = `<div class="cols"><div class="files">${s.source_files.map(f => `<a class="${f === file ? "on" : ""}" href="#${hashOf({env: s.env, tab: "source", file: f})}">${esc(f.replace("environments/", ""))}</a>`).join("")}</div>
    <div><p class="mono"><a href="${ghLink(s, file)}" target="_blank" rel="noopener">${esc(file)}</a> <span class="mute">${SRC ? "(local)" : "(GitHub)"}</span></p><pre class="code" id="code">loading…</pre></div></div>`;
  try { $("code").textContent = await sourceText(s, file); } catch (e) { $("code").textContent = String(e.message); }
}

// one episode: (model, episode id), with run only as an optional hint (old links); found through links.json
async function episodePage(h) {
  const env = h.env, D = await envData(env, {retired: "show"});
  const id = h.episode, cands = Object.entries(D.links.runs || {}).filter(([, r]) => id in (r.episodes || {}));
  const hit = cands.find(([run]) => run === h.run) || cands.find(([, r]) => targetKey(r) === h.model) || cands[0];
  if (!hit) throw new Error(`no episode ${id}`);
  const [run, r] = hit, target = targetKey(r), [arm, item] = [(D.spec?.arms || []).find(a => id.startsWith(slug(a) + "~")) || id.split("~")[0], id.split("~")[1]];
  setCrumb([[env, "env=" + env], [arm, hashOf({env, arm, item})], [`${modelName(target)} · ${id.split("~").slice(1).join("~")}`]]);
  $("view").innerHTML = `<p><a href="#${hashOf({env, arm, item})}">← ${esc(arm)} on ${esc(item)}</a></p>
  <h1 style="font-size:20px"><span class="mono">${esc(arm)}</span> · ${esc(item)} · ${esc(modelName(target))}</h1>
  <h3>All episodes of this arm on this item</h3>${rolloutsHtml(D, arm, item, 40)}
  <h2>Transcript</h2><div id="episode"></div>`;
  await showEpisode(env, run, id, target, cands.filter(([, x]) => targetKey(x) === target).length > 1);
}

async function showEpisode(env, run, id, target, dup) {
  const el = $("episode");
  el.innerHTML = '<p class="mute">loading episode…</p>';
  const ep = await getEpisode(env, run, id);
  const links = [ep.docent_url ? `<a href="${esc(ep.docent_url)}" target="_blank" rel="noopener">Docent</a>` : "",
    `<a href="${evEpisode(env, target, id, dup ? run : null)}" target="_blank" rel="noopener">expview</a>`].filter(Boolean).join(" · ");
  el.innerHTML = `<p class="mono">finish ${esc(ep.finish)} ${ep.today ? "· date " + esc(ep.today) : ""} ${links ? "· " + links : ""}
    ${ep.build_check && ep.build_check !== "match" ? `<br><b>${esc(ep.build_check)}</b>` : ""}</p>
  ${(ep.messages || []).map(m => `<div class="msg ${esc(m.role)}"><div class="role">${esc(m.role)}${m.tool_calls ? " · " + m.tool_calls.map(t => esc(t.function.name)).join(", ") : ""}</div>`
    + (m.reasoning_content ? `<div class="think">${esc(m.reasoning_content)}</div>` : "") + esc(typeof m.content === "string" ? m.content : JSON.stringify(m.content))
    + (m.tool_calls ? m.tool_calls.map(t => `\n→ ${esc(t.function.name)}(${esc(t.function.arguments)})`).join("") : "") + "</div>").join("")}`;
}

function canonHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  let moved = false;
  for (const [old, neu] of Object.entries(LEGACY)) if (h.has(old)) { h.set(neu, h.get(old)); h.delete(old); moved = true; }
  if (moved) history.replaceState(null, "", "#" + h.toString());
  return Object.fromEntries(h);
}

async function route() {
  if ($("drawcard")) $("drawcard").hidden = true;
  const h = canonHash();
  $("status").textContent = "loading…";
  try {
    if (h.episode) await episodePage(h);
    else if (h.run) await envPage({env: h.env});  // old run links: runs aren't shown any more
    else if (h.compare) await comparePage(h);
    else if (h.diff) await diffPage(h);
    else if (h.env && h.arm) await armPage(h);
    else if (h.eval) await evalPage(h);
    else if (h.evals) await evalsHome();
    else if (h.env) await envPage(h);
    else await home();
    $("status").textContent = "";
  } catch (e) { $("status").textContent = "error: " + e.message; console.error(e); }
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
