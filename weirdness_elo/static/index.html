<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHIVE Weirdness Ranking</title>
<style>
:root{--bg:#fafaf8;--panel:#fff;--fg:#1d1d1b;--mut:#6b6b66;--line:#e3e2dc;--acc:#6d4bd8;--accbg:#efeafd;--win:#2f8f4e;--lose:#b5483b;--code:#f3f2ee}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--panel:#1f1f1d;--fg:#e8e6e0;--mut:#9a988f;--line:#33322f;--acc:#a58cff;--accbg:#2a2440;--win:#5fc07f;--lose:#e07a6d;--code:#262624}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
h1{font-size:17px;margin:0 12px 0 0}#summary{color:var(--mut);font-size:12.5px}
input,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:inherit}
input{width:min(340px,100%)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:calc(100vh - 58px)}
#list{overflow:auto;border-right:1px solid var(--line)}
table{border-collapse:collapse;width:100%}th{position:sticky;top:0;background:var(--bg);text-align:left;font-weight:600;font-size:12px;color:var(--mut);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}tr.row{cursor:pointer}tr.row:hover{background:var(--accbg)}tr.sel{background:var(--accbg)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}.mut{color:var(--mut);font-size:12px}.run{font-size:11px;color:var(--acc);white-space:nowrap}
.q{font-weight:500}.b{color:var(--mut);font-size:12.5px;margin-top:3px}
#detail{overflow:auto;padding:16px 20px}#detail h2{font-size:15px;margin:0 0 6px}#detail h3{font-size:13px;margin:18px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.msg{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--panel)}.msg .role{font-size:11px;font-weight:600;color:var(--mut);padding:5px 10px;border-bottom:1px solid var(--line)}
.msg pre,.exp{white-space:pre-wrap;word-wrap:break-word;margin:0;padding:8px 10px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:420px;overflow:auto}
.exp{background:var(--code);border-radius:8px;font-family:inherit;font-size:13px;max-height:none}
.yes{color:var(--win);font-weight:600}.no{color:var(--lose);font-weight:600}
.match{padding:4px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.empty{color:var(--mut);padding:40px;text-align:center}
@media (max-width:860px){main{grid-template-columns:1fr;height:auto}#list{max-height:55vh;border-right:0;border-bottom:1px solid var(--line)}}
</style></head><body>
<header><h1>CHIVE behaviours ranked by weirdness</h1>
<input id="q" placeholder="Search question / behaviour…"><select id="run"><option value="">all runs</option></select>
<span id="summary"></span></header>
<main><div id="list"><table><thead><tr><th>#</th><th>Elo ± sd</th><th>rank 90% CI</th><th>behaviour</th></tr></thead><tbody id="tb"></tbody></table></div>
<div id="detail"><div class="empty">Click a behaviour to see its transcript, completions, explanation and judge reasons.</div></div></main>
<script>
let data=[],sel=null;const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){const r=await (await fetch('/api/ranking')).json();data=r.ranking;const s=r.summary||{};
 $('#summary').textContent=s.comparisons?`${s.items} behaviours · ${s.comparisons} judgements · first-position bias ${s.position_bias_logit} logit (win rate ${s.first_position_win_rate}) · mean rank-CI width ${s.mean_rank_ci_width}`:'no judgements yet';
 const runs=[...new Set(data.map(d=>d.run))].sort();$('#run').innerHTML='<option value="">all runs</option>'+runs.map(r=>`<option>${r}</option>`).join('');render()}
function render(){const q=$('#q').value.toLowerCase(),rn=$('#run').value;
 const rows=data.filter(d=>(!rn||d.run===rn)&&(!q||(d.question+' '+d.behavior+' '+d.prompt_id).toLowerCase().includes(q)));
 $('#tb').innerHTML=rows.map(d=>`<tr class="row${d.id===sel?' sel':''}" data-id="${esc(d.id)}">${d.unranked?'<td class="num mut">–</td><td class="num mut">unranked</td><td class="num mut">–</td>':`<td class="num">${d.rank}</td><td class="num">${d.elo} <span class="mut">± ${d.elo_sd}</span></td><td class="num mut">${d.rank_90ci[0]}–${d.rank_90ci[1]}</td>`}<td><div class="run">${esc(d.run)} · ${esc(d.prompt_id)} · ${d.wins}/${d.games} wins</div><div class="q">${esc(d.question)}</div><div class="b">${esc(d.behavior)}</div></td></tr>`).join('')}
async function open(id){sel=id;document.querySelectorAll('tr.row').forEach(t=>t.classList.toggle('sel',t.dataset.id===id));
 const d=await (await fetch('/api/item/'+encodeURIComponent(id))).json();const r=data.find(x=>x.id===id)||{};
 const msgs=(d.messages||[]).map(m=>`<div class="msg"><div class="role">${esc(m.role)}</div><pre>${esc(typeof m.content==='string'?m.content:JSON.stringify(m.content,null,1))}</pre></div>`).join('');
 const comps=(d.completions||[]).map((c,i)=>{const v=(d.grader_verdicts||[])[i];const vt=v==null?'':(typeof v==='object'?JSON.stringify(v):String(v));
  const yes=/yes|true/i.test(vt);return `<div class="msg"><div class="role">completion ${i+1}${vt?` · grader: <span class="${yes?'yes':'no'}">${esc(vt.slice(0,40))}</span>`:''}</div><pre>${esc(typeof c==='string'?c:JSON.stringify(c,null,1))}</pre></div>`}).join('');
 const ms=(d.matches||[]).map(m=>`<div class="match"><span class="${m.won?'yes':'no'}">${m.won?'won':'lost'}</span> <span class="mut">r${m.round} · ${m.first?'shown first':'shown second'} · ${esc(m.margin)}</span> — ${esc(m.reason)}<div class="mut">vs: ${esc(m.opponent_question)}</div></div>`).join('')||'<div class="mut">no matches yet</div>';
 $('#detail').innerHTML=`<div class="run">${esc(d.run)} · ${esc(d.prompt_id)} · ${r.unranked?'unranked (not judged yet)':`rank ${r.rank} · Elo ${r.elo} ± ${r.elo_sd}`} · verification ${d.verification_score??'n/a'} · baseline rate ${esc(r.baseline_rate)}</div>
 <h2>${esc(d.question)}</h2><div class="b">${esc(d.behavior_full)}</div>
 ${d.classifier_question?`<div class="mut" style="margin-top:6px">grader question: ${esc(d.classifier_question)}</div>`:''}
 <h3>Judge reasons (${(d.matches||[]).length})</h3>${ms}
 <h3>Investigation explanation</h3><div class="exp">${esc(d.explanation)}${d.commentary?'\n\n— commentary: '+esc(d.commentary):''}${d.confidence?'\n— confidence: '+esc(d.confidence):''}</div>
 <h3>Prompt transcript (${(d.messages||[]).length} messages)</h3>${msgs}
 <h3>Sampled completions (${(d.completions||[]).length})</h3>${comps}`;$('#detail').scrollTop=0}
$('#q').oninput=render;$('#run').onchange=render;$('#tb').onclick=e=>{const t=e.target.closest('tr.row');if(t)open(t.dataset.id)};
load();
</script></body></html>
