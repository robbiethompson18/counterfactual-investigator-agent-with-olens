<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#fbfaf7;--panel:#f2f0ea;--card:#fff;--fg:#1f1e1b;--mute:#6b675e;--line:#dedad0;--acc:#2f5d8a;--sel:#e3e9f1;--code:#f4f2ec;
  --sys:#eeece6;--user:#eef3ec;--asst:#ffffff;--think:#f6f1e3;--think-line:#c9b98a;--tool:#f1eef5;--tool-line:#9a88b8;
  --add:#dcefe2;--del:#f6e2dc;--mark:#ffe58a;--mark-fg:#2b2100;--track:#e7e3da;--yes:#2f5d8a;--neg:#a4473a;--flash:#f0c36d;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#18191b;--panel:#1f2124;--card:#1c1e21;--fg:#e6e4df;--mute:#9a968d;--line:#33363a;--acc:#8fb4dd;--sel:#26313d;--code:#222428;
  --sys:#222428;--user:#1d2620;--asst:#1c1e21;--think:#27241b;--think-line:#7d6f45;--tool:#231f2b;--tool-line:#7a6a98;
  --add:#173323;--del:#3a2019;--mark:#6b5a12;--mark-fg:#fff3c4;--track:#2c2f33;--yes:#8fb4dd;--neg:#e0907f;--flash:#8a6a1f}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#18191b;--panel:#1f2124;--card:#1c1e21;--fg:#e6e4df;--mute:#9a968d;--line:#33363a;--acc:#8fb4dd;--sel:#26313d;--code:#222428;
  --sys:#222428;--user:#1d2620;--asst:#1c1e21;--think:#27241b;--think-line:#7d6f45;--tool:#231f2b;--tool-line:#7a6a98;
  --add:#173323;--del:#3a2019;--mark:#6b5a12;--mark-fg:#fff3c4;--track:#2c2f33;--yes:#8fb4dd;--neg:#e0907f;--flash:#8a6a1f}
*{box-sizing:border-box}html,body{height:100%}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
a{color:var(--acc)}button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.mono{font-family:var(--mono);font-size:12px;color:var(--mute)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
pre{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:10px;margin:0;overflow:auto;white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 var(--mono)}
code{font-family:var(--mono);font-size:12.5px}
mark{background:var(--mark);color:var(--mark-fg);border-radius:2px;padding:0 1px}
.chip{display:inline-block;padding:0 7px;border-radius:9px;border:1px solid var(--line);font:11.5px/18px var(--mono);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.chip.t{background:var(--yes);border-color:var(--yes);color:var(--bg)}
.chip .k{color:var(--mute)}.chip.t .k{color:inherit;opacity:.75}
a.chip{text-decoration:none;color:var(--acc);border-color:var(--acc)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 10px;cursor:pointer;font-size:12.5px;text-decoration:none;color:var(--fg);display:inline-block}
.btn:hover{background:var(--sel)}.btn[aria-pressed="true"]{background:var(--sel);color:var(--acc);border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
select,input[type=search],input[type=text],input[type=number]{font:13px var(--sans);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
input.rx{font:13px var(--mono)}
.empty{color:var(--mute);font-style:italic}
.err{color:var(--neg)}

/* top bar */
#top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:7px 16px;background:var(--panel);border-bottom:1px solid var(--line);min-height:42px}
#top .brand{font:600 14px var(--mono);color:var(--fg);text-decoration:none;white-space:nowrap}
#crumbs{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
#crumbs a{text-decoration:none}
#top .right{display:flex;gap:8px;align-items:center}
#app{height:calc(100% - 42px)}

/* pages */
.page{max-width:1320px;margin:0 auto;padding:22px 16px 60px}
.page h1{font-size:20px;margin:0 0 6px;text-wrap:balance;word-break:break-word}
h2{font-size:15px;margin:26px 0 8px}
.desc{color:var(--mute);max-width:85ch}.desc p{margin:.4em 0}
.md{max-width:85ch}.md pre{margin:.6em 0}.md h1{font-size:19px}.md h2{font-size:16px}.md h3{font-size:14px}.md p{margin:.45em 0}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{width:100%;border-collapse:collapse}
th,td{padding:5px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line);font-size:13px}
th{font-size:11.5px;font-weight:600;color:var(--mute);border-top:0;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
th.s{cursor:pointer}th.s:hover{color:var(--acc)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sel)}
td.wrapid{word-break:break-all}
.bar{width:80px;height:7px;background:var(--track);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 8px}
.filters label{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.more{margin:10px 0}

/* item view */
#ex{display:grid;grid-template-columns:290px minmax(0,1fr);height:100%}
nav{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px 8px 40px}
.navtop{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:0 6px 10px}
.ih{margin:0 6px 6px;word-break:break-all}.ih b{font-size:14px}
.labels{display:flex;flex-wrap:wrap;gap:4px;margin:6px 6px 0}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:16px 6px 4px}
details.d{margin-left:10px}details.d>summary{cursor:pointer;padding:1px 4px;font-weight:500;font-size:13px}
.f{display:block;width:calc(100% - 10px);text-align:left;background:none;border:0;padding:2px 6px 2px 14px;margin-left:6px;border-radius:4px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.f:hover{background:var(--sel)}.f.on{background:var(--sel);color:var(--acc);font-weight:600}
.f .mono{margin-left:4px}
main{overflow:auto;padding:0 28px 60px}
#bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
#path{font:12px var(--mono);color:var(--mute);word-break:break-all}
#doc{max-width:1500px}
.dl{display:block}.dl.a{background:var(--add)}.dl.d{background:var(--del)}.dl.h{color:var(--acc)}.dl.f{color:var(--mute);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

/* messages (call view) */
.msgs{max-width:980px}
.msg{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;margin-bottom:12px;background:var(--card);overflow:hidden}
.msg>.mh{display:flex;justify-content:space-between;gap:8px;padding:4px 10px;font:600 12px var(--mono);border-bottom:1px solid var(--line);align-items:center}
.msg .mh .r{font-weight:400;color:var(--mute);display:flex;gap:8px;align-items:center}
.msg .mh a{color:var(--mute);text-decoration:none}.msg .mh a:hover{color:var(--acc)}
.msg .body{padding:10px 12px}
.msg .body>pre{border:0;padding:0;background:none;font:13.5px/1.55 var(--sans);white-space:pre-wrap}
.msg.system{border-left-color:var(--mute)}.msg.system>.mh{background:var(--sys)}
.msg.user{border-left-color:#5c8a5a}.msg.user>.mh{background:var(--user)}
.msg.assistant{border-left-color:var(--acc)}.msg.assistant>.mh{background:var(--sel)}
.msg.tool{border-left-color:var(--tool-line)}.msg.tool>.mh{background:var(--tool)}
.msg.tool .body>pre{font:12.5px/1.5 var(--mono)}
.msg.flash{animation:fl 1.8s ease-out}
.clip{max-height:220px;overflow:hidden;position:relative}
.clip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:50px;background:linear-gradient(transparent,var(--card))}
.think{border-left:3px solid var(--think-line);background:var(--think);border-radius:4px;padding:6px 10px;margin-bottom:10px}
.think>summary{cursor:pointer;font:600 12px var(--mono);color:var(--mute)}
.think pre{border:0;background:none;padding:6px 0 0;font:13px/1.55 var(--sans)}
.tc{margin-top:8px}.tc .mono{display:block;margin-bottom:3px;color:var(--acc)}
.parsed{border:1px solid var(--acc);border-radius:8px;padding:8px 10px;margin-bottom:12px;background:var(--sel)}

/* transcript with reads */
.tkbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.tkbar label{font-size:12px;color:var(--mute);display:flex;gap:5px;align-items:center}
.tkbar input.rx{width:240px}
.tkgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:18px;align-items:start}
.tr{max-width:980px}
.blk{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--card)}
.blk>header{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:4px 10px;border-bottom:1px solid var(--line)}
.blk>.tx{padding:8px 12px;white-space:pre-wrap;word-break:break-word;font:13.5px/1.7 var(--sans)}
.blk.system{border-left-color:var(--mute)}.blk.system>header{background:var(--sys)}
.blk.user{border-left-color:#5c8a5a}.blk.user>header{background:var(--user)}
.blk.assistant{border-left-color:var(--acc)}.blk.assistant>header{background:var(--sel)}
.blk.reasoning{border-left-color:var(--think-line);background:var(--think)}.blk.reasoning>header{background:var(--think)}
.blk.reasoning>.tx{font-size:13px;color:var(--fg)}
.blk.tool{border-left-color:var(--tool-line)}.blk.tool>header{background:var(--tool)}.blk.tool>.tx{font:12.5px/1.6 var(--mono)}
.blk.other>header{background:var(--panel)}
.blk.collapsed>.tx{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.blk>header button{float:right;font:11px var(--mono);background:none;border:0;color:var(--acc);cursor:pointer;text-transform:none;letter-spacing:0}
.sp{font:10.5px var(--mono);color:var(--mute);opacity:.8}
.tk{border-radius:2px}
.tk.r{cursor:pointer;box-shadow:inset 0 -2px 0 var(--kc,var(--think-line))}
.tk.r:hover{background:var(--sel)}
.tk.m{background:var(--mark);color:var(--mark-fg)}
.tk.on{background:var(--acc);color:var(--bg);box-shadow:none}
.tk.flash{animation:fl 1.6s ease-out}
@keyframes fl{0%{background:var(--flash)}100%{}}
.pk{font:11.5px/1.35 var(--sans);background:var(--sel);color:var(--acc);border:1px solid var(--line);border-left:3px solid var(--kc,var(--acc));border-radius:4px;padding:0 5px;margin:0 3px;cursor:pointer;white-space:normal}
.pk b{font-weight:600;color:var(--mute);margin-right:4px;font-size:10.5px}
.pk.m{background:var(--mark);color:var(--mark-fg)}.pk:hover{border-color:var(--acc)}
.xp{display:block;white-space:normal;font:13px/1.45 var(--sans);margin:4px 0 8px;color:var(--fg)}
.xp[hidden]{display:none}
.xbox{display:block;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:6px;background:var(--panel);padding:6px 10px}
.xh{display:flex;white-space:normal;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font:12px var(--mono);color:var(--mute);margin-bottom:2px}
.xh b{color:var(--fg)}
.rd{border-top:1px solid var(--line);padding:5px 0}.rd:first-of-type{border-top:0}
.rd .rh{display:flex;justify-content:space-between;gap:6px;font:600 12px var(--mono)}
.rd .rh .tool{color:var(--kc,var(--acc))}
.rd ul{margin:3px 0 0;padding-left:18px}.rd li{font-size:13px;margin:1px 0}
.rd .sc{font:11px var(--mono);color:var(--mute);margin-left:5px}
.rd li.neg{color:var(--mute)}
.rd.topk ul{padding-left:0;list-style:none;display:flex;flex-wrap:wrap;gap:3px 6px}.rd.topk li{font:12px var(--mono);background:var(--code);border-radius:3px;padding:0 4px}
.side{position:sticky;top:56px;max-height:calc(100vh - 120px);overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);font-size:13px}
.side h3{font:600 13px var(--sans);margin:0 0 8px}
.gl{color:var(--mute);font-size:12px}
tr.dim td{opacity:.62}
.note{border-left:3px solid var(--acc);background:var(--panel);padding:6px 10px;margin:6px 0;font-size:13px}
.judge{border-top:1px solid var(--line);padding:8px 0}.judge:first-of-type{border-top:0;padding-top:0}
.judge .jr{white-space:pre-wrap;margin:6px 0 0;font-size:12.5px}.judge details{margin-top:4px}.tokref{cursor:pointer;text-decoration:underline dotted}
.hit{border-top:1px solid var(--line);padding:6px 0;cursor:pointer}.hit:hover{background:var(--sel)}
.keys{font:12px var(--mono);color:var(--mute);margin-top:10px}.keys kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--bg)}

/* search */
.sform{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.sform .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.sform .row label{font-size:12px;color:var(--mute);display:flex;gap:5px;align-items:center}
.sform input.rx{flex:1;min-width:260px;font-size:14px;padding:5px 9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px}
.card .chips{display:flex;flex-wrap:wrap;gap:4px}
.ctx{font:12px/1.5 var(--mono);color:var(--mute);white-space:pre-wrap;word-break:break-word}
.ctx b{color:var(--fg);background:var(--think);padding:0 2px;border-radius:2px}
.reads div{word-break:break-word;font-size:13px}
.reads .rn{color:var(--mute);font:11px var(--mono);margin-right:6px}
.pager{display:flex;gap:8px;align-items:center;margin:10px 0}

@media (max-width:1100px){.tkgrid{grid-template-columns:1fr}.side{position:static;max-height:none}}
@media (max-width:760px){#ex{grid-template-columns:1fr;grid-template-rows:auto 1fr}nav{border-right:0;border-bottom:1px solid var(--line);max-height:38vh}main{padding:0 12px 40px}#top{gap:8px;padding:7px 10px}}
@media (prefers-reduced-motion:reduce){.tk.flash,.msg.flash{animation:none;outline:2px solid var(--flash)}}
</style>
</head>
<body>
<div id="top"><a class="brand" href="#">expview</a><div id="crumbs"></div><div class="right"><a class="btn" id="tosearch" href="#s=1">Search reads</a><button class="btn" id="theme" title="Toggle light / dark">◐</button></div></div>
<div id="app"><div class="page empty" id="loading">Loading…</div></div>
<script id="data" type="text/plain">{{DATA}}</script>
<script>
"use strict";
// ================================================================ basics
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem("expview:"+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem("expview:"+k,JSON.stringify(v))}catch{}}};
const fmt=v=>v===true?"yes":v===false?"no":v==null?"–":typeof v=="number"?(Number.isInteger(v)?v:Math.abs(v)>=1?+v.toFixed(3):+v.toPrecision(3)):(typeof v=="object"?JSON.stringify(v):String(v));
// overlay context for the side panel: its notes, the base it annotates, and other runs annotating this item
function overlayInfo(it,clickable){let h="";
  const notes=it.notes||[];
  if(notes.length)h+=`<h3>Notes (${notes.length})</h3>`+notes.map(n=>`<div class="judge">${n.pos!=null&&clickable?`<a class="tokref" data-p="${n.pos}">@${n.pos}</a> `:""}<div class="md">${md(n.text||"")}</div></div>`).join("");
  if(it.base_missing)h+=`<div class="empty">Base item ${esc(JSON.stringify(it.base_missing))} not found.</div>`;
  const an=it.annotations||[];
  if(an.length)h+=`<h3>Annotations from other runs (${an.length})</h3>`+an.slice(0,50).map(a=>{let l={};try{l=JSON.parse(a.labels||"{}")}catch{}
    return `<div class="judge"><a href="${linkTo({d:a.d,i:a.i})}">${esc(a.d)}</a><div class="labels">${Object.entries(l).slice(0,4).map(([k,v])=>chip(k,v)).join("")}</div></div>`}).join("");
  return h}
// Docent: the item's run on docent.transluce.org (the server fills it in from docent.json / transcript fingerprints)
const docentOf=links=>Object.entries(links||{}).find(([k,v])=>/docent/i.test(k+v))?.[1]||null;
const docentColl=u=>(String(u||"").match(/\/dashboard\/([0-9a-f-]{36})/)||[])[1]||null;
const docentBtn=u=>u?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener" title="This transcript on Docent">Docent ↗</a> `:"";
// a call whose name says it judges / grades / monitors is a judge; the subject is the first call that isn't one
const JUDGE_RX=/judge|grader|grading|classif|monitor|scor|rater|critic|verdict/i;
const subjectIdx=calls=>calls.findIndex(c=>!JUDGE_RX.test(c.name||""));
function judgeCards(calls,link,clickable){const s=subjectIdx(calls);
  const js=calls.map((c,j)=>j).filter(j=>clickable?JUDGE_RX.test(calls[j].name||""):j!=s);if(!js.length)return "";
  // "[N]" in a judge's text jumps to a token only through the call's token_refs {N: token position} (N is the judge's own numbering)
  return `<h3>Judges and graders (${js.length})</h3>`+js.map(j=>{const c=calls[j],ms=c.messages||[],out=[...ms].reverse().find(m=>m.role=="assistant")||{};
    const tr=c.token_refs||{},refs=h=>clickable?h.replace(/\[(\d{1,6})\]/g,(m,n)=>tr[n]!=null?`<a class="tokref" data-p="${tr[n]}" title="Jump to token ${tr[n]}">[${n}]</a>`:m):h;
    const reply=typeof out.content=="string"?out.content:out.content!=null?JSON.stringify(out.content):"";
    const pv=c.parsed&&typeof c.parsed=="object"?Object.entries(c.parsed):c.parsed!=null?[["parsed",c.parsed]]:[];
    const short=pv.filter(([k,v])=>typeof v!="string"||v.length<=40),long=pv.filter(([k,v])=>typeof v=="string"&&v.length>40);
    return `<div class="judge"><div>${c.overlay?'<span class="chip">this run</span> ':""}<b>${esc(c.name)}</b> <span class="mono">${esc(String(c.model||"").split("/").pop())}</span> · <a href="${link(j)}">full call I/O</a></div>
      ${short.length?`<div class="labels">${short.map(([k,v])=>chip(k,v)).join("")}</div>`:""}
      ${long.map(([k,v])=>`<div class="jr"><span class="mono">${esc(k)}:</span> ${refs(esc(v))}</div>`).join("")}
      ${reply?`<details ${long.length?"":"open"}><summary>reply (${reply.length.toLocaleString()} chars)</summary><div class="jr">${refs(esc(reply))}</div></details>`:""}
      ${out.reasoning?`<details><summary>reasoning (${out.reasoning.length.toLocaleString()} chars)</summary><div class="jr">${refs(esc(out.reasoning))}</div></details>`:""}</div>`}).join("")}
const chip=(k,v)=>`<span class="chip ${v===true?"t":""}" title="${esc(k)}: ${esc(fmt(v))}"><span class="k">${esc(k)}</span> ${esc(fmt(v))}</span>`;
// markdown via marked + DOMPurify (cdnjs); without them (offline), plain paragraphs
const md=t=>window.marked&&window.DOMPurify?DOMPurify.sanitize(marked.parse(String(t))):String(t??"").split(/\n{2,}/).map(x=>`<p>${esc(x).replace(/\n/g,"<br>")}</p>`).join("");
const pct=x=>x==null?"–":Math.round(100*x)+"%";
// a JS regex from the user's pattern ((?i) prefix and RE2-only syntax tolerated where JS can't)
function rxOf(q,cs){if(!q)return null;try{return new RegExp(q.replace(/^\(\?i\)/,""),cs?"g":"gi")}catch{return null}}
// escape text, wrapping regex matches in <mark>
function hl(t,rx){t=String(t??"");if(!rx)return esc(t);let out="",last=0,m;rx.lastIndex=0;
  while((m=rx.exec(t))){if(!m[0].length){rx.lastIndex++;continue}out+=esc(t.slice(last,m.index))+"<mark>"+esc(m[0])+"</mark>";last=m.index+m[0].length}
  return out+esc(t.slice(last))}
const test=(rx,t)=>{if(!rx)return false;rx.lastIndex=0;return rx.test(String(t??""))};
const PALETTE=["#2f5d8a","#b5662f","#3f7f5a","#8a4f9e","#a4473a","#5a6f8f","#8f7a2f","#2f7f86"];
function colorOf(tool,run){const r=(run&&run.readers||{})[tool];if(r&&r.color)return r.color;let h=0;for(const c of String(tool).split(" ")[0])h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
async function gunzipB64(b64){const bin=Uint8Array.from(atob(b64.trim()),c=>c.charCodeAt(0));
  return new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}

// ================================================================ data sources: the server's API, or one run embedded in the page
const EMBED=$("#data").textContent.trim(), STATIC=EMBED.length>0&&!EMBED.startsWith("{{");
let SRC;
function apiSource(){
  const get=async(p)=>{const r=await fetch(p);if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail}catch{}throw new Error(m)}return r.json()};
  const q=o=>new URLSearchParams(o).toString();
  return {static:false,
    datasets:()=>get("api/datasets"),
    run:d=>get("api/run?"+q({d})),
    item:(d,i)=>get("api/item?"+q({d,i})),
    env:(d,e)=>get("api/env?"+q({d,e})),
    tokens:(d,ref)=>get("api/tokens?"+q({d,ref})),
    facets:d=>get("api/facets?"+q({d})),
    search:p=>get("api/search?"+p.toString()),
    status:()=>get("api/status")}
}
async function staticSource(){
  const D=JSON.parse(await gunzipB64(EMBED)), B=D.blobs;
  const R=x=>{if(Array.isArray(x))return x.map(R);if(x&&typeof x=="object"){if(Object.keys(x).length==1&&typeof x.$=="number")return B[x.$];const o={};for(const k in x)o[k]=R(x[k]);return o}return x};
  const byId=new Map(D.items.map(it=>[it.id,it]));
  const summary=it=>({id:it.id,group:it.group,labels:it.labels||{},links:it.links||{},tokens:it.tokens||null,calls:(it.calls||[]).map(c=>({name:c.name,model:c.model,n:(c.messages||[]).length}))});
  const tk={};
  return {static:true,id:D.id||"run",
    datasets:async()=>[{d:D.id||"run",title:D.run.title,n_items:D.items.length}],
    run:async()=>({id:D.id||"run",run:D.run,items:D.items.map(summary)}),
    item:async(d,i)=>{const it=byId.get(i);if(!it)throw new Error("no item "+i);return R(it)},
    env:async(d,e)=>R(D.envs[e]),
    tokens:async(d,ref)=>{if(!tk[ref]){const r=await fetch(`tokens/${ref}.gz.txt`);if(!r.ok)throw new Error(`tokens/${ref}.gz.txt: ${r.status}`);tk[ref]=JSON.parse(await gunzipB64(await r.text()))}return tk[ref]}}
}

// ================================================================ routing: everything is in the hash, so any view is a link
// #d=<dataset> · &i=<item> · &v=tr|call|env|rec · &t=<token> · &c=<call> &m=<message> · &f=<file> · &q=<regex> · #s=1&q=... (search)
const H=()=>new URLSearchParams(location.hash.slice(1));
function go(o,replace){const p=new URLSearchParams();for(const [k,v] of Object.entries(o))if(v!=null&&v!=="")p.set(k,v);
  const h="#"+p.toString();if(replace)history.replaceState(null,"",h);else location.hash=h;if(replace)return;}
function setHash(o){const p=H();for(const [k,v] of Object.entries(o)){if(v==null||v==="")p.delete(k);else p.set(k,v)}history.replaceState(null,"","#"+p.toString())}
function linkTo(o){const p=new URLSearchParams();for(const [k,v] of Object.entries(o))if(v!=null&&v!=="")p.set(k,v);return "#"+p.toString()}
const RUNS={};
async function getRun(d){if(!RUNS[d]){const r=await SRC.run(d);const its=r.items;
  const groups=[...new Set(its.map(i=>i.group).filter(g=>g!=null))];
  const ks=[];for(const it of its)for(const k of Object.keys(it.labels||{}))if(!ks.includes(k))ks.push(k);
  const order=r.run.label_order||[];const labels=[...order.filter(k=>ks.includes(k)),...ks.filter(k=>!order.includes(k))];
  const kinds={};for(const k of labels){const vs=its.map(i=>(i.labels||{})[k]).filter(v=>v!=null);
    kinds[k]=vs.length&&vs.every(v=>typeof v=="boolean")?"bool":vs.length&&vs.every(v=>typeof v=="number")?"num":new Set(vs.map(fmt)).size<=30?"cat":"text"}
  RUNS[d]={...r,groups,labels,kinds,F:{group:"",q:"",labels:{},sort:null,dir:1},limit:300}}
  return RUNS[d]}
function crumbs(parts){$("#crumbs").innerHTML=parts.map(([t,h])=>h?`<a href="${h}">${esc(t)}</a>`:`<span>${esc(t)}</span>`).join(" <span>/</span> ")}
let VIEW=null;
async function route(){
  const p=H();document.onkeydown=null;
  try{
    if(p.get("s"))return await searchPage(p);
    const d=p.get("d")||(SRC.static?SRC.id:null);
    if(!d)return await homePage();
    if(p.get("i")!=null)return await itemPage(d,p.get("i"),p);
    return await runPage(d);
  }catch(e){console.error(e);$("#app").innerHTML=`<div class="page"><p class="err">${esc(e.message||e)}</p><p><a href="#">← all datasets</a></p></div>`}
}

// ================================================================ one run: summary by group + items table
// run.json "groups": {group: short gloss}, e.g. what an arm is; shown next to the group name everywhere
const gloss=(R,g)=>((R&&R.run&&R.run.groups)||{})[g];
const groupHtml=(R,g)=>`${esc(g??"")}${gloss(R,g)?` <span class="gl">${esc(gloss(R,g))}</span>`:""}`;
function summaryRow(R,name,its){
  const cells=R.labels.map(k=>{const kind=R.kinds[k],vs=its.map(i=>(i.labels||{})[k]).filter(v=>v!=null);
    if(!vs.length)return "<td class='mono'>–</td>";
    if(kind=="bool"){const t=vs.filter(v=>v).length,p=Math.round(100*t/vs.length);return `<td class="num">${t}/${vs.length} · ${p}%<span class="bar"><i style="width:${p}%"></i></span></td>`}
    if(kind=="num"){const m=vs.reduce((a,b)=>a+b,0)/vs.length;return `<td class="num">mean ${fmt(m)}</td>`}
    if(kind=="cat"){const c={};vs.forEach(v=>c[fmt(v)]=(c[fmt(v)]||0)+1);return `<td class="num">${Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([v,n])=>`${esc(v)} ${n}`).join(" · ")}</td>`}
    return "<td></td>"}).join("");
  return `<tr class="${name!=null?"click":""}" ${name!=null?`data-g="${esc(name)}"`:""}><td>${name==null?"<b>All items</b>":groupHtml(R,name)}</td><td class="num">${its.length}</td>${cells}</tr>`}
function sortKey(it,k){const v=k=="__id"?it.id:k=="__group"?it.group:(it.labels||{})[k];return v==null?null:typeof v=="boolean"?+v:v}
function filtered(R){const F=R.F,q=F.q.toLowerCase();
  const out=R.items.filter(it=>(!F.group||it.group==F.group)&&(!q||(it.id+" "+(it.group||"")).toLowerCase().includes(q))&&
    Object.entries(F.labels).every(([k,v])=>v===""||fmt((it.labels||{})[k])==v));
  if(F.sort)out.sort((a,b)=>{const x=sortKey(a,F.sort),y=sortKey(b,F.sort);if(x==y)return 0;if(x==null)return 1;if(y==null)return -1;return (x<y?-1:1)*F.dir});
  return out}
async function runPage(d){

  const rel=!me?"":[me.hidden&&me.canonical?`<div class="note">${me.used_by&&me.used_by.some(u=>u.d==me.canonical)?"These O-lens reads are shown inline in the run":"A copy of transcripts shown in"} <a href="${linkTo({d:me.canonical})}">${esc(me.canonical)}</a>; open them there.</div>`:"",
    ...(me.reads_from||[]).map(x=>`<div class="mono gl">O-lens reads from <a href="${linkTo({d:x.d})}">${esc(x.d)}</a> (${x.n.toLocaleString()} items)</div>`),
    ...(me.used_by||[]).filter(x=>!me.hidden).map(x=>`<div class="mono gl">annotated by <a href="${linkTo({d:x.d})}">${esc(x.d)}</a> (${x.n.toLocaleString()} items)</div>`)].join("");
  crumbs(SRC.static?[[r.title]]:[["datasets","#"],[d]]);
  const cats=R.labels.filter(k=>["bool","cat"].includes(R.kinds[k]));
  const hasTok=R.items.some(i=>i.tokens);

  const nDoc=Object.values(colls).reduce((a,b)=>a+b,0);
  const collHtml=nDoc?`<div class="labels" style="margin-bottom:6px">${Object.entries(colls).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([c,n])=>`<a class="btn" href="https://docent.transluce.org/dashboard/${c}" target="_blank" rel="noopener" title="${n.toLocaleString()} of these items are in this Docent collection">Docent collection ↗${Object.keys(colls).length>1?` (${n.toLocaleString()})`:""}</a>`).join(" ")} <span class="mono">${nDoc.toLocaleString()} of ${R.items.length.toLocaleString()} items on Docent</span></div>`:"";
  $("#app").innerHTML=`<div class="page"><h1>${esc(r.title||d)}</h1>${!SRC.static?`<div class="mono" style="margin-bottom:6px">${esc(d)}</div>`:""}${rel}${collHtml}${r.description?`<div class="desc md">${md(r.description)}</div>`:""}

   ${summaryRow(R,null,R.items)}${R.groups.length<=400?R.groups.map(g=>summaryRow(R,g,R.items.filter(i=>i.group==g))).join(""):""}</table></div>

    ${cats.map((k,i)=>{const vals=[...new Set(R.items.map(it=>fmt((it.labels||{})[k])))].sort();return `<label for="fl${i}">${esc(k)} <select id="fl${i}" data-k="${esc(k)}"><option value="">all</option>${vals.map(v=>`<option ${F.labels[k]==v?"selected":""}>${esc(v)}</option>`).join("")}</select></label>`}).join("")}
    <label for="fq">Find <input id="fq" type="search" value="${esc(F.q)}" placeholder="id or group"></label>
    ${hasTok&&!SRC.static?`<a class="btn" href="${linkTo({s:1,d})}">Search this run's reads</a>`:""}

function itemsTable(R){
  const F=R.F,shown=filtered(R);R.shown=shown;$("#cnt").textContent=`${shown.length.toLocaleString()} of ${R.items.length.toLocaleString()}`;
  const th=(k,n)=>`<th class="s" data-sort="${esc(k)}" title="sort">${esc(n)}${F.sort==k?(F.dir>0?" ▲":" ▼"):""}</th>`;
  const hasTok=R.items.some(i=>i.tokens),hasDoc=R.items.some(i=>docentOf(i.links));
  $("#items").innerHTML=`<tr>${th("__id","Item")}${R.groups.length?th("__group","Group"):""}${R.labels.map(k=>th(k,k)).join("")}${hasTok?"<th>Reads</th>":""}<th>Calls</th>${hasDoc?"<th>Docent</th>":""}</tr>`+
   shown.slice(0,R.limit).map(it=>`<tr class="click" data-i="${esc(it.id)}"><td class="mono wrapid">${esc(it.id)}</td>${R.groups.length?`<td>${groupHtml(R,it.group)}</td>`:""}${R.labels.map(k=>{const v=(it.labels||{})[k];return `<td class="num">${v===true?'<span class="chip t">yes</span>':esc(fmt(v))}</td>`}).join("")}${hasTok?`<td class="num mono">${it.tokens?it.tokens.reads.toLocaleString():""}</td>`:""}<td class="mono" title="${esc((it.calls||[]).map(c=>c.name).join(", "))}">${(it.calls||[]).length}</td>${hasDoc?`<td>${docentOf(it.links)?`<a class="chip" href="${esc(docentOf(it.links))}" target="_blank" rel="noopener">Docent ↗</a>`:""}</td>`:""}</tr>`).join("");
  $("#more").innerHTML=shown.length>R.limit?`<button class="btn" id="mb">Show ${Math.min(1000,shown.length-R.limit)} more</button>`:"";
  const mb=$("#mb");if(mb)mb.onclick=()=>{R.limit+=1000;itemsTable(R)};
  $("#items").onclick=e=>{const h=e.target.closest("th[data-sort]");if(h){const k=h.dataset.sort;F.dir=F.sort==k?-F.dir:(k.startsWith("__")?1:-1);F.sort=k;itemsTable(R);return}
    if(e.target.closest("a"))return;const tr=e.target.closest("tr[data-i]");if(tr)go({d:R.id,i:tr.dataset.i})};
}

// ================================================================ one item
const ITEM={};  // the open item: d, it (full), R, env, sel
function tree(files){const root={};for(const f of files){let n=root;const ps=f.split("/");ps.forEach((p,i)=>{if(i==ps.length-1)(n.__f=n.__f||[]).push(f);else n=n[p]=n[p]||{}})}return root}
function treeHtml(n,depth){let h="";
  for(const f of (n.__f||[]).sort())h+=`<button class="f" data-sel='${esc(JSON.stringify({v:"env",f}))}' title="${esc(f)}">${esc(f.split("/").pop())}</button>`;
  for(const k of Object.keys(n).filter(k=>k!="__f").sort())h+=`<details class="d" ${depth<1?"open":""}><summary>${esc(k)}/</summary>${treeHtml(n[k],depth+1)}</details>`;
  return h}
// an id that isn't in the run: try it with / without "/default/" segments (links built from arm/item/sample)
function idAlternatives(R,i){const norm=x=>String(x).replace(/\/default(?=\/|$)/g,"");const n=norm(i);
  return R.items.filter(x=>x.id!==i&&norm(x.id)==n).map(x=>x.id)}

  const same=ITEM.d==d&&ITEM.id==i&&ITEM.it;
  if(!same){$("#app").innerHTML=`<div class="page empty">Loading ${esc(i)}…</div>`;
    const it=await SRC.item(d,i);Object.assign(ITEM,{d,id:i,it,R,env:it.env_files||null,envId:it.env||null})}
  const it=ITEM.it,calls=it.calls||[],list=R.shown||filtered(R),k=list.findIndex(x=>x.id==i);VIEW="item";
  crumbs(SRC.static?[[R.run.title,"#"],[i]]:[["datasets","#"],[d,linkTo({d})],[i]]);
  if(ITEM.envId&&!ITEM.env)ITEM.env=await SRC.env(ITEM.it.env_d||d,ITEM.envId).catch(()=>null);
  const env=ITEM.env,links=Object.assign({},it.links||{});
  let v=p.get("v")||(it.tokens?"tr":calls.length?"call":env?"env":"rec");
  const sel={v,c:p.get("c")!=null?+p.get("c"):Math.max(0,subjectIdx(calls)),f:p.get("f")};
  const ex=$("#ex");
  $("#app").innerHTML=`<div id="ex"><nav id="nav"></nav><main id="mainp"><div id="bar"><span id="path"></span><span id="tog"></span></div><div id="doc"></div></main></div>`;
  const prev=k>0?list[k-1]:null,next=k>=0&&k<list.length-1?list[k+1]:null;
  $("#nav").innerHTML=`<div class="navtop"><a class="btn" href="${linkTo({d})}">← All items</a><span>
     <a class="btn" ${prev?`href="${linkTo({d,i:prev.id,v:p.get("v")})}"`:"aria-disabled=true"} title="Previous item (K)">↑</a>
     <a class="btn" ${next?`href="${linkTo({d,i:next.id,v:p.get("v")})}"`:"aria-disabled=true"} title="Next item (J)">↓</a></span></div>

  $("#xall").onclick=()=>{const v=visible();if(v.length>400&&!confirm(`Expand all ${v.length} read tokens?`))return;v.forEach(q=>open(q,true))};
  $("#xnone").onclick=()=>$$("#tr .xp:not([hidden])").forEach(x=>open(+x.id.slice(2),false));
  let hi=-1;
  TRK.key=e=>{const v=visible();if(!v.length)return;const i=v.indexOf(cur);
    if(e.key=="j"){e.preventDefault();focus(v[i<0?v.findIndex(q=>q>cur)>=0?v.findIndex(q=>q>cur):0:Math.min(v.length-1,i+1)])}
    else if(e.key=="k"){e.preventDefault();focus(v[i<0?0:Math.max(0,i-1)])}
    else if(e.key=="Enter"&&cur>=0){e.preventDefault();const o=open(cur);setHash({t:o?cur:null})}
    else if(e.key=="Escape"){$$("#tr .xp:not([hidden])").forEach(x=>open(+x.id.slice(2),false))}
    else if(e.key=="n"){const hp=[...new Set(hits().map(x=>x[0]))];if(hp.length){hi=(hi+1)%hp.length;focus(hp[hi],true)}}
    else if(e.key=="/"){e.preventDefault();$("#tkq").focus()}};
  sidePanel();
  // ---- deep link to a token
  const t=p.get("t");if(t!=null&&reads[t]){requestAnimationFrame(()=>focus(+t,true))}
}

// ================================================================ search over every read (server only)
async function searchPage(p){
  VIEW="search";crumbs([["datasets","#"],["search"]]);
  if(SRC.static){$("#app").innerHTML=`<div class="page"><p class="empty">Cross-run search needs the expview server. In a built page, search inside one transcript's reads from its toolbar.</p></div>`;return}
  const d=p.get("d")||"";
  const [ds,fc]=await Promise.all([SRC.datasets(),SRC.facets(d)]);
  const scope=p.get("scope")||"reads",pick=scope=="text"?ds:ds.filter(x=>x.n_reads);
  const sel=(id,opts,cur,all)=>`<select id="${id}"><option value="">${all}</option>${opts.map(([v,n])=>`<option value="${esc(v)}" ${v==cur?"selected":""}>${esc(n)}</option>`).join("")}</select>`;
  const labs=(fc.labels||[]).map(x=>[`${x.k}=${x.v}`,`${x.k} = ${x.v} (${x.n})`]);
  $("#app").innerHTML=`<div class="page"><h1>Search</h1>
   <form class="sform" id="sf">
    <div class="row"><input class="rx" id="sq" type="text" value="${esc(p.get("q")||"")}" placeholder="regex (RE2), e.g. being (tested|evaluated|watched)" aria-label="regex"><button class="btn primary">Search</button>
     <label><input type="checkbox" id="scase" ${p.get("case")=="1"?"checked":""}> case-sensitive</label></div>
    <div class="row">
     <label>In ${sel("sscope",[["reads","metamodel reads"],["text","transcripts and judge calls"]],scope,"metamodel reads").replace('<option value="">metamodel reads</option>',"")}</label>
     <label title="Drop a read when the regex also matches what the model just read or is about to write (an echo), or anywhere in the item">Keep ${sel("snovel",[["ctx","new vs ±40 tokens + next 16"],["transcript","new vs the whole item"]],p.get("novel")||"","all hits")}</label>
     <label>Dataset ${sel("sd",pick.map(x=>[x.d,scope=="text"?`${x.d} (${x.n_items.toLocaleString()} items)`:`${x.d} (${x.n_reads.toLocaleString()} reads)`]),d,scope=="text"?"all":"all with reads")}</label>
     <label>Reader ${sel("stool",(fc.tools||[]).map(x=>[x.tool,`${x.tool} (${x.n.toLocaleString()})`]),p.get("tool")||"","all")}</label>
     <label>Section ${sel("ssec",(fc.secs||[]).map(x=>[x.sec,`${x.sec||"(none)"} (${x.n.toLocaleString()})`]),p.get("sec")||"","all")}</label>
     ${(fc.groups||[]).length?`<label>Group ${sel("sgroup",fc.groups.map(x=>[x.grp,`${x.grp} (${x.n})`]),p.get("group")||"","all")}</label>`:""}
     ${labs.length?`<label>Label ${sel("slabel",labs,p.get("label")||"","any")}</label>`:""}
    </div></form><div id="sres"></div></div>`;
  const params=()=>{const o={s:1,q:$("#sq").value.trim(),case:$("#scase").checked?"1":"",scope:$("#sscope").value=="reads"?"":$("#sscope").value,novel:$("#snovel").value,d:$("#sd").value,
    tool:$("#stool").value,sec:$("#ssec").value,group:$("#sgroup")?.value||"",label:$("#slabel")?.value||""};return o};
  $("#sf").onsubmit=e=>{e.preventDefault();go(params())};
  $("#sd").onchange=()=>{const o=params();o.tool="";o.sec="";o.group="";o.label="";go(o)};
  $$("#sf select:not(#sd),#scase").forEach(s=>s.onchange=()=>{if($("#sq").value.trim())go(params())});
  if(!p.get("q")){$("#sres").innerHTML=`<p class="desc" style="margin-top:14px">Regex over every metamodel read (O-lens bullets, J-lens top-k, NLA and reader outputs) in every indexed run, or over the transcripts and judge calls themselves. "New" drops a read whose match also appears in the transcript around its token, so what is left is what the reader says that the text doesn't. The table shows, per dataset and group, how many items have a hit and each yes/no label's rate among them vs overall.</p>
    <p class="mono">Try: <a href="${linkTo({s:1,q:"being (tested|evaluated|watched)",novel:"ctx"})}">being (tested|evaluated|watched)</a> · <a href="${linkTo({s:1,q:"eval(uation)? (rubric|grader)",novel:"ctx"})}">eval rubric</a> · <a href="${linkTo({s:1,q:"\\bshut ?down",novel:"ctx"})}">shutdown</a></p>`;return}
  $("#sres").innerHTML='<p class="empty">Searching…</p>';
  const qs=new URLSearchParams();for(const k of ["q","case","scope","novel","d","tool","sec","group","label"])if(p.get(k))qs.set(k,p.get(k));
  const page=+(p.get("page")||0);qs.set("page",page);qs.set("per",50);
  let r;try{r=await SRC.search(qs)}catch(e){$("#sres").innerHTML=`<p class="err">${esc(e.message)}</p>`;return}
  const R1=rxOf(p.get("q"),p.get("case")=="1"),T=r.total;
  const n=scope=="text"?T.items:T.positions;
  let h=scope=="text"?`<p><b>${T.items.toLocaleString()}</b> items match <span class="mono">(${r.secs}s)</span></p>`:
    `<p><b>${T.reads.toLocaleString()}</b> matching reads at <b>${T.positions.toLocaleString()}</b> token positions in <b>${T.items.toLocaleString()}</b> items <span class="mono">(${r.secs}s)</span>${scope!="text"?` · <a href="api/csv?${qs}">CSV of all matching reads</a>`:""}</p>`;
  const rk=[...new Set(r.slices.flatMap(x=>Object.keys(x.rates||{})))].slice(0,6);
  if(r.slices.length)h+=`<div class="wrap" style="max-height:340px;overflow:auto"><table><tr><th>Dataset</th><th>Group</th><th>Items</th><th>With hit</th>${rk.map(k=>`<th title="rate among items with a hit · overall">${esc(k)} | hit · all</th>`).join("")}</tr>${r.slices.map(x=>
    `<tr><td class="mono wrapid">${esc(x.d)}</td><td>${esc(x.grp??"")}</td><td class="num">${x.items}</td><td class="num">${x.hit_items} (${pct(x.hit_items/x.items)})</td>${rk.map(k=>{const v=(x.rates||{})[k];return `<td class="num">${v?`${pct(v[0])} · ${pct(v[1])}`:"–"}</td>`}).join("")}</tr>`).join("")}</table></div>`;
  const pages=Math.ceil(n/50),nav=`<div class="pager">${page>0?`<a class="btn" href="${linkTo({...Object.fromEntries(p),page:page-1})}">← prev</a>`:""}<span class="mono">page ${page+1} / ${Math.max(1,pages)}</span>${page+1<pages?`<a class="btn" href="${linkTo({...Object.fromEntries(p),page:page+1})}">next →</a>`:""}</div>`;
  const labChips=l=>Object.entries(l||{}).slice(0,6).map(([k,v])=>chip(k,v)).join("");
  const lk=o=>Object.entries(o||{}).map(([a,u])=>`<a class="chip" href="${esc(u)}" target="_blank" rel="noopener">${esc(a)} ↗</a>`).join("");
  h+=nav+r.rows.map(x=>{
    if(scope=="text"){const href=linkTo({d:x.d,i:x.i,v:"call",q:p.get("q")});
      return `<div class="card"><div class="chips"><a class="chip" href="${href}">${esc(x.i)}</a><span class="chip mono">${esc(x.d)}</span>${x.grp!=null?`<span class="chip">${esc(x.grp)}</span>`:""}${labChips(x.labels)}${lk(x.links)}</div><div class="ctx">…${hl(x.snippet,R1)}…</div></div>`}
    const href=linkTo({d:x.d,i:x.i,v:"tr",t:x.pos,q:p.get("q")});const tk=String(x.token),c=String(x.ctx);
    return `<div class="card"><div class="chips"><a class="chip" href="${href}">${esc(x.i)} @ ${x.pos}</a><span class="chip mono">${esc(x.d)}</span>${x.grp!=null?`<span class="chip">${esc(x.grp)}</span>`:""}${x.sec?`<span class="chip">${esc(x.sec)}</span>`:""}${labChips(x.labels)}${lk(x.links)}</div>
     <div class="ctx">…${esc(c.endsWith(tk)?c.slice(0,c.length-tk.length):c)}<b>${esc(tk)}</b> ⟶ ${esc(x.nxt)}</div>
     <div class="reads">${x.reads.map(y=>`<div><span class="rn">${esc(y.tool)}${y.label?" · "+esc(y.label):""}</span>${hl(y.text,R1)}</div>`).join("")}</div></div>`}).join("")+nav;
  $("#sres").innerHTML=h;
}

// ================================================================ boot
(function theme(){const t=store.get("theme",null);if(t)document.documentElement.dataset.theme=t;
  $("#theme").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    const nx=cur=="dark"?"light":"dark";document.documentElement.dataset.theme=nx;store.set("theme",nx)}})();
(async()=>{
  SRC=STATIC?await staticSource():apiSource();
  if(STATIC){$("#tosearch").hidden=true;$(".brand").textContent="expview";$(".brand").href="#"}
  window.addEventListener("hashchange",route);await route();
})().catch(e=>{$("#app").innerHTML=`<div class="page err">Could not start: ${esc(e.message||e)}</div>`});
</script>
