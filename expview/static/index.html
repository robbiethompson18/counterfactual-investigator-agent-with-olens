<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#fbfaf7;--panel:#f2f0ea;--card:#fff;--fg:#1f1e1b;--mute:#6b675e;--line:#dedad0;--acc:#2f5d8a;--sel:#e3e9f1;--code:#f4f2ec;
  --sys:#eeece6;--user:#eef3ec;--asst:#ffffff;--think:#f6f1e3;--think-line:#c9b98a;--tool:#f1eef5;--tool-line:#9a88b8;
  --add:#dcefe2;--del:#f6e2dc;--mark:#ffe58a;--mark-fg:#2b2100;--track:#e7e3da;--yes:#2f5d8a;--neg:#a4473a;--flash:#f0c36d;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#18191b;--panel:#1f2124;--card:#1c1e21;--fg:#e6e4df;--mute:#9a968d;--line:#33363a;--acc:#8fb4dd;--sel:#26313d;--code:#222428;
  --sys:#222428;--user:#1d2620;--asst:#1c1e21;--think:#27241b;--think-line:#7d6f45;--tool:#231f2b;--tool-line:#7a6a98;
  --add:#173323;--del:#3a2019;--mark:#6b5a12;--mark-fg:#fff3c4;--track:#2c2f33;--yes:#8fb4dd;--neg:#e0907f;--flash:#8a6a1f}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#18191b;--panel:#1f2124;--card:#1c1e21;--fg:#e6e4df;--mute:#9a968d;--line:#33363a;--acc:#8fb4dd;--sel:#26313d;--code:#222428;
  --sys:#222428;--user:#1d2620;--asst:#1c1e21;--think:#27241b;--think-line:#7d6f45;--tool:#231f2b;--tool-line:#7a6a98;
  --add:#173323;--del:#3a2019;--mark:#6b5a12;--mark-fg:#fff3c4;--track:#2c2f33;--yes:#8fb4dd;--neg:#e0907f;--flash:#8a6a1f}
*{box-sizing:border-box}html,body{height:100%}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
a{color:var(--acc)}button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.mono{font-family:var(--mono);font-size:12px;color:var(--mute)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
pre{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:10px;margin:0;overflow:auto;white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 var(--mono)}
code{font-family:var(--mono);font-size:12.5px}
mark{background:var(--mark);color:var(--mark-fg);border-radius:2px;padding:0 1px}
.chip{display:inline-block;padding:0 7px;border-radius:9px;border:1px solid var(--line);font:11.5px/18px var(--mono);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.chip.t{background:var(--yes);border-color:var(--yes);color:var(--bg)}
.chip .k{color:var(--mute)}.chip.t .k{color:inherit;opacity:.75}
a.chip{text-decoration:none;color:var(--acc);border-color:var(--acc)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 10px;cursor:pointer;font-size:12.5px;text-decoration:none;color:var(--fg);display:inline-block}
.btn:hover{background:var(--sel)}.btn[aria-pressed="true"]{background:var(--sel);color:var(--acc);border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
select,input[type=search],input[type=text],input[type=number]{font:13px var(--sans);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
input.rx{font:13px var(--mono)}
.empty{color:var(--mute);font-style:italic}
.err{color:var(--neg)}

/* top bar */
#top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:7px 16px;background:var(--panel);border-bottom:1px solid var(--line);min-height:42px}
#top .brand{font:600 14px var(--mono);color:var(--fg);text-decoration:none;white-space:nowrap}
#crumbs{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
#crumbs a{text-decoration:none}
#top .right{display:flex;gap:8px;align-items:center}
#app{height:calc(100% - 42px)}

/* pages */
.page{max-width:1320px;margin:0 auto;padding:22px 16px 60px}
.page h1{font-size:20px;margin:0 0 6px;text-wrap:balance;word-break:break-word}
h2{font-size:15px;margin:26px 0 8px}
.desc{color:var(--mute);max-width:85ch}.desc p{margin:.4em 0}
.md{max-width:85ch}.md pre{margin:.6em 0}.md h1{font-size:19px}.md h2{font-size:16px}.md h3{font-size:14px}.md p{margin:.45em 0}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{width:100%;border-collapse:collapse}
th,td{padding:5px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line);font-size:13px}
th{font-size:11.5px;font-weight:600;color:var(--mute);border-top:0;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
th.s{cursor:pointer}th.s:hover{color:var(--acc)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sel)}
td.wrapid{word-break:break-all}
.bar{width:80px;height:7px;background:var(--track);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 8px}
.filters label{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.more{margin:10px 0}

/* item view */
#ex{display:grid;grid-template-columns:290px minmax(0,1fr);height:100%}
nav{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px 8px 40px}
.navtop{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:0 6px 10px}
.ih{margin:0 6px 6px;word-break:break-all}.ih b{font-size:14px}
.labels{display:flex;flex-wrap:wrap;gap:4px;margin:6px 6px 0}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:16px 6px 4px}
details.d{margin-left:10px}details.d>summary{cursor:pointer;padding:1px 4px;font-weight:500;font-size:13px}
.f{display:block;width:calc(100% - 10px);text-align:left;background:none;border:0;padding:2px 6px 2px 14px;margin-left:6px;border-radius:4px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.f:hover{background:var(--sel)}.f.on{background:var(--sel);color:var(--acc);font-weight:600}
.f .mono{margin-left:4px}
main{overflow:auto;padding:0 28px 60px}
#bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
#path{font:12px var(--mono);color:var(--mute);word-break:break-all}
#doc{max-width:1500px}
.dl{display:block}.dl.a{background:var(--add)}.dl.d{background:var(--del)}.dl.h{color:var(--acc)}.dl.f{color:var(--mute);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

/* messages (call view) */
.msgs{max-width:980px}
.msg{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;margin-bottom:12px;background:var(--card);overflow:hidden}
.msg>.mh{display:flex;justify-content:space-between;gap:8px;padding:4px 10px;font:600 12px var(--mono);border-bottom:1px solid var(--line);align-items:center}
.msg .mh .r{font-weight:400;color:var(--mute);display:flex;gap:8px;align-items:center}
.msg .mh a{color:var(--mute);text-decoration:none}.msg .mh a:hover{color:var(--acc)}
.msg .body{padding:10px 12px}
.msg .body>pre{border:0;padding:0;background:none;font:13.5px/1.55 var(--sans);white-space:pre-wrap}
.msg.system{border-left-color:var(--mute)}.msg.system>.mh{background:var(--sys)}
.msg.user{border-left-color:#5c8a5a}.msg.user>.mh{background:var(--user)}
.msg.assistant{border-left-color:var(--acc)}.msg.assistant>.mh{background:var(--sel)}
.msg.tool{border-left-color:var(--tool-line)}.msg.tool>.mh{background:var(--tool)}
.msg.tool .body>pre{font:12.5px/1.5 var(--mono)}
.msg.flash{animation:fl 1.8s ease-out}
.clip{max-height:220px;overflow:hidden;position:relative}
.clip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:50px;background:linear-gradient(transparent,var(--card))}
.think{border-left:3px solid var(--think-line);background:var(--think);border-radius:4px;padding:6px 10px;margin-bottom:10px}
.think>summary{cursor:pointer;font:600 12px var(--mono);color:var(--mute)}
.think pre{border:0;background:none;padding:6px 0 0;font:13px/1.55 var(--sans)}
.tc{margin-top:8px}.tc .mono{display:block;margin-bottom:3px;color:var(--acc)}
.parsed{border:1px solid var(--acc);border-radius:8px;padding:8px 10px;margin-bottom:12px;background:var(--sel)}

/* transcript with reads */
.tkbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.tkbar label{font-size:12px;color:var(--mute);display:flex;gap:5px;align-items:center}
.tkbar input.rx{width:240px}
.tkgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:18px;align-items:start}
.tr{max-width:980px}
.blk{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--card)}
.blk>header{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:4px 10px;border-bottom:1px solid var(--line)}
.blk>.tx{padding:8px 12px;white-space:pre-wrap;word-break:break-word;font:13.5px/1.7 var(--sans)}
.blk.system{border-left-color:var(--mute)}.blk.system>header{background:var(--sys)}
.blk.user{border-left-color:#5c8a5a}.blk.user>header{background:var(--user)}
.blk.assistant{border-left-color:var(--acc)}.blk.assistant>header{background:var(--sel)}
.blk.reasoning{border-left-color:var(--think-line);background:var(--think)}.blk.reasoning>header{background:var(--think)}
.blk.reasoning>.tx{font-size:13px;color:var(--fg)}
.blk.tool{border-left-color:var(--tool-line)}.blk.tool>header{background:var(--tool)}.blk.tool>.tx{font:12.5px/1.6 var(--mono)}
.blk.other>header{background:var(--panel)}
.blk.collapsed>.tx{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.blk>.more{display:none}.blk.collapsed>.more{display:block;width:100%;border:0;border-top:1px dashed var(--line);border-radius:0 0 8px 8px;background:transparent;color:var(--acc);font:600 12px var(--mono);padding:6px 10px;cursor:pointer;text-align:left}
.blk>header button{float:right;font:11px var(--mono);background:none;border:0;color:var(--acc);cursor:pointer;text-transform:none;letter-spacing:0}
.sp{font:10.5px var(--mono);color:var(--mute);opacity:.8}
.tk{border-radius:2px}
.tk.r{cursor:pointer;box-shadow:inset 0 -2px 0 var(--kc,var(--think-line))}
.tk.r:hover{background:var(--sel)}
.tk.m{background:var(--mark);color:var(--mark-fg)}
.tk.on{background:var(--acc);color:var(--bg);box-shadow:none}
.tk.flash{animation:fl 1.6s ease-out}
@keyframes fl{0%{background:var(--flash)}100%{}}
.pk{font:11.5px/1.35 var(--sans);background:var(--sel);color:var(--acc);border:1px solid var(--line);border-left:3px solid var(--kc,var(--acc));border-radius:4px;padding:0 5px;margin:0 3px;cursor:pointer;white-space:normal}
.pk b{font-weight:600;color:var(--mute);margin-right:4px;font-size:10.5px}
.pk.m{background:var(--mark);color:var(--mark-fg)}.pk:hover{border-color:var(--acc)}
.xp{display:block;white-space:normal;font:13px/1.45 var(--sans);margin:4px 0 8px;color:var(--fg)}
.xp[hidden]{display:none}
.xbox{display:block;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:6px;background:var(--panel);padding:6px 10px}
.xh{display:flex;white-space:normal;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font:12px var(--mono);color:var(--mute);margin-bottom:2px}
.xh b{color:var(--fg)}
.rd{border-top:1px solid var(--line);padding:5px 0}.rd:first-of-type{border-top:0}
.rd .rh{display:flex;justify-content:space-between;gap:6px;font:600 12px var(--mono)}
.rd .rh .tool{color:var(--kc,var(--acc))}
.rd ul{margin:3px 0 0;padding-left:18px}.rd li{font-size:13px;margin:1px 0}
.rd .sc{font:11px var(--mono);color:var(--mute);margin-left:5px}
.rd li.neg{color:var(--mute)}
.rd.topk ul{padding-left:0;list-style:none;display:flex;flex-wrap:wrap;gap:3px 6px}.rd.topk li{font:12px var(--mono);background:var(--code);border-radius:3px;padding:0 4px}
.side{position:sticky;top:56px;max-height:calc(100vh - 120px);overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);font-size:13px}
.side h3{font:600 13px var(--sans);margin:0 0 8px}
.gl{color:var(--mute);font-size:12px}
.judge{border-top:1px solid var(--line);padding:8px 0}.judge:first-of-type{border-top:0;padding-top:0}
.judge .jr{white-space:pre-wrap;margin:6px 0 0;font-size:12.5px}.judge details{margin-top:4px}.tokref{cursor:pointer;text-decoration:underline dotted}
.hit{border-top:1px solid var(--line);padding:6px 0;cursor:pointer}.hit:hover{background:var(--sel)}
.keys{font:12px var(--mono);color:var(--mute);margin-top:10px}.keys kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--bg)}

/* search */
.sform{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.sform .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.sform .row label{font-size:12px;color:var(--mute);display:flex;gap:5px;align-items:center}
.sform input.rx{flex:1;min-width:260px;font-size:14px;padding:5px 9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px}
.card .chips{display:flex;flex-wrap:wrap;gap:4px}
.ctx{font:12px/1.5 var(--mono);color:var(--mute);white-space:pre-wrap;word-break:break-word}
.ctx b{color:var(--fg);background:var(--think);padding:0 2px;border-radius:2px}
.reads div{word-break:break-word;font-size:13px}
.reads .rn{color:var(--mute);font:11px var(--mono);margin-right:6px}
.pager{display:flex;gap:8px;align-items:center;margin:10px 0}

@media (max-width:1100px){.tkgrid{grid-template-columns:1fr}.side{position:static;max-height:none}}
@media (max-width:760px){#ex{grid-template-columns:1fr;grid-template-rows:auto 1fr}nav{border-right:0;border-bottom:1px solid var(--line);max-height:38vh}main{padding:0 12px 40px}#top{gap:8px;padding:7px 10px}}
@media (prefers-reduced-motion:reduce){.tk.flash,.msg.flash{animation:none;outline:2px solid var(--flash)}}
</style>
</head>
<body>
<div id="top"><a class="brand" href="#">expview</a><span class="right" id="topnav"><a class="btn" href="#" title="Envs: env → arm → run → episode">Envs</a><a class="btn" href="#datasets=1" title="Every expview run on HF">Datasets</a></span><div id="crumbs"></div><div class="right"><a class="btn" id="toall" href="#everything=1" hidden title="One regex over every read, transcript and judge call (search server on bramble)">Search everything</a><a class="btn" id="tosearch" href="#search=1">Search reads</a><button class="btn" id="theme" title="Toggle light / dark">◐</button></div></div>
<div id="app"><div class="page empty" id="loading">Loading…</div></div>
<script id="data" type="text/plain">{{DATA}}</script>
<script>
"use strict";
// ================================================================ basics
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem("expview:"+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem("expview:"+k,JSON.stringify(v))}catch{}}};
const fmt=v=>v===true?"yes":v===false?"no":v==null?"–":typeof v=="number"?(Number.isInteger(v)?v:Math.abs(v)>=1?+v.toFixed(3):+v.toPrecision(3)):(typeof v=="object"?JSON.stringify(v):String(v));
// overlay context for the side panel: its notes, the base it annotates, and other runs annotating this item
function overlayInfo(it,clickable){let h="";
  const notes=it.notes||[];
  if(notes.length)h+=`<h3>Notes (${notes.length})</h3>`+notes.map(n=>`<div class="judge">${n.pos!=null&&clickable?`<a class="tokref" data-p="${n.pos}">@${n.pos}</a> `:""}<div class="md">${md(n.text||"")}</div></div>`).join("");
  if(it.base_missing)h+=`<div class="empty">Base item ${esc(JSON.stringify(it.base_missing))} not found.</div>`;
  const an=it.annotations||[];
  if(an.length)h+=`<h3>Annotations from other runs (${an.length})</h3>`+an.slice(0,50).map(a=>{let l={};try{l=JSON.parse(a.labels||"{}")}catch{}
    return `<div class="judge"><a href="${linkTo({dataset:a.d,item:a.i})}">${esc(a.d)}</a><div class="labels">${Object.entries(l).slice(0,4).map(([k,v])=>chip(k,v)).join("")}</div></div>`}).join("");
  return h}
// Docent: the item's run on docent.transluce.org (the server fills it in from docent.json / transcript fingerprints)
const docentOf=links=>Object.entries(links||{}).find(([k,v])=>/docent/i.test(k+v))?.[1]||null;
const docentColl=u=>(String(u||"").match(/\/dashboard\/([0-9a-f-]{36})/)||[])[1]||null;
const docentBtn=u=>u?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener" title="This transcript on Docent">Docent ↗</a> `:"";
// a call whose name says it judges / grades / monitors is a judge; the subject is the first call that isn't one
const JUDGE_RX=/judge|grader|grading|classif|monitor|scor|rater|critic|verdict/i;
const subjectIdx=calls=>calls.findIndex(c=>!JUDGE_RX.test(c.name||""));
function judgeCards(calls,link,clickable){const s=subjectIdx(calls);
  const js=calls.map((c,j)=>j).filter(j=>clickable?JUDGE_RX.test(calls[j].name||""):j!=s);if(!js.length)return "";
  // "[N]" in a judge's text jumps to a token only through the call's token_refs {N: token position} (N is the judge's own numbering)
  return `<h3>Judges and graders (${js.length})</h3>`+js.map(j=>{const c=calls[j],ms=c.messages||[],out=[...ms].reverse().find(m=>m.role=="assistant")||{};
    const tr=c.token_refs||{},refs=h=>clickable?h.replace(/\[(\d{1,6})\]/g,(m,n)=>tr[n]!=null?`<a class="tokref" data-p="${tr[n]}" title="Jump to token ${tr[n]}">[${n}]</a>`:m):h;
    const reply=typeof out.content=="string"?out.content:out.content!=null?JSON.stringify(out.content):"";
    const pv=c.parsed&&typeof c.parsed=="object"?Object.entries(c.parsed):c.parsed!=null?[["parsed",c.parsed]]:[];
    const short=pv.filter(([k,v])=>typeof v!="string"||v.length<=40),long=pv.filter(([k,v])=>typeof v=="string"&&v.length>40);
    return `<div class="judge"><div>${c.overlay?'<span class="chip">this run</span> ':""}<b>${esc(c.name)}</b> <span class="mono">${esc(String(c.model||"").split("/").pop())}</span> · <a href="${link(j)}">full call I/O</a></div>
      ${short.length?`<div class="labels">${short.map(([k,v])=>chip(k,v)).join("")}</div>`:""}
      ${long.map(([k,v])=>`<div class="jr"><span class="mono">${esc(k)}:</span> ${refs(esc(v))}</div>`).join("")}
      ${reply?`<details ${long.length?"":"open"}><summary>reply (${reply.length.toLocaleString()} chars)</summary><div class="jr">${refs(esc(reply))}</div></details>`:""}
      ${out.reasoning?`<details><summary>reasoning (${out.reasoning.length.toLocaleString()} chars)</summary><div class="jr">${refs(esc(out.reasoning))}</div></details>`:""}</div>`}).join("")}
const chip=(k,v)=>`<span class="chip ${v===true?"t":""}" title="${esc(k)}: ${esc(fmt(v))}"><span class="k">${esc(k)}</span> ${esc(fmt(v))}</span>`;
// markdown via marked + DOMPurify (cdnjs); without them (offline), plain paragraphs

// ================================================================ routing: everything is in the hash, so any view is a link
// #dataset=<run> · &item=<item> · &view=tr|call|env|rec · &token=<token> · &call=<call> &message=<message> · &file=<file> · &query=<regex>
// · #search=1&query=...&dataset=<datasets> (search); full list in expview/CLAUDE.md "Links" and docs/viewers.md "URL parameters"
const H=()=>new URLSearchParams(location.hash.slice(1));
// keys are full words since 2026-10-26; a link with the old one-letter keys is rewritten in place (no reload), so it keeps working
// and the address bar shows the new form. Applied once per route (page load and hashchange).
const LEGACY={d:"dataset",i:"item",v:"view",t:"token",c:"call",m:"message",f:"file",q:"query",s:"search",env:"experiment",tool:"reader",sec:"section"};
function canonHash(){let h=H();
  // "env" was the search page's old key for experiment; outside a search it is now the env key
  const srch=h.has("s")||h.has("search"),old=k=>Object.hasOwn(LEGACY,k)&&(k!="env"||srch);
  if([...h.keys()].some(old)){const c=new URLSearchParams();for(const [k,v] of h)c.set(old(k)?LEGACY[k]:k,v);history.replaceState(null,"","#"+c.toString());h=c}
  // the old per-run exports of env runs (runs/env_<env>/<run>, runs/env_<env>/by_arm/<arm>) now open the env run itself
  const m=/^runs\/env_([^/]+)\/(.+)$/.exec(h.get("dataset")||"");
  if(m){const [,e,rest]=m,arm=/^by_arm\/(.+)$/.exec(rest),i=h.get("item"),o={env:e};
    if(arm){o.arm=arm[1];if(i!=null){const k=i.indexOf("/");o.run=i.slice(0,k);o.episode=i.slice(k+1)}}else{o.run=rest;if(i!=null)o.episode=i}
    const c=new URLSearchParams();for(const [k,v] of Object.entries(o))c.set(k,v);for(const [k,v] of h)if(k!="dataset"&&k!="item")c.set(k,v);
    history.replaceState(null,"","#"+c.toString());h=c}
  return h}
// env datasets are linked by env / run / arm / episode keys, the same model as the env viewer
const ARMNAME={};
function envKeys(o){const e=o.dataset&&envOf(o.dataset);if(!e)return o;const out={env:e.env};
  if(e.run)out.run=e.run;else out.arm=ARMNAME[o.dataset]||e.armSlug;
  if(o.item!=null){if(e.run)out.episode=o.item;else{const k=String(o.item).indexOf("/");out.run=o.item.slice(0,k);out.episode=o.item.slice(k+1)}}
  for(const [k,v] of Object.entries(o))if(k!="dataset"&&k!="item")out[k]=v;return out}
function go(o,replace){o=envKeys(o);const p=new URLSearchParams();for(const [k,v] of Object.entries(o))if(v!=null&&v!=="")p.set(k,v);

   <h2>Arms (${shownArms.length}${ret.size&&!showRet?`; ${arms.length-shownArms.length} retired hidden, <a href="${linkTo({env:e,retired:"show"})}">show</a>`:ret.size?`; <a href="${linkTo({env:e})}">hide retired</a>`:""})</h2>
   <p class="mono">${esc(idx.primary)} per target model. Click an arm for its episodes, or a model's cell for that model's.</p>
   <div class="filters"><label for="af">Find <input id="af" type="search" placeholder="arm or factor"></label></div>
   <div class="wrap"><table id="ea"></table></div>
   <h2>Reads and judges on these episodes</h2><div id="eatt" class="empty">Looking…</div></div>`;
  const drawArms=()=>{const q=$("#af").value.toLowerCase();
    $("#ea").innerHTML=`<tr><th>Arm</th><th>Factors</th>${models.map(m=>`<th style="text-transform:none">${esc(m)}</th>`).join("")}</tr>`+shownArms.filter(a=>(a+" "+fac(a)).toLowerCase().includes(q)).map(a=>

// ================================================================ one run: summary by group + items table
// run.json "groups": {group: short gloss}, e.g. what an arm is; shown next to the group name everywhere
const gloss=(R,g)=>((R&&R.run&&R.run.groups)||{})[g];
const groupHtml=(R,g)=>`${esc(g??"")}${gloss(R,g)?` <span class="gl">${esc(gloss(R,g))}</span>`:""}`;
function summaryRow(R,name,its){
  const cells=R.labels.map(k=>{const kind=R.kinds[k],vs=its.map(i=>(i.labels||{})[k]).filter(v=>v!=null);
    if(!vs.length)return "<td class='mono'>–</td>";
    if(kind=="bool"){const t=vs.filter(v=>v).length,p=Math.round(100*t/vs.length);return `<td class="num">${t}/${vs.length} · ${p}%<span class="bar"><i style="width:${p}%"></i></span></td>`}
    if(kind=="num"){const m=vs.reduce((a,b)=>a+b,0)/vs.length;return `<td class="num">mean ${fmt(m)}</td>`}
    if(kind=="cat"){const c={};vs.forEach(v=>c[fmt(v)]=(c[fmt(v)]||0)+1);return `<td class="num">${Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([v,n])=>`${esc(v)} ${n}`).join(" · ")}</td>`}
    return "<td></td>"}).join("");
  return `<tr class="${name!=null?"click":""}" ${name!=null?`data-g="${esc(name)}"`:""}><td>${name==null?"<b>All items</b>":groupHtml(R,name)}</td><td class="num">${its.length}</td>${cells}</tr>`}
function sortKey(it,k){const v=k=="__id"?it.id:k=="__group"?it.group:(it.labels||{})[k];return v==null?null:typeof v=="boolean"?+v:v}
// env arm views: model= / thinking= from the hash narrow everything shown (summary, table, ↑/↓)
const envBase=R=>R.items.filter(it=>it.model==null||(modelMatch({target:it.model.split(" · ")[0],thinking:it.thinking},R.F.model)&&thinkMatch(it.thinking,R.F.think)));
const envF=R=>({model:R.F.model||null,thinking:R.F.think||null});
function readEnvF(R,p){if(envOf(R.id)){R.F.model=p.get("model")||"";R.F.think=p.get("thinking")||""}}
function filtered(R){const F=R.F,q=F.q.toLowerCase();
  const out=envBase(R).filter(it=>(!F.group||it.group==F.group)&&(!q||(it.id+" "+(it.group||"")).toLowerCase().includes(q))&&
    Object.entries(F.labels).every(([k,v])=>v===""||fmt((it.labels||{})[k])==v));
  if(F.sort)out.sort((a,b)=>{const x=sortKey(a,F.sort),y=sortKey(b,F.sort);if(x==y)return 0;if(x==null)return 1;if(y==null)return -1;return (x<y?-1:1)*F.dir});
  return out}

  for(const k of Object.keys(n).filter(k=>k!="__f").sort())h+=`<details class="d" ${depth<1?"open":""}><summary>${esc(k)}/</summary>${treeHtml(n[k],depth+1)}</details>`;

}

  if(SRC.static){$("#app").innerHTML=`<div class="page"><p class="empty">Cross-run search is on the public viewer (https://robbiethompson18.github.io/counterfactual-investigator-agent-with-olens/expview/). In a built page, search inside one transcript's reads from its toolbar.</p></div>`;return}

  const envs=await SRC.envs();
  const dsets=env?await SRC.datasets(env).catch(e=>{console.warn(e);return []}):[];
  for(const x of dsets)SRC.known(x.d,x.dir);
  const sel=(id,opts,cur,all)=>`<select id="${id}"><option value="">${all}</option>${opts.map(([v,n])=>`<option value="${esc(v)}" ${v==cur?"selected":""}>${esc(n)}</option>`).join("")}</select>`;
  $("#app").innerHTML=`<div class="page"><h1>Search</h1>
   <form class="sform" id="sf">
    <div class="row"><input class="rx" id="sq" type="text" value="${esc(p.get("query")||"")}" placeholder="regex, e.g. being (tested|evaluated|watched)" aria-label="regex"><button class="btn primary">Search</button>
     <label><input type="checkbox" id="scase" ${p.get("case")=="1"?"checked":""}> case-sensitive</label></div>
    <div class="row"><label>Experiment ${sel("senv",envs.map(e=>[e,e]),env,"pick one")}</label>
     <span id="sds" class="row">${dsets.length?dsets.map(x=>`<label title="${esc(x.d)}"><input type="checkbox" data-d="${esc(x.d)}" ${ids.includes(x.d)?"checked":""}> ${esc(x.d.split("/").slice(2).join("/"))} <span class="mono">${(x.size/1e6).toFixed(1)} MB${x.reads?" · reads":""}</span></label>`).join(""):env?'<span class="empty">no expview runs in this experiment</span>':""}</span></div>
    <div class="row">
     <label>In ${sel("sscope",[["reads","metamodel reads"],["text","transcripts and judge calls"]],scope,"metamodel reads").replace('<option value="">metamodel reads</option>',"")}</label>
     <label title="Drop a read when the regex also matches what the model just read or is about to write (an echo), or anywhere in the item">Keep ${sel("snovel",[["ctx","new vs ±40 tokens + next 16"],["transcript","new vs the whole item"]],p.get("novel")||"","all hits")}</label>
     <span id="sfacets" class="row"></span>
    </div></form><div id="sres"></div></div>`;
  const params=()=>({search:1,query:$("#sq").value.trim(),case:$("#scase").checked?"1":"",scope:$("#sscope").value=="reads"?"":$("#sscope").value,novel:$("#snovel").value,experiment:$("#senv").value,
    dataset:$$("#sds input:checked").map(c=>c.dataset.d).join(","),reader:$("#stool")?.value||"",section:$("#ssec")?.value||"",group:$("#sgroup")?.value||"",label:$("#slabel")?.value||""});
  const reset=o=>{o.reader="";o.section="";o.group="";o.label="";return o};
  $("#sf").onsubmit=e=>{e.preventDefault();go(params())};
  $("#senv").onchange=()=>{const o=reset(params());o.dataset="";go(o)};
  $$("#sds input").forEach(c=>c.onchange=()=>go(reset(params())));
  $$("#sscope,#snovel,#scase").forEach(s=>s.onchange=()=>{if($("#sq").value.trim())go(params())});
  const res=$("#sres");
  if(!ids.length){res.innerHTML=(env&&!dsets.length?"":`<p class="empty">${env?"Tick the runs to search.":"Pick an experiment, then the runs to search."}</p>`)+searchHelp();return}
  // ---- load the picked runs
  res.innerHTML='<p class="empty" id="sld">Loading…</p>';const say=t=>{const el=$("#sld");if(el)el.textContent=t};
  const loaded=[];
  try{for(const d of ids){say(`${d}: loading the item list…`);await SRC.run(d);
    if(scope=="text"){say(`${d}: downloading items.jsonl…`);loaded.push({d,items:[...(await SRC.whole(d,"Searching transcripts and judge calls needs every item")).values()]})}
    else loaded.push({d,...await SRC.reads(d,(k,n)=>say(`${d}: loading reads ${k}/${n}…`))})}}
  catch(e){res.innerHTML=`<p class="err">${esc(e.message||e)}</p>`;return}
  if(VIEW!="search")return;
  const sums=ids.flatMap(d=>[...SRC.sums(d).values()].map(s=>({...s,d})));
  // ---- facets from what's loaded
  const count=(xs,f)=>{const c=new Map();for(const x of xs){const k=f(x);if(k==null)continue;c.set(k,(c.get(k)||0)+1)}return [...c]};
  const reads=loaded.flatMap(x=>x.reads||[]),tools=count(reads,r=>r.tool).sort((a,b)=>b[1]-a[1]),secs=count(loaded.flatMap(x=>x.pos||[]),P=>P.sec).sort((a,b)=>b[1]-a[1]);
  const groups=count(sums,s=>s.group).sort((a,b)=>a[0]<b[0]?-1:1);
  const byK=new Map();for(const s of sums)for(const [k,v] of Object.entries(s.labels||{}))if(v!=null&&typeof v!="object"){const m=byK.get(k)||new Map();m.set(labelStr(v),(m.get(labelStr(v))||0)+1);byK.set(k,m)}
  const labs=[...byK].filter(([,m])=>m.size<=30).flatMap(([k,m])=>[...m].sort().map(([v,n])=>[`${k}=${v}`,`${k} = ${v} (${n})`]));
  $("#sfacets").innerHTML=(scope!="text"?`<label>Reader ${sel("stool",tools.map(([t,n])=>[t,`${t} (${n.toLocaleString()})`]),p.get("reader")||"","all")}</label>
     <label>Section ${sel("ssec",secs.map(([s,n])=>[s,`${s||"(none)"} (${n.toLocaleString()})`]),p.get("section")||"","all")}</label>`:"")+
    (groups.length?`<label>Group ${sel("sgroup",groups.map(([g,n])=>[g,`${g} (${n})`]),p.get("group")||"","all")}</label>`:"")+
    (labs.length?`<label>Label ${sel("slabel",labs,p.get("label")||"","any")}</label>`:"");
  $$("#sfacets select").forEach(s=>s.onchange=()=>{if($("#sq").value.trim())go(params())});
  const failed=loaded.reduce((a,x)=>a+(x.failed||0),0);
  const loadedNote=scope=="text"?`${sums.length.toLocaleString()} items loaded`:`${reads.length.toLocaleString()} reads at ${loaded.reduce((a,x)=>a+x.pos.length,0).toLocaleString()} positions in ${loaded.reduce((a,x)=>a+x.n_items,0).toLocaleString()} items loaded${failed?` <span class="err">(${failed} token files failed)</span>`:""}`;
  const q=p.get("query");
  if(!q){res.innerHTML=`<p class="mono">${loadedNote}</p>`+searchHelp();return}
  const rx=rxOf(q,p.get("case")=="1");if(!rx){res.innerHTML=`<p class="err">Not a valid regex: ${esc(q)}</p>`;return}
  // ---- the query
  const t0=performance.now(),Fg=p.get("group")||"",Fl=p.get("label")||"",[lk,lv]=Fl?[Fl.slice(0,Fl.indexOf("=")),Fl.slice(Fl.indexOf("=")+1)]:["",""];
  const itemOK=s=>(!Fg||s.group==Fg)&&(!lk||((s.labels||{})[lk]!=null&&labelStr(s.labels[lk])==lv));
  const novel=p.get("novel")||"",tool=p.get("reader")||"",sec=p.get("section")||"";
  let rows,total,hitItems=new Set();
  if(scope=="text"){rows=[];
    for(const {d,items} of loaded)for(const it of items){const s=SRC.sums(d).get(String(it.id));if(!s||!itemOK(s))continue;
      const t=(it.calls||[]).map(callText).join("\n\n");rx.lastIndex=0;const m=rx.exec(t);if(!m)continue;hitItems.add(d+"\0"+s.id);
      rows.push({d,i:s.id,grp:s.group,labels:s.labels,links:s.links,snippet:t.slice(Math.max(0,m.index-160),m.index+m[0].length+160)})}
    total={items:rows.length}}
  else{let hits=reads.filter(r=>itemOK(r.P.s)&&(!tool||r.tool==tool)&&(!sec||r.P.sec==sec)&&test(rx,r.text));
    if(novel=="ctx"||novel=="transcript")hits=hits.filter(r=>!test(rx,r.P.ctx+r.P.nxt));
    if(novel=="transcript"){const keys=[...new Set(hits.map(r=>r.P.d+"\0"+r.P.i))],bad=new Set();let n=0;
      await pmap(keys,6,async k=>{const [d,i]=k.split("\0");try{if(test(rx,await SRC.text(d,i)))bad.add(k)}catch(e){console.warn(e)}},()=>say(`checking the whole item: ${++n}/${keys.length}…`));
      hits=hits.filter(r=>!bad.has(r.P.d+"\0"+r.P.i))}
    const byPos=new Map();for(const r of hits){const k=r.P.d+"\0"+r.P.i+"\0"+r.P.pos;if(!byPos.has(k))byPos.set(k,{P:r.P,reads:[]});byPos.get(k).reads.push(r);hitItems.add(r.P.d+"\0"+r.P.i)}
    rows=[...byPos.values()].sort((a,b)=>a.P.d<b.P.d?-1:a.P.d>b.P.d?1:a.P.i<b.P.i?-1:a.P.i>b.P.i?1:a.P.pos-b.P.pos);
    for(const r of rows)r.reads.sort((a,b)=>(a.tool+a.label)<(b.tool+b.label)?-1:1);
    total={reads:hits.length,positions:rows.length,items:hitItems.size};window.EXPVIEW_HITS=hits}
  const secsTaken=((performance.now()-t0)/1000).toFixed(2);
  // ---- per (dataset, group): items in the filtered slice, how many have a hit, each yes/no label's rate with a hit vs overall
  const hitDs=new Set([...hitItems].map(k=>k.split("\0")[0])),slices=new Map();
  for(const s of sums){if(!hitDs.has(s.d)||!itemOK(s))continue;const k=s.d+"\0"+(s.group??"");let x=slices.get(k);if(!x)slices.set(k,x={d:s.d,grp:s.group,items:0,hit_items:0,rates:{}});
    const hit=hitItems.has(s.d+"\0"+s.id);x.items++;if(hit)x.hit_items++;
    for(const [lk2,v] of Object.entries(s.labels||{}))if(typeof v=="boolean"){const r=x.rates[lk2]||(x.rates[lk2]={n:0,t:0,hn:0,ht:0});r.n++;r.t+=v;if(hit){r.hn++;r.ht+=v}}}
  const sl=[...slices.values()].filter(x=>x.hit_items>0).sort((a,b)=>b.hit_items-a.hit_items||(a.d<b.d?-1:1)).slice(0,300);
  const rk=[...new Set(sl.flatMap(x=>Object.keys(x.rates)))].slice(0,6);
  let h=scope=="text"?`<p><b>${total.items.toLocaleString()}</b> items match <span class="mono">(${secsTaken}s; ${loadedNote})</span></p>`:
    `<p><b>${total.reads.toLocaleString()}</b> matching reads at <b>${total.positions.toLocaleString()}</b> token positions in <b>${total.items.toLocaleString()}</b> items <span class="mono">(${secsTaken}s; ${loadedNote})</span> · <a href="#" id="scsv">CSV of all matching reads</a></p>`;
  if(sl.length)h+=`<div class="wrap" style="max-height:340px;overflow:auto"><table><tr><th>Dataset</th><th>Group</th><th>Items</th><th>With hit</th>${rk.map(k=>`<th title="rate among items with a hit · overall">${esc(k)} | hit · all</th>`).join("")}</tr>${sl.map(x=>
    `<tr><td class="mono wrapid">${esc(x.d)}</td><td>${esc(x.grp??"")}</td><td class="num">${x.items}</td><td class="num">${x.hit_items} (${pct(x.hit_items/x.items)})</td>${rk.map(k=>{const r=x.rates[k];return `<td class="num">${r&&r.n?`${pct(r.hn?r.ht/r.hn:null)} · ${pct(r.t/r.n)}`:"–"}</td>`}).join("")}</tr>`).join("")}</table></div>`;
  const page=+(p.get("page")||0),per=50,pages=Math.ceil(rows.length/per);
  const nav=`<div class="pager">${page>0?`<a class="btn" href="${linkTo({...Object.fromEntries(p),page:page-1})}">← prev</a>`:""}<span class="mono">page ${page+1} / ${Math.max(1,pages)}</span>${page+1<pages?`<a class="btn" href="${linkTo({...Object.fromEntries(p),page:page+1})}">next →</a>`:""}</div>`;
  const labChips=l=>Object.entries(l||{}).slice(0,6).map(([k,v])=>chip(k,v)).join("");
  const lkh=o=>Object.entries(o||{}).map(([a,u])=>`<a class="chip" href="${esc(u)}" target="_blank" rel="noopener">${esc(a)} ↗</a>`).join("");
  h+=nav+rows.slice(page*per,(page+1)*per).map(x=>{
    if(scope=="text"){const href=linkTo({dataset:x.d,item:x.i,view:"call",query:q,case:p.get("case")});
      return `<div class="card"><div class="chips"><a class="chip" href="${href}">${esc(x.i)}</a><span class="chip mono">${esc(x.d)}</span>${x.grp!=null?`<span class="chip">${esc(x.grp)}</span>`:""}${labChips(x.labels)}${lkh(x.links)}</div><div class="ctx">…${hl(x.snippet,rx)}…</div></div>`}
    const P=x.P,s=P.s,href=linkTo({dataset:P.d,item:P.i,view:"tr",token:P.pos,query:q,case:p.get("case")}),c=P.ctx.slice(-300),tk=P.token;
    return `<div class="card"><div class="chips"><a class="chip" href="${href}">${esc(P.i)} @ ${P.pos}</a><span class="chip mono">${esc(P.d)}</span>${s.group!=null?`<span class="chip">${esc(s.group)}</span>`:""}${P.sec?`<span class="chip">${esc(P.sec)}</span>`:""}${labChips(s.labels)}${lkh(s.links)}</div>
     <div class="ctx">…${esc(c.endsWith(tk)?c.slice(0,c.length-tk.length):c)}<b>${esc(tk)}</b> ⟶ ${esc(P.nxt)}</div>
     <div class="reads">${x.reads.map(y=>`<div><span class="rn">${esc(y.tool)}${y.label?" · "+esc(y.label):""}</span>${hl(y.text,rx)}</div>`).join("")}</div></div>`}).join("")+nav;
  res.innerHTML=h;
  const csv=$("#scsv");if(csv)csv.onclick=e=>{e.preventDefault();const cell=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    const lines=[["dataset","item","group","pos","sec","token","tool","label","text","ctx","nxt","labels"].join(",")];
    for(const r of window.EXPVIEW_HITS)lines.push([r.P.d,r.P.i,r.P.s.group,r.P.pos,r.P.sec,r.P.token,r.tool,r.label,r.text,r.P.ctx,r.P.nxt,JSON.stringify(r.P.s.labels||{})].map(cell).join(","));
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"}));a.download="expview_search.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
}

// ================================================================ search everything: one regex over every read, episode, transcript and judge call, answered by expview/search_server.py
// Kylie's exception (2026-10-27) to "no backend": the server runs on bramble over the local HF mirror. The page shows this only when
// the server answers: the same origin when the page is served by it over http, or localStorage "expview:search_server" = its URL.
// (An https page, e.g. GitHub Pages, can't call an http server, so there it stays hidden.)
const SEARCH_API=store.get("search_server",null)||(location.protocol=="http:"?location.origin:null);
// where an https copy (GitHub Pages) sends "Search everything": the server's own copy of this page, on the tailnet (Kylie, 2026-10-27)
const SEARCH_PAGE=store.get("search_page","http://bramble:8840/expview/"),SEARCH_AWAY=location.protocol=="https:";
let SEARCH_OK=false;
const probeSearch=()=>SEARCH_API?fetch(SEARCH_API+"/api/ping",{signal:AbortSignal.timeout(1500)}).then(r=>r.ok).catch(()=>false):Promise.resolve(false);
const searchGo=q=>SEARCH_OK?go({everything:1,query:q}):SEARCH_AWAY?window.open(SEARCH_PAGE+linkTo({everything:1,query:q}),"_blank","noopener"):go({search:1,query:q});
async function everythingPage(p){
  VIEW="everything";crumbs([["envs","#"],["search everything"]]);
  const sc=p.get("scope"),scope=sc=="reads"||sc=="text"?sc:"all",q=p.get("query")||"",cs=p.get("case");
  const keys=["query","case","scope","novel","experiment","dataset","model","reader","section","group","label"];
  const qs=o=>new URLSearchParams(Object.entries(o).filter(([,v])=>v!=null&&v!=="")).toString();
  const sel=(id,opts,cur,all)=>`<select id="${id}">${all!=null?`<option value="">${all}</option>`:""}${opts.map(([v,n])=>`<option value="${esc(v)}" ${v==cur?"selected":""}>${esc(n)}</option>`).join("")}</select>`;
  $("#app").innerHTML=`<div class="page"><h1>Search everything</h1>
   <p class="desc">One regex over every metamodel read (O-lens bullets, J-lens / J++ top-k, NLA and reader outputs) at its token, every env episode's transcript and its judges, and every expview run's transcripts and judge calls, answered by the search server on bramble over its mirror of the HF dataset (it re-indexes new runs every 10 minutes). "New" drops a read whose match also appears in the transcript around its token. The table shows, per run and group, how many items have a hit and each yes/no label's rate among them vs overall.</p>
   <form class="sform" id="sf">
    <div class="row"><input class="rx" id="sq" type="text" value="${esc(q)}" placeholder="regex, e.g. \\bgrader" aria-label="regex"><button class="btn primary">Search</button>
     <label><input type="checkbox" id="scase" ${cs=="1"?"checked":""}> case-sensitive</label></div>
    <div class="row"><label>Experiment <select id="senv"><option value="">All experiments</option></select></label>
     <label>In ${sel("sscope",[["all","everything"],["reads","metamodel reads"],["text","transcripts and judge calls"]],scope)}</label>
     <label title="Drop a read when the regex also matches what the model just read or is about to write (an echo), or anywhere in the item">Keep reads ${sel("snovel",[["ctx","new vs ±40 tokens + next 16"],["transcript","new vs the whole item"]],p.get("novel")||"","all hits")}</label>
     <span id="sfacets" class="row"></span>
    </div>${p.get("dataset")||p.get("model")?`<div class="row mono">Only ${p.get("model")?`model ${esc(p.get("model"))}`:""} ${p.get("dataset")?`runs ${esc(p.get("dataset"))}`:""} <a href="${linkTo({...Object.fromEntries(p),dataset:"",model:"",page:""})}">(clear)</a></div>`:""}</form><div id="sres"></div></div>`;
  const params=()=>({everything:1,query:$("#sq").value.trim(),case:$("#scase").checked?"1":"",scope:$("#sscope").value=="all"?"":$("#sscope").value,novel:$("#snovel").value,experiment:$("#senv").value,
    dataset:p.get("dataset")||"",model:p.get("model")||"",reader:$("#stool")?.value||"",section:$("#ssec")?.value||"",group:$("#sgroup")?.value||"",label:$("#slabel")?.value||""});
  $("#sf").onsubmit=e=>{e.preventDefault();go(params())};
  $("#senv").onchange=()=>{const o=params();Object.assign(o,{dataset:"",model:"",reader:"",section:"",group:"",label:""});go(o)};
  $$("#sscope,#snovel,#scase").forEach(s=>s.onchange=()=>{if($("#sq").value.trim())go(params())});
  const res=$("#sres");
  if(!SEARCH_OK){res.innerHTML=`<p class="err">The search server ${esc(SEARCH_API||"")} isn't reachable (it runs on bramble; open this page from it). <a href="${linkTo({search:1,query:q})}">Search the reads of chosen runs instead</a>.</p>`;return}
  if(!q){res.innerHTML="";const r=await fetch(SEARCH_API+"/api/runs").then(r=>r.json());$("#senv").innerHTML+=[...new Set(r.map(x=>x.exp))].sort().map(e=>`<option value="${esc(e)}" ${e==p.get("experiment")?"selected":""}>${esc(e)}</option>`).join("");
    res.innerHTML=`<p class="mono">${r.length.toLocaleString()} runs, ${r.reduce((a,x)=>a+x.items,0).toLocaleString()} items indexed. Try <a href="${linkTo({everything:1,query:"\\bgrader"})}">\\bgrader</a> · <a href="${linkTo({everything:1,query:"being (tested|evaluated|watched)",scope:"reads",novel:"ctx"})}">being (tested|evaluated|watched)</a> (new reads only).</p>`;return}
  res.innerHTML='<p class="empty">Searching…</p>';
  const o=Object.fromEntries(keys.map(k=>[k,p.get(k)]));
  const page=+(p.get("page")||0);
  const r=await fetch(SEARCH_API+"/api/search?"+qs({...o,page})).then(r=>r.json());
  if(VIEW!="everything"||H().get("query")!=q)return;
  $("#senv").innerHTML+=r.experiments?.map(e=>`<option value="${esc(e)}" ${e==p.get("experiment")?"selected":""}>${esc(e)}</option>`).join("")||"";
  if(r.error){res.innerHTML=`<p class="err">${esc(r.error)}</p>`;return}
  const rx=rxOf(q,cs=="1"),F=r.facets;
  $("#sfacets").innerHTML=(scope!="text"?`<label>Reader ${sel("stool",F.reader.map(([t,n])=>[t,`${t} (${n.toLocaleString()})`]),p.get("reader")||"","all")}</label>
     <label>Section ${sel("ssec",F.section.map(s=>[s,s||"(none)"]),p.get("section")||"","all")}</label>`:"")+
    `<label>Group ${sel("sgroup",F.group.map(([g,n])=>[g,`${g} (${n})`]),p.get("group")||"","all")}</label>`+
    `<label>Label ${sel("slabel",F.label.flatMap(([k,m])=>m.map(([v,n])=>[`${k}=${v}`,`${k} = ${v} (${n})`])),p.get("label")||"","any")}</label>`;
  $$("#sfacets select").forEach(s=>s.onchange=()=>go(params()));
  const kc=new Map();for(const x of r.table)for(const k of Object.keys(x.rates))kc.set(k,(kc.get(k)||0)+x.hit_items);
  const rk=[...kc].sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k])=>k);  // the yes/no labels of the most hits

  const runChip=d=>{const m=r.meta[d]||{},e=envOfD(d);return `<span class="chip mono" title="${esc(d)}">${e?`${esc(e.env)} · ${esc(m.target?String(m.target).split("@")[0].split("/").pop():e.run)}`:esc(d)}</span>`};
  const labChips=l=>Object.entries(l||{}).slice(0,6).map(([k,v])=>chip(k,v)).join("");
  let h=`<p><b>${r.hit_items.toLocaleString()}</b> items in <b>${r.hit_runs}</b> runs of <b>${r.hit_experiments}</b> experiments match`+
    (scope!="reads"?` · <b>${r.text_items.toLocaleString()}</b> by their transcript or judge calls`:"")+
    (scope!="text"?` · <b>${r.read_hits.toLocaleString()}</b> matching reads at <b>${r.read_positions.toLocaleString()}</b> token positions in <b>${r.read_items.toLocaleString()}</b> items${r.read_hits?` · <a href="${SEARCH_API}/api/csv?${qs(o)}">CSV of all matching reads</a>`:""}`:"")+
    ` <span class="mono">(${r.took}s over ${r.runs.toLocaleString()} runs, ${r.items.toLocaleString()} items, ${r.reads.toLocaleString()} reads)</span></p>`;
  // experiments first (runs are an implementation detail); runs only inside one experiment, collapsed
  if(!p.get("experiment"))h+=`<div class="wrap"><table id="sbyexp"><tr><th>Experiment</th><th>Items with a hit</th><th>In transcripts / judge calls</th><th>In reads</th><th>Runs</th></tr>${r.by_experiment.map(e=>
    `<tr class="click" data-e="${esc(e.exp)}" title="only this experiment"><td class="mono">${esc(e.exp)}</td><td class="num">${e.items.toLocaleString()}</td><td class="num">${e.text.toLocaleString()}</td><td class="num">${e.reads.toLocaleString()}</td><td class="num">${e.runs}</td></tr>`).join("")}</table></div>`;
  if(p.get("experiment")&&r.by_group.length){
    const kc=new Map();for(const x of r.by_group)for(const k of Object.keys(x.rates))kc.set(k,(kc.get(k)||0)+x.items);
    const prim=kc.has("positive")?"positive":[...kc].sort((a,b)=>b[1]-a[1])[0]?.[0];
    const anyModel=r.by_group.some(x=>x.model);
    h+=`<h2>${esc(p.get("experiment"))} by ${anyModel?"arm and model":"group"}</h2><div class="wrap" style="max-height:480px;overflow:auto"><table id="sbygrp"><tr><th>${anyModel?"Arm / group":"Group"}</th>${anyModel?"<th>Model</th>":""}<th>Items with a hit</th><th>In transcripts / judge calls</th><th>In reads</th>${prim?`<th title="rate among items with a hit · overall">${esc(prim)} | hit · all</th>`:""}</tr>${r.by_group.map((x,j)=>{const v=prim&&x.rates[prim];
      return `<tr class="click" data-j="${j}" title="only these items"><td class="mono">${esc(x.group??x.d)}</td>${anyModel?`<td class="mono">${esc(x.model||"")}</td>`:""}<td class="num">${x.hit_items.toLocaleString()} / ${x.items.toLocaleString()} (${pct(x.hit_items/x.items)})</td><td class="num">${x.text.toLocaleString()}</td><td class="num">${x.reads.toLocaleString()}</td>${prim?`<td class="num">${v&&v[0]?`${pct(v[2]?v[3]/v[2]:null)} · ${pct(v[1]/v[0])}`:"–"}</td>`:""}</tr>`}).join("")}</table></div>`}
  else if(r.table.length)h+=`<details><summary class="mono">By run and group (${r.table.length})</summary>`+`<div class="wrap" style="max-height:340px;overflow:auto"><table><tr><th>Run</th><th>Group</th><th>Items</th><th>With hit</th>${rk.map(k=>`<th title="rate among items with a hit · overall">${esc(k)} | hit · all</th>`).join("")}</tr>${r.table.map(x=>
    `<tr><td class="mono wrapid" style="min-width:300px">${esc(x.d)}</td><td>${esc(x.grp??"")}</td><td class="num">${x.items}</td><td class="num">${x.hit_items} (${pct(x.hit_items/x.items)})</td>${rk.map(k=>{const v=x.rates[k];return `<td class="num">${v&&v[0]?`${pct(v[2]?v[3]/v[2]:null)} · ${pct(v[1]/v[0])}`:"–"}</td>`}).join("")}</tr>`).join("")}</table></div>`+`</details>`;
  const pages=Math.ceil(r.total_hits/50);
  const nav=`<div class="pager">${page>0?`<a class="btn" href="${linkTo({...Object.fromEntries(p),page:page-1})}">← prev</a>`:""}<span class="mono">page ${page+1} / ${Math.max(1,pages)}</span>${page+1<pages?`<a class="btn" href="${linkTo({...Object.fromEntries(p),page:page+1})}">next →</a>`:""}</div>`;
  let lastExp=null;
  h+=nav+r.hits.map(x=>{const ex=x.exp,sep=ex!=lastExp&&!p.get("experiment")?`<h2 class="mono">${esc(ex)} <a class="btn" href="${linkTo({...Object.fromEntries(p),experiment:ex,page:""})}">only this</a></h2>`:"";lastExp=ex;return sep+hitCard(x)}).join("")+nav;
  res.innerHTML=h;
  const bg=$("#sbygrp");if(bg)bg.onclick=ev=>{const tr=ev.target.closest("tr[data-j]");if(!tr)return;const x=r.by_group[+tr.dataset.j];
    go({...Object.fromEntries(p),page:"",group:x.group??"",model:x.model||"",dataset:x.d||""})};
  const bt=$("#sbyexp");if(bt)bt.onclick=ev=>{const tr=ev.target.closest("tr[data-e]");if(tr)go({...Object.fromEntries(p),experiment:tr.dataset.e,page:"",dataset:"",group:"",label:""})};
  function hitCard(x){const head=`${runChip(x.d)}${x.g!=null?`<span class="chip">${esc(x.g)}</span>`:""}`;
    if(x.kind=="text")return `<div class="card"><div class="chips"><a class="chip" href="${itemHref(x,{view:x.where=="transcript"?"tr":"call"})}">${esc(x.i)}</a>${head}<span class="chip">${esc(x.where)}</span>${labChips(x.l)}</div><div class="ctx">…${hl(x.snippet,rx)}…</div></div>`;
    const c=x.ctx,tk=x.token;
    return `<div class="card"><div class="chips"><a class="chip" href="${itemHref(x,{view:"tr",token:x.pos})}">${esc(x.i)} @ ${x.pos}</a>${head}${x.sec?`<span class="chip">${esc(x.sec)}</span>`:""}${labChips(x.l)}</div>
     <div class="ctx">…${esc(c.endsWith(tk)?c.slice(0,c.length-tk.length):c)}<b>${esc(tk)}</b> ⟶ ${esc(x.nxt)}</div>
     <div class="reads">${x.reads.map(([t,l,txt])=>`<div><span class="rn">${esc(t)}${l?" · "+esc(l):""}</span>${hl(txt,rx)}</div>`).join("")}</div></div>`}
}

// ================================================================ boot
(function theme(){const t=store.get("theme",null);if(t)document.documentElement.dataset.theme=t;
  $("#theme").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    const nx=cur=="dark"?"light":"dark";document.documentElement.dataset.theme=nx;store.set("theme",nx)}})();
(async()=>{
  SRC=STATIC?await staticSource():hfSource();
  if(STATIC){$("#tosearch").hidden=true;$("#topnav").hidden=true;$(".brand").textContent="expview";$(".brand").href="#"}
  if(!STATIC&&(SEARCH_OK=await probeSearch()))$("#toall").hidden=false;
  else if(!STATIC&&SEARCH_AWAY){const a=$("#toall");Object.assign(a,{hidden:false,href:SEARCH_PAGE+"#everything=1",target:"_blank",rel:"noopener",title:"tailnet only",textContent:"Search everything ↗"});
    a.onmouseenter=a.onfocus=()=>{const q=H().get("query");a.href=SEARCH_PAGE+(q?linkTo({everything:1,query:q}):"#everything=1")}}
  window.addEventListener("hashchange",route);await route();
})().catch(e=>{$("#app").innerHTML=`<div class="page err">Could not start: ${esc(e.message||e)}</div>`});
</script>
</body>
