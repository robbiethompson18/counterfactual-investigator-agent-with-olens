<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olens Regex Search</title>
<style>
:root{--bg:#f7f7f4;--panel:#fff;--ink:#1c1e1a;--muted:#646a5f;--line:#dcdfd6;--accent:#2f5d62;--mark:#ffe07a;--markink:#2b2100;--sys:#eef0f6;--user:#eef6ee;--asst:#ffffff;--think:#f6f2e8;--tool:#f1eef6;--call:#eaf3f5;--pos:#b5462f;--aw:#4a5bd0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121412;--panel:#1a1d19;--ink:#e4e7e0;--muted:#9aa194;--line:#30352d;--accent:#7cc0c6;--mark:#6b5a12;--markink:#fff3c4;--sys:#1d2130;--user:#1b261b;--asst:#1a1d19;--think:#262217;--tool:#231f2b;--call:#18262a;--pos:#ef8c74;--aw:#9aa6ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:15px;margin:0 12px 0 0;white-space:nowrap}
h1 a{color:inherit;text-decoration:none}
input[type=text]{font:13px ui-monospace,Menlo,monospace;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);min-width:260px;flex:1}
select,button{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
button.primary{background:var(--accent);color:var(--panel);border-color:var(--accent);cursor:pointer}
button{cursor:pointer}
label{font-size:13px;color:var(--muted);display:flex;gap:4px;align-items:center}
main{padding:14px 16px 60px;max-width:1500px;margin:0 auto}
.muted{color:var(--muted)} .mono{font-family:ui-monospace,Menlo,monospace}
table{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
td.n{text-align:right}
.tw{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px;font-size:11.5px}
.chip{padding:0 6px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.chip.p{color:var(--pos);border-color:var(--pos)} .chip.a{color:var(--aw);border-color:var(--aw)}
.ctx{font:12px ui-monospace,Menlo,monospace;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.ctx b{color:var(--ink);background:var(--think);padding:0 2px}
.reads div{word-break:break-word;font-size:13px}
.reads .rd{color:var(--muted);font:11px ui-monospace,Menlo,monospace;margin-right:6px}
mark{background:var(--mark);color:var(--markink);border-radius:2px;padding:0 1px}
a{color:var(--accent)}
.pager{display:flex;gap:8px;align-items:center;margin:10px 0}
#ep{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:14px}
@media (max-width:900px){#ep{grid-template-columns:1fr}}
.tx{font:12.5px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.blk{padding:6px 10px;border-left:3px solid var(--line);margin:4px 0;border-radius:3px}
.blk .who{font:600 10.5px system-ui;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block}
.system{background:var(--sys)} .user{background:var(--user)} .assistant{background:var(--asst);border-left-color:var(--accent)}
.reasoning{background:var(--think);border-left-color:#c9a64a} .tool{background:var(--tool)} .tool_call{background:var(--call)}
.mk{font:600 9px system-ui;padding:0 3px;margin:0 1px;border-radius:3px;border:1px solid var(--accent);color:var(--accent);background:transparent;vertical-align:super;line-height:1.2;cursor:pointer}
.mk.hit{background:var(--mark);color:var(--markink);border-color:#b38f00}
.mk.sel{outline:2px solid var(--pos)}
.side{position:sticky;top:120px;align-self:start;max-height:calc(100vh - 140px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
@media (max-width:900px){.side{position:static;max-height:none}}
.side h3{margin:4px 0;font-size:13px}
.grp{margin-bottom:8px} .grp .nm{font:600 11px ui-monospace,Menlo,monospace;color:var(--accent)}
#err{color:var(--pos)}
.tok{border-bottom:2px solid var(--kc);cursor:pointer;border-radius:2px}
.tok.hit{background:var(--mark);color:var(--markink)}
.tok.sel{outline:2px solid var(--pos)}
.peek{font:11px system-ui,sans-serif;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--kc);border-radius:3px;padding:0 4px;margin:0 2px;cursor:pointer;white-space:normal}
.peek.hit{border-color:#b38f00;color:var(--ink)}
.peek:hover{color:var(--ink)}
.exp{display:block;white-space:normal;font:12.5px/1.45 system-ui,sans-serif;margin:4px 0 6px}
.exp[hidden]{display:none}
.exp .box{display:block;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--pos);border-radius:4px;padding:6px 9px}
.exp .grp{display:block;margin-top:4px}.exp .nm{display:block;font:600 11px ui-monospace,Menlo,monospace;color:var(--accent)}.exp .ln{display:block}
.card{cursor:pointer}
@keyframes fl{0%{background:var(--pos);color:#fff}100%{}}
.tok.flash{animation:fl 1.6s ease-out}
@media (prefers-reduced-motion:reduce){.tok.flash{animation:none;outline:2px solid var(--pos)}}

</style>
</head>
<body>
<header>
  <form class="row" id="f">
    <h1><a href="#">olens regex</a></h1>
    <input type="text" id="q" placeholder="regex, e.g. eval rubric|being (tested|evaluated)" aria-label="regex">
    <label><input type="checkbox" id="case"> case-sensitive</label>
    <select id="novel" aria-label="novelty"><option value="none">all hits</option><option value="ctx">novel vs ±40 ctx + next 16</option><option value="transcript">novel vs whole transcript</option></select>
    <button class="primary" type="submit">Search</button>
    <a id="csv" href="#" class="muted">CSV</a>
  </form>
  <div class="row">
    <select id="readers" aria-label="reader"><option value="">all readers</option></select>
    <select id="configs" aria-label="config"><option value="">all configs</option></select>
    <select id="env" aria-label="env"><option value="">all envs</option></select>
    <select id="arm" aria-label="arm"><option value="">all arms</option></select>
    <select id="kind" aria-label="kind"><option value="">all kinds</option></select>
    <select id="role" aria-label="role"><option value="">all roles</option></select>
    <select id="label" aria-label="label"><option value="">any label</option><option value="positive">positive</option><option value="negative">negative</option><option value="aware">aware</option><option value="unaware">unaware</option></select>
    <span id="err"></span>
  </div>
</header>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const F=["q","case","novel","readers","configs","env","arm","kind","role","label"];
let META=null;
function jsRx(q,cs){try{return new RegExp(q,cs?"g":"gi")}catch(e){return null}}
function hl(text,rx){const t=String(text??"");if(!rx)return esc(t);let out="",last=0;rx.lastIndex=0;let m;while((m=rx.exec(t))){if(!m[0].length){rx.lastIndex++;continue}out+=esc(t.slice(last,m.index))+"<mark>"+esc(m[0])+"</mark>";last=m.index+m[0].length}return out+esc(t.slice(last))}
function state(){const p=new URLSearchParams(location.hash.slice(1));return p}
function params(){const p=new URLSearchParams();for(const k of F){const el=$("#"+k);const v=k==="case"?(el.checked?"1":"0"):el.value;if(v)p.set(k,v)}return p}
function fill(p){for(const k of F){const el=$("#"+k);if(!el)continue;if(k==="case")el.checked=p.get(k)==="1";else if(p.has(k))el.value=p.get(k)}}
function pct(x){return x==null?"–":(100*x).toFixed(0)+"%"}
async function api(path){const r=await fetch(path);if(!r.ok){throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail)}return r.json()}
function opts(sel,vals,keep){const el=$(sel),cur=keep??el.value;const first=el.options[0].outerHTML;el.innerHTML=first+vals.map(v=>`<option>${esc(v)}</option>`).join("");if(vals.includes(cur))el.value=cur}
function envOpts(){const c=$("#configs").value,e=$("#env").value;const rows=META.envs.filter(x=>!c||x.config===c);opts("#env",[...new Set(rows.map(x=>x.env))]);opts("#arm",[...new Set(rows.filter(x=>!e||x.env===e).map(x=>x.arm))])}
async function init(){META=await api("/api/meta");opts("#readers",META.readers.map(x=>x.reader));opts("#configs",META.configs.map(x=>x.config));opts("#kind",META.kinds.map(x=>x.kind));opts("#role",META.roles.map(x=>x.role));
 $("#configs").onchange=()=>{$("#env").value="";$("#arm").value="";envOpts()};$("#env").onchange=()=>{$("#arm").value="";envOpts()};envOpts();
 $("#f").onsubmit=e=>{e.preventDefault();const p=params();p.set("page","0");location.hash=p.toString()};window.onhashchange=route;route()}
async function route(){const p=state();$("#err").textContent="";if(p.has("ep"))return episode(p);fill(p);envOpts();fill(p);if(!p.get("q")){$("#main").innerHTML=home();return}return search(p)}
function home(){return `<p class="muted">Regex over ${META.readers.reduce((a,x)=>a+x.n,0).toLocaleString()} reader outputs at ${META.configs.reduce((a,x)=>a+x.n,0).toLocaleString()} read positions (GLM-5.3 olens SFT/RL greedy + 4 samples, Qwen3.6-27B distilled / from-scratch readers, J-lens L60/L51 top-10). RE2 syntax, case-insensitive by default. "Novel" drops hits whose regex also matches the position's ±40-token context and true next 16 tokens (or anywhere in the transcript).</p>
<table style="max-width:600px"><thead><tr><th>config</th><th class="n">episodes</th><th class="n">positions</th></tr></thead><tbody>${META.configs.map(c=>`<tr><td>${c.config}</td><td class="n">${c.eps.toLocaleString()}</td><td class="n">${c.n.toLocaleString()}</td></tr>`).join("")}</tbody></table>
<p class="muted" style="margin-top:12px">Try: <a href="#q=eval%20rubric">eval rubric</a> · <a href="#q=being%20(tested%7Cevaluated%7Cwatched)&novel=ctx">being (tested|evaluated|watched)</a> · <a href="#q=%5Cbgrader&novel=ctx&configs=is_prime">grader in is_prime</a></p>`}
async function search(p){const page=+(p.get("page")||0);const qs=new URLSearchParams(p);qs.delete("page");$("#csv").href="/api/csv?"+qs.toString();
 $("#main").innerHTML='<p class="muted">Searching…</p>';let d;try{d=await api(`/api/search?${qs}&page=${page}&per=50`)}catch(e){$("#err").textContent=e.message;$("#main").innerHTML="";return}
 const rx=jsRx(p.get("q"),p.get("case")==="1");const t=d.total;
 let h=`<p><b>${t.reads.toLocaleString()}</b> matching reads at <b>${t.positions.toLocaleString()}</b> positions in <b>${t.episodes.toLocaleString()}</b> episodes (episode = one transcript view).</p>`;
 h+=`<div class="tw"><table><thead><tr><th>config</th><th>env</th><th>arm</th><th class="n">episodes</th><th class="n">with hit</th><th class="n">positive | hit</th><th class="n">positive all</th><th class="n">aware | hit</th><th class="n">aware all</th></tr></thead><tbody>${d.by_slice.map(x=>`<tr><td>${esc(x.config)}</td><td class="mono">${esc(x.env)}</td><td class="mono">${esc(x.arm)}</td><td class="n">${x.episodes}</td><td class="n">${x.hit_eps} (${pct(x.hit_eps/x.episodes)})</td><td class="n">${pct(x.pos_rate_hit)}</td><td class="n">${pct(x.pos_rate)}</td><td class="n">${pct(x.aware_rate_hit)}</td><td class="n">${pct(x.aware_rate)}</td></tr>`).join("")}</tbody></table></div>`;
 const pages=Math.ceil(t.positions/50);const nav=`<div class="pager">${page>0?`<button data-p="${page-1}">← prev</button>`:""}<span class="muted">page ${page+1} / ${Math.max(1,pages)}</span>${page+1<pages?`<button data-p="${page+1}">next →</button>`:""}</div>`;
 h+=nav+d.rows.map(r=>{const back=new URLSearchParams(p);const ep=new URLSearchParams({ep:r.tid,pos:r.pos,q:p.get("q")||"",case:p.get("case")||"0"});
  return `<div class="card" data-href="#${ep}"><div class="chips"><span class="chip">${esc(r.config)}</span><span class="chip mono">${esc(r.env)}</span><span class="chip mono">${esc(r.arm)}</span><span class="chip">${esc(r.kind)} · ${esc(r.role)}</span>${r.positive?'<span class="chip p">positive</span>':'<span class="chip">negative</span>'}${r.aware===true?'<span class="chip a">aware</span>':r.aware===false?'<span class="chip">unaware</span>':""}${r.view==="late"?'<span class="chip">late view</span>':""}<a class="chip" href="#${ep}">transcript @${r.pos}</a>${r.docent?`<a class="chip" href="${esc(r.docent)}" target="_blank" rel="noopener">Docent</a>`:""}<span class="chip mono">${esc(r.run_dir)}:${r.row_index}</span></div>
  <div class="ctx">…${esc(r.ctx.slice(0,r.ctx.length-String(r.token).length))}<b>${esc(r.token)}</b> ⟶ ${esc(r.next16)}</div>
  <div class="reads">${r.reads.map(x=>`<div><span class="rd">${x.reader}/${x.sample}</span>${hl(x.text,rx)}</div>`).join("")}</div></div>`}).join("")+nav;
 $("#main").innerHTML=h;document.querySelectorAll(".card[data-href]").forEach(c=>c.onclick=ev=>{if(ev.target.closest("a,button")||getSelection().toString())return;location.hash=c.dataset.href.slice(1)});document.querySelectorAll(".pager button").forEach(b=>b.onclick=()=>{const q=state();q.set("page",b.dataset.p);location.hash=q.toString();scrollTo(0,0)})}
const ROLE_RX=/<\|system\|>|<\|user\|>|<\|assistant\|>|<\|observation\|>|<think>|<\/think>|<tool_call>|<\/tool_call>/g;
const NEXT={"<|system|>":"system","<|user|>":"user","<|assistant|>":"assistant","<|observation|>":"tool","<think>":"reasoning","</think>":"assistant","<tool_call>":"tool_call","</tool_call>":"assistant"};
const KCOL={final_reasoning:"#c9a64a",pre_action:"#c0563c",final_answer:"#2f7d62",final_user:"#4a5bd0",arm_diff:"#9c3fb0",fill:"#8a8f86"};
const kcol=k=>KCOL[String(k).split("+")[0]]||"#8a8f86";
function lsGet(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
async function episode(p){const tid=p.get("ep"),focus=+p.get("pos");const rx=p.get("q")?jsRx(p.get("q"),p.get("case")==="1"):null;
 $("#main").innerHTML='<p class="muted">Loading…</p>';let d;try{d=await api("/api/episode?tid="+encodeURIComponent(tid))}catch(e){$("#err").textContent=e.message;return}
 const e=d.episode,P=d.positions,text=e.rendered_text,f0=P[0]||{};
 const peekReader=lsGet("peek","glm_rl");const onlyHits=!!rx&&lsGet("onlyhits","0")==="1";
 const pick=y=>{const r=y.reads.find(r=>r.reader===peekReader&&(r.sample==="greedy"||r.sample==="top10"));return r?r.text:""};
 const isHit=y=>!!rx&&y.reads.some(r=>{rx.lastIndex=0;return rx.test(r.text)});
 const ev=[];let m;ROLE_RX.lastIndex=0;while((m=ROLE_RX.exec(text)))ev.push({i:m.index,len:m[0].length,role:NEXT[m[0]],tag:m[0]});
 P.forEach((x,k)=>{if(x.char_end>=0){const tl=String(x.token).length;const st=text.slice(x.char_end-tl,x.char_end)===x.token?x.char_end-tl:x.char_end;ev.push({i:st,end:x.char_end,mk:k})}});
 ev.sort((a,b)=>a.i-b.i||(a.mk==null?-1:1));
 const blk=r=>`<div class="blk ${r}"><span class="who">${r.replace("_"," ")}</span>`;
 let html=blk("system"),last=0;
 for(const x of ev){if(x.i<last)continue;html+=esc(text.slice(last,x.i));
  if(x.mk!=null){const y=P[x.mk],hit=isHit(y),pk=pick(y);
   html+=`<span class="tok${hit?" hit":""}" data-k="${x.mk}" style="--kc:${kcol(y.kind)}" title="pos ${y.pos} · ${esc(y.kind)}">${esc(text.slice(x.i,x.end))}</span>`;
   if(peekReader!=="off"&&(!onlyHits||hit))html+=`<span class="peek${hit?" hit":""}" data-k="${x.mk}" style="--kc:${kcol(y.kind)}" title="${esc(pk)}">${hl(pk.length>70?pk.slice(0,70)+"…":pk,rx)}</span>`;
   html+=`<span class="exp" id="exp${x.mk}" hidden></span>`;last=x.end}
  else{html+="</div>"+blk(x.role)+`<span class="muted">${esc(x.tag)}</span>`;last=x.i+x.len}}
 html+=esc(text.slice(last))+"</div>";
 const nh=P.filter(isHit).length;
 const readers=[...new Set(P.flatMap(y=>y.reads.map(r=>r.reader)))];
 $("#main").innerHTML=`<p><a href="javascript:history.back()">← back</a> · <b>${esc(f0.config)}</b> · <span class="mono">${esc(f0.env)} / ${esc(f0.arm)}</span> · ${f0.positive?'<span style="color:var(--pos)">positive</span>':"negative"}${f0.aware===true?' · <span style="color:var(--aw)">aware</span>':f0.aware===false?" · unaware":""} · ${e.n_tokens_full.toLocaleString()} tokens${e.truncated?" (truncated view)":""} · <span class="mono muted">${esc(e.run_dir)}:${e.row_index}</span>${e.docent?` · <a href="${esc(e.docent)}" target="_blank" rel="noopener">Docent</a>`:""}</p>
 <div class="row" style="margin-bottom:8px"><label>inline peek <select id="peeksel">${["off",...readers].map(r=>`<option${r===peekReader?" selected":""}>${r}</option>`).join("")}</select></label>
 ${rx?`<label><input type="checkbox" id="onlyhits"${onlyHits?" checked":""}> peeks only where a read matches</label>`:""}<button id="expall">expand all</button><button id="colall">collapse all</button>
 ${rx?`<button id="nexthit">next match (${nh})</button>`:""}
 <span class="muted">${P.length} read tokens, underlined by position kind: ${Object.entries(KCOL).map(([k,c])=>`<span style="border-bottom:2px solid ${c}">${k}</span>`).join(" ")}. Click a token or its peek to expand every reader; j / k jump between read tokens, Enter toggles.</span></div>
 <div class="tx">${html}</div>`;
 const toggle=(k,force)=>{const el=document.getElementById("exp"+k);if(!el)return null;const open=force??el.hidden;if(open&&!el.dataset.done){const y=P[k];const g={};y.reads.forEach(r=>(g[r.reader]=g[r.reader]||[]).push(r));
   el.innerHTML=`<span class="box"><b>pos ${y.pos}</b> <span class="muted">${esc(y.kind)} · ${esc(y.role)} · token <span class="mono">${esc(y.token)}</span> · next 16: <span class="mono">${esc(y.next16)}</span></span>`+Object.entries(g).map(([nm,rs])=>`<span class="grp"><span class="nm">${nm}</span>${rs.map(r=>`<span class="ln"><span class="muted mono" style="font-size:10.5px">${r.sample}</span> ${hl(r.text,rx)}</span>`).join("")}</span>`).join("")+"</span>";el.dataset.done=1}
  el.hidden=!open;document.querySelectorAll(`.tok[data-k="${k}"]`).forEach(t=>t.classList.toggle("sel",open));return el};
 document.querySelectorAll(".tok,.peek").forEach(t=>t.onclick=()=>toggle(+t.dataset.k));
 $("#peeksel").onchange=ev=>{lsSet("peek",ev.target.value);episode(p)};if($("#onlyhits"))$("#onlyhits").onchange=ev=>{lsSet("onlyhits",ev.target.checked?"1":"0");episode(p)};
 $("#expall").onclick=()=>P.forEach((_,k)=>toggle(k,true));$("#colall").onclick=()=>P.forEach((_,k)=>toggle(k,false));
 let hi=-1;const hits=P.map((y,k)=>isHit(y)?k:-1).filter(k=>k>=0);
 if($("#nexthit"))$("#nexthit").onclick=()=>{if(!hits.length)return;hi=(hi+1)%hits.length;const el=toggle(hits[hi],true);document.querySelector(`.tok[data-k="${hits[hi]}"]`)?.scrollIntoView({block:"center"})};
 const go=k=>{const t=document.querySelector(`.tok[data-k="${k}"]`);if(!t)return;cur=k;t.scrollIntoView({block:"center"});t.classList.remove("flash");void t.offsetWidth;t.classList.add("flash")};
 let cur=-1;const order=[...document.querySelectorAll(".tok")].map(t=>+t.dataset.k);
 document.onkeydown=ev=>{if(!location.hash.includes("ep=")||ev.target.closest("input,select,textarea"))return;const i=order.indexOf(cur);
  if(ev.key==="j"){go(order[Math.min(order.length-1,i+1)])}else if(ev.key==="k"){go(order[Math.max(0,i-1)])}else if(ev.key==="Enter"&&cur>=0){toggle(cur)}};
 const k=P.findIndex(x=>x.pos===focus);if(k>=0){toggle(k,true);go(k)}}
init().catch(e=>{$("#err").textContent=e.message});
</script>
</body>
</html>
