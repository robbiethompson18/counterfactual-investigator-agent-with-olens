# Publishes the env viewer to GitHub Pages on every push to main that touches environments/, expview's page or the talk: the page
# (environments/_lib/page.html) plus spec/, every env's arms / comparisons / RETIRED / STARRED built from the code by
# `python -m environments spec --out`, expview (expview/static/index.html) at /expview/, and the talk deck
# (`make -C slides`, figures from the public HF dataset) at /talk.pdf. Runs, rates, rollouts and reads still come from HF.
# Pages source is GitHub Actions (enabled 2026-10-27). Each deploy replaces the whole site: add other pages to site/ here.
# A PR touching slides/ or graphs/ builds the deck too and attaches talk.pdf to the run as an artifact, without deploying.
# If the deck fails to build on main, the site still deploys and keeps the last live talk.pdf.
name: env viewer pages
on:
  push:
    branches: [main]
    paths: [environments/**, expview/static/index.html, slides/**, graphs/**, .github/workflows/env-viewer-pages.yml]
  pull_request:
    paths: [slides/**, graphs/**, .github/workflows/env-viewer-pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  talk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends texlive-xetex texlive-latex-extra texlive-fonts-recommended latexmk fonts-inter fonts-jetbrains-mono fonts-noto-cjk
      - run: make -C slides
      - uses: actions/upload-artifact@v4
        with:
          name: talk
          path: slides/talk/build/talk.pdf
  deploy:
    needs: talk
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: mkdir -p site/expview && cp environments/_lib/page.html site/index.html && cp expview/static/index.html site/expview/index.html
      - run: uv run --frozen python -m environments spec --out site/spec
      - uses: actions/download-artifact@v4
        if: ${{ needs.talk.result == 'success' }}
        with:
          name: talk
          path: site
      - if: ${{ needs.talk.result != 'success' }}
        run: curl -fsSL -o site/talk.pdf https://robbiethompson18.github.io/counterfactual-investigator-agent-with-olens/talk.pdf || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
