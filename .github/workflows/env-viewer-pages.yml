# Publishes the env viewer to GitHub Pages on every push to main that touches environments/ or expview's page: the page
# (environments/_lib/page.html) plus spec/, every env's arms / comparisons / RETIRED / STARRED built from the code by
# `python -m environments spec --out`, and expview (expview/static/index.html) at /expview/. Runs, rates, rollouts and
# reads still come from the public HF dataset.
# Pages source is GitHub Actions (enabled 2026-10-27). Each deploy replaces the whole site: add other pages to site/ here.
name: env viewer pages
on:
  push:
    branches: [main]
    paths: [environments/**, expview/static/index.html, .github/workflows/env-viewer-pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: mkdir -p site/expview && cp environments/_lib/page.html site/index.html && cp expview/static/index.html site/expview/index.html
      - run: uv run --frozen python -m environments spec --out site/spec
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
