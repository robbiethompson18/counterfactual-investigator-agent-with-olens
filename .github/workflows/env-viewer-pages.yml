# Publishes the env viewer (environments/_lib/page.html) to GitHub Pages on every push to main that changes it.
# The page reads envs/ on the public HF dataset and source from GitHub, so only the HTML is deployed.
# One-time setup (repo admin): Settings -> Pages -> Source: GitHub Actions.
name: env viewer pages
on:
  push:
    branches: [main]
    paths: [environments/_lib/page.html, .github/workflows/env-viewer-pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir site && cp environments/_lib/page.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
