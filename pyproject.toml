[project]
name = "counterfactual-investigator-agent-with-olens"
version = "0.1.0"
description = "Zero-counterfactual investigator agent for CHIVE using metamodels (oracle lens, NLAs). MATS sprint with Neel Nanda."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "datasets>=5.1.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "openai>=3.35.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "svgpath2mpl>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counterfactual_investigator_agent_with_olens"]

[tool.ruff]
line-length = 140
extend-exclude = [
  "vendor",  # third-party submodules follow their own lint rules
  # files shipped into an env sandbox are task text the model reads: keep them byte-stable across runs
  "evalcue/envs/exclude_rows/task/model.py",
  "evalcue/envs/exclude_rows/task/baseline.py",
  "evalcue/envs/exclude_rows/task/eval.py",
  "evalcue/envs/exclude_rows/task/submit.py",
  "donehack/submit_solution_*.py",  # shown to the agent; kept byte-identical to agent-interp-envs
  "donehack/envport/*/task",  # copied from agent-interp-envs into the sandbox; kept byte-identical
  "donehack/envport/*/task_src",
]

[tool.ruff.lint]
extend-select = [
  "I",     # isort — ruff owns import ordering too
  "E501",  # line too long — not in ruff's defaults, and `ruff format` never wraps strings/comments
  "TID251", # banned-api, below
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"detective_joracle".msg = "vendor/ is reference-only: port what you need into our own code (see vendor/CLAUDE.md)"

[tool.ty.src]
exclude = [
  "vendor",
  "evalcue/envs/exclude_rows/task/model.py",
  "evalcue/envs/exclude_rows/task/baseline.py",
  "evalcue/envs/exclude_rows/task/eval.py",
  "evalcue/envs/exclude_rows/task/submit.py",
  "donehack/envport/*/task",
  "donehack/envport/*/task_src",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
