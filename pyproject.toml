[project]
name = "counterfactual-investigator-agent-with-olens"
version = "0.1.0"
description = "Zero-counterfactual investigator agent for CHIVE using metamodels (oracle lens, NLAs). MATS sprint with Neel Nanda."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "datasets>=5.1.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "openai>=3.35.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "svgpath2mpl>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counterfactual_investigator_agent_with_olens"]

[tool.ruff]
line-length = 140
extend-exclude = [
  "vendor",  # third-party submodules follow their own lint rules
]

[tool.ruff.lint]
extend-select = [
  "I",     # isort — ruff owns import ordering too
  "E501",  # line too long — not in ruff's defaults, and `ruff format` never wraps strings/comments
  "TID251", # banned-api, below
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"detective_joracle".msg = "vendor/ is reference-only: port what you need into our own code (see vendor/CLAUDE.md)"
"wsbench".msg = "vendor/ is reference-only: port what you need into our own code (see vendor/CLAUDE.md)"

[tool.ty.environment]
# Sibling modules that scripts import via sys.path.insert
extra-paths = ["olens/src", "expview", "transcript-viewer/web"]

[tool.ty.src]
exclude = [
  "vendor",
  "environments/retired",
]

[tool.ty.analysis]
# GPU-only deps live in RunPod venvs, not this one; the rest are imported from other checkouts on the pod
allowed-unresolved-imports = [
  "torch", "torch.**", "vllm", "vllm.**", "vllm_lens", "vllm_lens.**", "transformers", "transformers.**",
  "safetensors", "safetensors.**", "tokenizers", "sklearn", "sklearn.**", "statsmodels.**", "duckdb",
  "olens_glm53_usage", "realvariants", "email_env",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
