[project]
name = "counterfactual-investigator-agent-with-olens"
version = "0.1.0"
description = "Zero-counterfactual investigator agent for CHIVE using metamodels (oracle lens, NLAs). MATS sprint with Neel Nanda."
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "detective-joracle",
    "openai>=3.35.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counterfactual_investigator_agent_with_olens"]

[tool.ruff]
line-length = 140
extend-exclude = ["vendor"]  # third-party submodules follow their own lint rules

[tool.ruff.lint]
extend-select = [
  "I",     # isort — ruff owns import ordering too
  "E501",  # line too long — not in ruff's defaults, and `ruff format` never wraps strings/comments
]

[tool.uv.workspace]
members = [
    "vendor/detective-joracle",
]

[tool.uv.sources]
detective-joracle = { workspace = true, editable = true }

[tool.ty.src]
exclude = ["vendor"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
