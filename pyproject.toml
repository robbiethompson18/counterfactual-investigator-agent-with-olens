[project]
name = "counterfactual-investigator-agent-with-olsns"
version = "0.1.0"
description = "Zero-counterfactual investigator agent for CHIVE using metamodels (oracle lens, NLAs). MATS sprint with Neel Nanda."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counterfactual_investigator_agent_with_olsns"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
extend-select = [
  "I",     # isort — ruff owns import ordering too
  "E501",  # line too long — not in ruff's defaults, and `ruff format` never wraps strings/comments
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
