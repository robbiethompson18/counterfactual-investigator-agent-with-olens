# Multi-GPU node for the precompute fleet (scripts/fleet.py --multi-ids): the setup + one read
# server per GPU run as this task's own job (pod/fleet_job.sh), so no separate `sky exec` is
# needed; the servers exit after 15 idle minutes and the node autodowns.
name: weirdchat-olens-fleet8

resources:
  disk_size: 300
  ordered:
    - {infra: runpod, accelerators: "H100-SXM:8"}
    - {infra: runpod, accelerators: "H200-SXM:8"}
    - {infra: runpod, accelerators: "H100-SXM:4"}
    - {infra: runpod, accelerators: "H200-SXM:4"}

workdir: .

file_mounts:
  ~/olens: ../olens                # the lens library (repo-root olens/); sky runs from transcript-viewer/

secrets:
  HF_TOKEN: null

run: |
  bash ~/sky_workdir/pod/fleet_job.sh
