<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcript viewer</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --panel2:#faf9f7; --ink:#1d1c1a; --ink2:#5d5a55; --ink3:#8d8a84;
  --line:#e4e1dc; --accent:#c2552d; --accent-soft:#f6e3da; --blue:#2d6bc2; --blue-soft:#dfe9f7;
  --zone:#efe8fb; --zone-ink:#6a3fc0; --cite:#fff0b8; --cite-line:#d4a900; --good:#2f8a4e; --bad:#b3392f;
  --sel:#1d1c1a; --hl:#e8a33d; --user:#f1efea; --asst:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.04);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151513; --panel:#1d1d1b; --panel2:#232320; --ink:#ecebe7; --ink2:#a9a69f; --ink3:#77746e;
    --line:#33322f; --accent:#e27a50; --accent-soft:#3b2820; --blue:#6fa0ea; --blue-soft:#1f2b3d;
    --zone:#2a2240; --zone-ink:#b79cf5; --cite:#3d3518; --cite-line:#c9a227; --good:#5cc07f; --bad:#e2685d;
    --sel:#ecebe7; --hl:#d98e2b; --user:#262623; --asst:#1d1d1b; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
header{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
header h1 span{color:var(--accent)}
header .sub{color:var(--ink3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px;font-size:12.5px}
.btn:hover{border-color:var(--ink3)}
main{display:grid;grid-template-columns:330px minmax(0,1fr) 420px;height:calc(100% - 52px)}
aside,section{overflow:auto;min-height:0}
#left{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
#filters{padding:12px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
#dstabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
#dstabs button{font:inherit;font-size:12.5px;color:var(--ink2);background:none;border:0;border-radius:6px;padding:5px 4px;cursor:pointer;white-space:nowrap}
#dstabs button:hover{color:var(--ink)}
#dstabs button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
#filters label.row>span{width:38px;flex:none;font-size:12px;color:var(--ink3)}
input,select{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;width:100%}
.row{display:flex;gap:8px;align-items:center}
#plist{overflow:auto;flex:1}
.pi{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pi:hover{background:var(--panel2)}
.pi.on{background:var(--accent-soft)}
.pi .t{font-weight:560;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pi .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11px;border-radius:5px;padding:1px 6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.tag.b{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.pi .ov{margin-top:6px;font-size:12px;color:var(--zone-ink)}
.pi .ov b{font-weight:600}
#count{font-size:12px;color:var(--ink3)}
#mid{padding:18px 22px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 6px;letter-spacing:-.01em;line-height:1.3}
.desc{color:var(--ink2);margin:0 0 10px}
.kv{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.kv b{color:var(--ink);font-weight:600}
.elo{display:grid;grid-template-columns:110px 1fr 44px;gap:4px 10px;align-items:center;font-size:12px;margin-top:10px;max-width:420px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
#tpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#tpick select{width:auto;max-width:100%}
.ptab{width:100%;border-collapse:collapse;font-size:12.5px}
.ptab tr{cursor:pointer}.ptab tr:hover td{background:var(--panel2)}
.ptab td{border-top:1px solid var(--line);padding:5px 6px;vertical-align:middle}
.ptab .pn{white-space:nowrap;color:var(--ink2);width:1%}.ptab .pr{width:110px}.ptab .pk{white-space:nowrap;width:1%;font-variant-numeric:tabular-nums}
.ptab .pt{color:var(--ink2)}.ptab .pt div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.judge{font-size:12.5px;color:var(--ink2);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:6px 0 12px}
.judge.match{border-color:var(--accent)}
.judge.org{border-color:var(--zone-ink)} .judge .chips{display:inline-flex;vertical-align:middle}
.samp.other{opacity:.75;border-left:2px solid var(--line);padding-left:8px;margin-top:6px} .samp.other .olbl{font-size:11px;color:var(--ink3)}
.msg{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--asst)}
.msg.user{background:var(--user)}
/* stance of the assistant reply toward the behavior: red = does the weird thing */
.msg.st-ENDORSE{box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 30%,transparent)}
.msg.st-CONDITIONAL{box-shadow:0 0 0 3px color-mix(in srgb,var(--cite-line) 30%,transparent)}
.msg.st-AGAINST{box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 30%,transparent)}
details.claude{margin-top:14px} details.claude summary{cursor:pointer;color:var(--ink2);font-size:12.5px;font-weight:600}
details.claude .msg{margin-top:8px;white-space:pre-wrap;word-wrap:break-word}
.msg .role{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:6px;font-weight:600}
.toks{white-space:pre-wrap;word-wrap:break-word;font-size:14px;line-height:1.75}
.tk{border-radius:3px;cursor:pointer;position:relative;padding:1px 0}
.tk:hover{background:var(--blue-soft)}
.tk.sp{font-family:var(--mono);font-size:11px;color:var(--zone-ink);background:var(--zone);padding:1px 4px;margin:0 1px;border-radius:4px}
.tk.nl::after{content:"↵";font-size:10px;color:var(--ink3)}
.tk.nlg{font-size:11px;color:var(--ink3);padding:0 2px}
.tk.zone{background:var(--zone);}
.tk.cite{background:var(--cite);box-shadow:inset 0 -2px 0 var(--cite-line)}
.tk.hasread{box-shadow:inset 0 -2px 0 var(--zone-ink)}
.tk.sel{outline:2px solid var(--sel);outline-offset:1px;z-index:1}
.tmpl{border:1px dashed var(--line);border-radius:10px;padding:6px 10px;margin:-4px 0 12px;font-size:12px}
.tmpl .lbl{color:var(--zone-ink);font-size:11px;font-weight:600;margin-right:6px}
#right{border-left:1px solid var(--line);background:var(--panel);padding:16px 16px 60px}
#right h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:0 0 8px;font-weight:650}
details.tl summary{cursor:pointer;margin-bottom:8px} details.tl summary h3{display:inline}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:12px;background:var(--panel2);font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ctx{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin:8px 0 12px;max-height:110px;overflow:auto;color:var(--ink2)}
.ctx b{color:var(--ink);background:var(--blue-soft);border-radius:3px;padding:0 2px}
.lr{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--panel)}
.lr .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:var(--ink2)}
.lr .hd b{color:var(--ink);font-size:13px}
.lr .hd .oldlens{border:1px solid currentColor;border-radius:4px;padding:0 4px;color:var(--bad)}
.fve{margin-left:auto;font-variant-numeric:tabular-nums}
.bl{display:grid;grid-template-columns:1fr 54px 34px;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.bl .w{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bl .w i{display:block;height:100%;background:var(--zone-ink)}
.samp+.samp{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.raw{font-family:var(--mono);font-size:11.5px;color:var(--ink3);white-space:pre-wrap;margin-top:4px;display:none}
.showraw .raw{display:block}
.muted{color:var(--ink3);font-size:12.5px}
.err{color:var(--bad);font-size:12.5px;margin:8px 0}
.zt{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px}
.zt td{border-top:1px solid var(--line);padding:5px 4px;vertical-align:top}
.zt td:first-child{font-family:var(--mono);color:var(--zone-ink);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;width:1%;padding-right:8px;cursor:pointer}
.zt tr.on td{background:var(--blue-soft)}
.mb{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-left:12px;position:relative}
.mb::before{content:"";position:absolute;left:2px;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--zone-ink);opacity:var(--o,1)}
.zt tr.on .mb{-webkit-line-clamp:unset}
.mb+.mb{margin-top:2px}
.bfv{font-variant-numeric:tabular-nums;font-size:10.5px;color:var(--ink3);margin-right:5px}
.cp{all:unset;cursor:pointer;margin-left:5px;font-size:11px;color:var(--ink3);opacity:.45}
.cp::before{content:"⧉"}
.cp.ok::before{content:"✓"}
.bl:hover .cp{opacity:1}
.cp:hover{color:var(--ink)}
.bl .n{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
.pi .ov .mb{-webkit-line-clamp:1}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin:2px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:10px;border-radius:3px;display:inline-block}
.hlscale{display:inline-flex;align-items:center;gap:4px}
.hlscale i{display:inline-block;width:46px;height:9px;border-radius:3px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--hl) 85%,transparent));border:1px solid var(--line)}
.tip{position:fixed;z-index:20;max-width:360px;background:var(--ink);color:var(--bg);font-size:12px;padding:7px 9px;border-radius:7px;pointer-events:none;display:none}
.empty{color:var(--ink3);text-align:center;margin-top:20vh}
.tk.cfedit{background:color-mix(in srgb,var(--blue) 22%,transparent);box-shadow:inset 0 -2px 0 var(--blue)}
.flag{font-size:11px;text-transform:none;letter-spacing:0;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:5px;padding:0 5px;margin-left:6px;cursor:help;font-weight:500}
.xp{display:grid;grid-template-columns:18px 64px 1fr;gap:4px 8px;align-items:baseline;font-size:12.5px;padding:5px 6px;border-radius:7px;cursor:pointer}
.xp:hover{background:var(--panel2)} .xp.on{background:var(--blue-soft)}
.xp .ef{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.causes li{margin:4px 0} .causes .ev{color:var(--ink2);font-size:12px}
details.gt{margin-top:8px;font-size:13px} details.gt summary{cursor:pointer;color:var(--ink2);font-weight:600;font-size:12.5px}
.bank{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.bank .hd{font-size:12px;color:var(--ink2);margin-bottom:6px;display:flex;gap:8px;align-items:baseline}
.bank .hd b{color:var(--ink);font-size:13px}
.btxt{font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.jl{width:100%;border-collapse:collapse;font-size:11.5px;font-family:var(--mono)}
.jl td{border-top:1px solid var(--line);padding:2px 4px;vertical-align:top;word-break:break-word}
.jl td:first-child{color:var(--ink3);white-space:nowrap;width:1%}
@media (max-width:1200px){main{grid-template-columns:280px minmax(0,1fr) 360px}}
@media (max-width:900px){main{grid-template-columns:1fr;height:auto}#left{max-height:45vh}#right{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>Transcript <span>viewer</span></h1>
  <div class="sub" id="sub"></div>
  <div class="grow"></div>
</header>
<main>
  <aside id="left">
    <div id="filters">
      <div id="dstabs"><button data-ds="weirdchat">WeirdChat</button><button data-ds="chive">CHIVE</button><button data-ds="organisms">Organisms</button><button data-ds="glm">GLM 5.3</button></div>
      <input id="q" placeholder="Search titles, descriptions, prompts…">
      <label class="row"><span>Show</span><select id="beh"></select></label>
      <label class="row"><span>Sort</span><select id="sort"></select></label>
      <div class="row"><span id="count"></span><div class="grow"></div>
        <label class="muted" title="Which token of the end-of-turn zone after the (last) user message the list previews (L40, highlight transcript)">preview
          <select id="ovpos" style="width:auto;padding:2px 6px;font-size:12px"></select></label></div>
    </div>
    <div id="plist"></div>
  </aside>
  <section id="mid"><div class="empty">Pick a pattern on the left.</div></section>
  <aside id="right">
    <h3>Lens</h3>
    <div id="lensbody" class="muted">Click any token in a transcript to see its oracle-lens readouts, where we have them (underlined tokens).
      Tokens in <span style="color:var(--zone-ink)">purple</span> are end-of-turn zones (the <code>&lt;|im_end|&gt;</code> and the template tokens after it), where the lens tends to read best.</div>
  </aside>
</main>
<div class="tip" id="tip"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// The data: gzipped JSON built by scripts/publish.py into the HF dataset (or, for a local preview, next to this file:
// publish.py --preview sets window.WCO_STATIC).
const STATIC = window.WCO_STATIC || 'https://huggingface.co/datasets/Robbie-Kylie-NN-sprint/counterfactual-investigator-agent-with-olens/resolve/main/weirdchat/site/';
const SITE = 'https://olens-viewer.pages.dev/';  // where copied links point (localhost links don't travel)
const staticFile = p => { const u = new URL(p, location.href), q = u.searchParams;
  return {'/api/patterns': 'patterns', '/api/overview': 'overview', '/api/pattern': `pattern/${q.get('i')}`,
          '/api/transcript': `t/${q.get('tid')}`,
          '/api/bank': `bank/${q.get('tid')}/${q.get('reader')}/${q.get('chunk')}`,
          '/api/extras': `x/${q.get('tid')}/${Math.floor(q.get('pos') / 64)}`}[u.pathname]; };
const api = async p => {
  const r = await fetch(`${STATIC}${staticFile(p)}.json.gz`); if (!r.ok) throw new Error(r.status === 404 ? 'not in this snapshot' : r.status);
  const buf = await r.arrayBuffer(), b = new Uint8Array(buf.slice(0, 2));  // gzip magic, unless a CDN already decompressed it
  const raw = b[0] === 0x1f && b[1] === 0x8b ? await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer() : buf;
  return JSON.parse(new TextDecoder().decode(raw));
};
const st = { ds:'weirdchat', bank:{}, bankReads:{}, edit:null, patterns:[], layers:[], overview:{}, pat:null, tr:null, sel:null, chosen:new Set([40]),
             temp:0, n:1, reads:{}, other:{}, cond:'organism', ovpos:1, hlMode:'joint', hlLayer:40};
const ls = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem('wco.'+k)); localStorage.setItem('wco.'+k, JSON.stringify(v)); } catch(e) { return null; } };

// one line per bullet, dot opacity = NNLS weight relative to the strongest bullet
// one line per bullet with its own FVE (reads from before per-bullet FVE fall back to the NNLS weight)
const bf = (s, j) => s.bfve ? s.bfve[j] : null;
// model-organism reads have no FVE scores (or NNLS weights) yet
const fveTag = s => s.fve != null ? `<span class="muted">FVE ${s.fve.toFixed(2)}</span>` : '';
// data/stance.jsonl labels the assistant reply's stance toward the pattern's behavior
const STANCE_GLOSS = {ENDORSE: 'model behaves badly', CONDITIONAL: 'hedged or mixed', AGAINST: 'model behaves well'};
// per dataset: the header line and the list's filter and sort options (WeirdChat's behaviors and CHIVE's sources are added from the data)
const LENS = 'agu18dec O-lens/AR, layers 20–60';
const DS = {
  weirdchat: {noun: 'patterns', sub: `WeirdChat · 225 Qwen3.6-27B patterns · ${LENS}`, filters: [['', 'All behaviors']],
    sorts: [['unexpectedness', 'Unexpectedness Elo'], ['harmfulness', 'Harmfulness Elo'], ['prompt_naturalness', 'Naturalness Elo'], ['mean', 'Mean Elo'], ['match_rate', 'Match rate']]},
  chive: {noun: 'incidents', sub: `CHIVE · 300 Qwen3.6-27B incidents · ${LENS} · Agam's O-lens, NLA and J-lens banks`, filters: [['', 'All incidents'], ['split:dev', 'dev96'], ['split:test', 'test204'], ['split:hard92', 'hard92']],
    sorts: [['max_effect', 'Largest counterfactual effect'], ['match_rate', 'Base rate'], ['tsolve', 'Transcript-only solves, fewest first'], ['olift', 'O-lens minus transcript solves'], ['id', 'Incident id']]},
  organisms: {noun: 'organisms', sub: `Model organisms · LoRA fine-tunes of Qwen3.6-27B, read on organism vs base activations · ${LENS}`,
    filters: [['', 'All organisms']], sorts: [['id', 'Default order'], ['n_read', 'Most rollouts read']]},
  glm: {noun: 'env arms', sub: "GLM 5.3 evalcue rollouts · Celeste's GLM-5.3 O-lens (RL, layer 51, greedy + 4 samples at T=1, no FVE) at ~12 positions per rollout",
    filters: [['', 'All envs']], sorts: [['id', 'Default order'], ['match_rate', 'Behavior rate']]},
};
const SRC = {wildchat: 'WildChat', systemchat2: 'SystemChat', hermes: 'Hermes function calling', toolace: 'ToolACE'};
const CAPPED = 'CHIVE sampled this reply with a ~500-token cap, so it stops mid-sentence, and the <|im_end|> after it was appended rather than generated. Reads of the end-of-turn zone after it see a forced ending.';
function fillFilters(){
  const d = DS[st.ds], key = st.ds === 'chive' ? 'src:' : '';
  const extra = st.ds === 'organisms' ? [] : [...new Set(st.patterns.filter(p => p.ds === st.ds).map(p => p.behavior))].sort().map(b => [key + b, st.ds === 'chive' ? SRC[b] || b : b]);
  $('#beh').innerHTML = [...d.filters, ...extra].map(([v, n]) => `<option value="${esc(v)}">${esc(n)}</option>`).join('');
  $('#sort').innerHTML = d.sorts.map(([v, n]) => `<option value="${v}">${esc(n)}</option>`).join('');
  for (const b of document.querySelectorAll('#dstabs button')) b.classList.toggle('on', b.dataset.ds === st.ds);
  $('#sub').textContent = d.sub;
}
function mini(s, k){
  const cs = s.coefs || [], mx = Math.max(1e-9, ...cs);
  return s.bullets.slice(0, k || 4).map((b, j) => {
    const f = bf(s, j), o = f != null ? 0.2 + 0.8 * Math.min(1, f / 0.3) : cs.length ? 0.25 + 0.75 * cs[j] / mx : 1;
    return `<div class="mb" style="--o:${o.toFixed(2)}" title="${f != null ? 'bullet FVE ' + f.toFixed(3) + ' · ' : ''}${cs.length ? 'NNLS weight ' + cs[j].toFixed(3) : ''}">${f != null ? `<span class="bfv">${f.toFixed(2)}</span>` : ''}${esc(b)}</div>`;
  }).join('');
}
// every setting that changes what's on screen lives in the URL hash (non-defaults only), so any view is a link
function syncHash(){
  const h = new URLSearchParams();
  if (st.pat) h.set('pattern', st.pat.idx);
  if (st.tr) h.set('transcript', st.tr.tid);
  if (st.sel != null) h.set('token', st.sel);
  const L = [...st.chosen].sort((a, b) => a - b).join(','); if (L !== '40') h.set('layers', L);
  if (st.temp) h.set('temperature', st.temp);
  if (st.hlMode !== 'joint') h.set('highlight', st.hlMode);
  if (st.hlLayer !== 40) h.set('highlight_layer', st.hlLayer);
  if (st.ovpos !== 1) h.set('overview', st.ovpos);
  const tf = $('#tfilter'); if (tf && tf.value !== 'all') h.set('filter', tf.value);
  if (st.ds !== 'weirdchat') h.set('dataset', st.ds);
  if (st.edit != null) h.set('edit', st.edit);

const LEGACY = {p: 'pattern', t: 'transcript', tok: 'token', L: 'layers', T: 'temperature', hl: 'highlight', hll: 'highlight_layer',

async function openTranscript(tid){
  const tr = await api('/api/transcript?tid=' + encodeURIComponent(tid));

  const citeOf = {}; tr.cites.forEach((c, j) => { for (let i = c.range[0]; i < c.range[1]; i++) citeOf[i] = j; });
  const tokHtml = (a, b, compact) => { let h = ''; for (let i = a; i < b; i++) {
      const s = tr.tokens[i], cls = ['tk'];

      if (nl && (compact || zoneOf[i] >= 0)) cls.push('nl');
      if (nl && !compact && zoneOf[i] < 0) { cls.push('nlg'); h += `<span class="${cls.join(' ')}" data-p="${i}">↵</span>${esc(s)}`; continue; }
      h += `<span class="${cls.join(' ')}" data-p="${i}">${compact && nl ? '' : esc(s)}</span>`; } return h; };

  const orgHdr = o && `<div class="judge org"><b>${esc(o.kind)} prompt ${+o.prompt.split('/').pop().replace(/\D/g, '') + 1} · sample ${o.sample + 1}/4</b> · ${o.n_tokens} tokens${o.hit_cap ? ' (hit the 700-token cap)' : ''}.

        activations over the same tokens; the other one shows under each readout. No FVE scores yet.` : 'Not read with the lens: only sample 1 of each trigger and control prompt was.'}</div>`;

      · ${fu.sample ? `sample ${fu.sample} at T=1` : 'greedy'} · ${fu.n_new} tokens${fu.hit_cap ? ' (hit the cap)' : ''}.

  const g = tr.glm, glmHdr = g && `<div class="judge ${g.positive ? 'match' : ''}"><b>${g.positive ? 'Shows the behavior' : "Doesn't show the behavior"}</b> (the env's label)

      Rendered with GLM-5.3's chat template; O-lens reads (L51) at the ${g.read_pos.length} underlined tokens: click one, or switch Decode to T=1 × 4 for the samples.</div>`;
  let html = o ? orgHdr : g ? glmHdr : fu ? fuHdr : th ? thHdr : `<div class="judge ${tr.match ? 'match' : ''}"><b>Judge${chive ? ' (Sonnet 5.5, one vote, on this sample)' : ''}: ${verdict}.</b> ${esc(tr.explanation || '')}</div>`;
  if (chive && tr.edits.length) html += `<details class="gt" open style="margin:0 0 12px"><summary>Counterfactual experiments (${tr.edits.length}): click one to mark what it changed</summary>${tr.edits.map(e => `
      <div class="xp" data-x="${e.number}"><span>${e.is_key ? '★' : ''}</span><span class="ef" style="color:${e.effect < 0 ? 'var(--good)' : 'var(--bad)'}" title="behaviour rate ${e.k}/${e.n} vs ${Math.round(e.baseline * 100)}% at this experiment's baseline">${e.effect > 0 ? '+' : e.effect < 0 ? '−' : '±'}${Math.round(Math.abs(e.effect) * 100)}pp</span>
      <span>${esc(e.summary)}${e.subs.length ? '' : ' <span class="muted">(no span: it only adds or moves turns)</span>'}${e.subs.length && e.structural ? ' <span class="muted">(also adds or moves turns)</span>' : ''}</span></div>`).join('')}</details>`;
  html += `<div class="legend"><span><i class="sw" style="background:var(--zone)"></i>end-of-turn zone</span><span><i class="sw" style="background:var(--cite);box-shadow:inset 0 -2px 0 var(--cite-line)"></i>judge citation</span>${chive ? '<span><i class="sw" style="background:color-mix(in srgb,var(--blue) 22%,transparent);box-shadow:inset 0 -2px 0 var(--blue)"></i>counterfactual edit</span>' : ''}<span><i class="sw" style="box-shadow:inset 0 -2px 0 var(--zone-ink)"></i>has our own read${chive ? " (Agam's banks cover every token)" : ''}</span><span>← → to step tokens</span>

  if (at < tr.tokens.length) html += `<div class="tmpl toks"><span class="lbl">template</span>${tokHtml(at, tr.tokens.length, true)}</div>`;

  for (const c of tr.claude || []) html += `<details class="claude"><summary>${esc(c.model)} on the same prompt${c.stop_reason === 'end_turn' ? '' : ' · stop: ' + esc(c.stop_reason) + (c.stop_details?.category ? ` (${esc(c.stop_details.category)} classifier)` : '')}</summary>
    <div class="msg">${esc(c.text)}</div></details>`;

  }
  for (const el of document.querySelectorAll('#tview .tk')) {

  }

  else select(z0 ? Math.min(z0[0] + (tr.glm ? 0 : st.ovpos), z0[1] - 1) : 0, false);  // GLM zones start on her final_user read

// mark one counterfactual experiment's edited spans; hovering a span shows what replaced it
function showEdit(num, scroll){
  st.edit = num; syncHash();
  for (const el of document.querySelectorAll('#tview .tk.cfedit')) { el.classList.remove('cfedit'); delete el.dataset.sub; }
  for (const r of document.querySelectorAll('.xp')) r.classList.toggle('on', +r.dataset.x === num);
  const e = num != null && st.tr.edits.find(x => x.number === num); if (!e) return;
  let first = null;
  for (const [a, b, txt] of e.subs) for (let i = a; i < b; i++) {
    const el = document.querySelector(`#tview .tk[data-p="${i}"]`); if (!el) continue;
    el.classList.add('cfedit'); el.dataset.sub = txt; first = first || el;
  }
  if (first && scroll) first.scrollIntoView({block: 'center'});
}
// Agam's O-lens bank samples re-scored with the AR (scripts/rescore_chive_banks.py), by position and layer
function setBankReads(tr){ st.bankReads = {}; for (const r of tr.bank_reads || []) st.bankReads[`${r.pos}|${r.layer}`] = r; }
const bankFve = (r, mode) => { const xs = r.samples.map(s => mode === 'top' ? Math.max(0, ...(s.bfve || [])) : s.fve); return xs.reduce((a, b) => a + b, 0) / xs.length; };
// FVE of a read: joint FVE of all bullets, or the best single bullet's FVE
function readFve(r, mode){
  const s = r.samples[0]; if (!s) return 0;
  return mode === 'top' ? (s.bfve && s.bfve.length ? Math.max(...s.bfve) : null) : s.fve;
}
// colour scale per transcript: 5th..95th percentile of the shown FVEs, so the spread is visible
function pct(xs, q){ const a = xs.slice().sort((x, y) => x - y); return a[Math.min(a.length - 1, Math.max(0, Math.round(q * (a.length - 1))))]; }
function markRead(){
  const have = new Set(Object.values(st.reads).map(r => r.pos));
  const mode = st.hlMode, L = st.hlLayer;
  const f = {};
  if (mode !== 'off') for (const r of Object.values(st.reads)) if (r.layer === L && r.temperature === 0 && r.n === 1) f[r.pos] = readFve(r, mode);
  if (mode !== 'off') for (const r of Object.values(st.bankReads)) if (r.layer === L && f[r.pos] == null) f[r.pos] = bankFve(r, mode);  // our greedy reads win
  const vs = Object.values(f).filter(v => v != null);
  const lo = vs.length ? pct(vs, 0.05) : 0, hi = vs.length ? Math.max(lo + 0.02, pct(vs, 0.95)) : 1;
  for (const el of document.querySelectorAll('#tview .tk')) {
    const p = +el.dataset.p, v = f[p];
    el.classList.toggle('hasread', have.has(p));
    if (v != null && !el.classList.contains('cfedit')) {
      const a = Math.min(1, Math.max(0, (v - lo) / (hi - lo)));
      el.style.backgroundColor = `color-mix(in srgb, var(--hl) ${Math.round(a * 85)}%, transparent)`;
      el.dataset.f = v.toFixed(2);
    } else { el.style.backgroundColor = ''; delete el.dataset.f; }
  }
  const sc = $('#hlscale'); if (sc) sc.innerHTML = mode === 'off' ? '' : (vs.length ? `${lo.toFixed(2)} <i></i> ${hi.toFixed(2)}` : Object.keys(f).length ? 'no FVE scores' : 'no reads at this layer');
}
function showTip(e, s){ const t = $('#tip'); t.textContent = s; t.style.display = 'block'; t.style.left = Math.min(e.clientX + 12, innerWidth - 380) + 'px'; t.style.top = (e.clientY + 14) + 'px'; }
function hideTip(){ $('#tip').style.display = 'none'; }

function select(pos, scroll){
  st.sel = pos; syncHash();
  for (const el of document.querySelectorAll('#tview .tk.sel')) el.classList.remove('sel');
  const el = document.querySelector(`#tview .tk[data-p="${pos}"]`);
  if (el) { el.classList.add('sel'); if (scroll) el.scrollIntoView({block:'nearest'}); }
  renderLens();
  if (st.tr.readers) loadBanks(pos);
}

// a link's token (st.focus): keep the first chosen layer's readout at the top of the lens panel, also after
// Agam's banks or NLA/J++ load above it, until the reader scrolls or clicks in the panel or moves to another token
function focusLens(){

  const box = $('#right'); box.scrollTop += el.getBoundingClientRect().top - box.getBoundingClientRect().top - 8;
}

function zoneFor(pos){ return st.tr.zones.find(([a, b]) => pos >= a && pos < b); }

function renderLens(){
  const tr = st.tr, pos = st.sel; if (!tr || pos == null) return;
  const a = Math.max(0, pos - 24), ctx = tr.tokens.slice(a, pos).join('');
  const layers = tr.layers || st.layers;  // GLM transcripts: Celeste's single layer
  const z = zoneFor(pos);
  let h = `<div class="row" style="justify-content:space-between"><div><b style="font-family:var(--mono)">${esc(JSON.stringify(tr.tokens[pos]))}</b> <span class="muted">token ${pos} / ${tr.tokens.length}</span></div></div>
    <div class="ctx">…${esc(ctx)}<b>${esc(tr.tokens[pos])}</b></div>
    <div class="row" style="margin-bottom:6px"><span class="muted" style="width:52px">Layers</span><div class="chips" id="lchips">${layers.map(L => `<button class="chip ${st.chosen.has(L) ? 'on' : ''}" data-l="${L}">${L}</button>`).join('')}</div></div>
    <div class="row" style="margin-bottom:12px"><span class="muted" style="width:52px">Decode</span>
      <div class="chips"><button class="chip ${st.temp === 0 ? 'on' : ''}" data-t="0">greedy</button><button class="chip ${st.temp === 1 ? 'on' : ''}" data-t="1">T=1 × 4</button></div>
      <div class="grow"></div><label class="muted"><input type="checkbox" id="rawtog" style="width:auto"> raw</label></div>
    <div id="xbox"></div>`;
  if (z) {

      const r = st.reads[tokKey(p, L)] || st.bankReads[`${p}|${L}`];
      const s = r ? r.samples[0] : null;
      return `<tr class="${p === pos ? 'on' : ''}" data-p="${p}"><td>${esc(JSON.stringify(tr.tokens[p]))}</td><td>${s ? mini(s) + fveTag(s) : '<span class="muted">–</span>'}</td></tr>`;

    if (rows.length) h += `<div style="max-height:300px;overflow:auto;margin-bottom:12px"><table class="zt">` + rows.map(p => {
      const s = readAt(p).samples[0];
      const c = tr.tokens.slice(Math.max(0, p - 5), p + 1).join('').replace(/\s+/g, ' ').slice(-34);
      return `<tr class="${p === pos ? 'on' : ''}" data-p="${p}"><td title="token ${p}">…${esc(c)}</td><td>${mini(s)}${fveTag(s)}</td></tr>`;
    }).join('') + `</table></div>`;
    else h += `<div class="muted" style="margin-bottom:12px">Not read. ${tr.ds === 'chive' ? "Agam's O-lens bank samples get AR scores here once they're re-scored." : ''}</div>`;
    h += `</details>`;
  }
  if (tr.readers) h += bankHtml(pos);

    h += `<div class="lr" data-l="${L}"><div class="hd"><b>L${L}</b>${oldLens}${r.norm != null ? `<span>‖h‖ ${Math.round(r.norm)}</span>` : ''}<span class="fve" title="joint whitened FVE: NNLS refit on all bullets' AR directions. Per bullet: that bullet's own FVE (cos² in the whitened space)">joint FVE <b>${r.samples.map(s => s.fve != null ? s.fve.toFixed(2) : '–').join(' / ')}</b></span></div>`;
    h += r.samples.map(s => sampHtml(s, L)).join('');

    if (o) h += `<div class="samp other"><div class="olbl">${st.cond === 'base' ? 'organism' : 'base Qwen'} activations, same token</div>${o.samples[0].bullets.map(b => `<div class="bl">${blTxt(b, L)}</div>`).join('')}<div class="raw">${esc(o.samples[0].text)}</div></div>`;
    h += `</div>`;
  }
  h += `</div>`;
  $('#lensbody').className = ''; $('#lensbody').innerHTML = h;
  for (const c of document.querySelectorAll('#lchips .chip')) c.onclick = () => {
    const L = +c.dataset.l; if (st.chosen.has(L) && st.chosen.size > 1) st.chosen.delete(L); else st.chosen.add(L); ls('layers', [...st.chosen]); renderLens(); syncHash(); };
  for (const c of document.querySelectorAll('[data-t]')) c.onclick = () => { st.temp = +c.dataset.t; st.n = st.temp ? 4 : 1; setReads(st.tr); markRead(); renderLens(); syncHash(); };

}

// bullet text plus a copy button (delegated click handler below)
const blTxt = (b, L, fve) => `<span>${esc(b)}<button class="cp" data-l="${L}"${fve != null ? ` data-fve="${fve.toFixed(2)}"` : ''} title="copy bullet + link"></button></span>`;

document.addEventListener('click', e => {

  const L = b.dataset.l, h = new URLSearchParams(location.hash.slice(1));

// one scored sample: bullets with their own FVE (or NNLS weight, for reads from before per-bullet FVE)
function sampHtml(s, L){
  const mx = Math.max(1e-9, ...(s.coefs || []));
  return `<div class="samp">${s.bullets.length ? s.bullets.map((b, j) => (bf(s, j) != null
    ? `<div class="bl" title="bullet FVE ${bf(s, j).toFixed(3)} · NNLS weight ${s.coefs[j].toFixed(3)}">${blTxt(b, L, bf(s, j))}<div class="w"><i style="width:${Math.min(100, 100 * bf(s, j) / Math.max(1e-9, s.fve))}%"></i></div><span class="n">${bf(s, j).toFixed(2)}</span></div>`
    : s.coefs ? `<div class="bl">${blTxt(b, L)}<div class="w" title="NNLS weight ${s.coefs[j].toFixed(3)}"><i style="width:${100 * s.coefs[j] / mx}%"></i></div><span class="n"></span></div>`
    : `<div class="bl">${blTxt(b, L)}</div>`)).join('') : `<div class="muted">(no bullets)</div>`}<div class="raw">${esc(s.text)}</div></div>`;
}

// Agam's per-token banks (web/chive.py READERS), fetched a chunk of positions at a time
const bankKey = (reader, c) => `${st.tr.tid}|${reader}|${c}`;
async function loadBanks(pos){
  const tr = st.tr, c = Math.floor(pos / tr.chunk);
  const need = tr.readers.filter(r => r.layers.length && !(bankKey(r.key, c) in st.bank));
  if (!need.length) return;
  for (const r of need) st.bank[bankKey(r.key, c)] = null;  // in flight
  await Promise.all(need.map(async r => {
    try { st.bank[bankKey(r.key, c)] = await api(`/api/bank?tid=${encodeURIComponent(tr.tid)}&reader=${r.key}&chunk=${c}`); }
    catch (e) { st.bank[bankKey(r.key, c)] = {error: e.message}; }
  }));
  if (st.tr === tr && st.sel != null && Math.floor(st.sel / tr.chunk) === c) renderLens();
}
function bankHtml(pos){
  const c = Math.floor(pos / st.tr.chunk);
  let h = `<h3>Agam's banks</h3>`;
  if (!st.tr.readers.some(r => r.layers.length)) return h + `<div class="muted" style="margin-bottom:12px">Not in the public snapshot: they're Agam's, unpublished.</div>`;
  for (const r of st.tr.readers) {
    if (!r.layers.length) continue;
    const ch = st.bank[bankKey(r.key, c)];
    const cell = L => ch && ch.layers && ch.layers[L] ? ch.layers[L][pos - ch.lo] : null;
    const wait = !ch ? '<span class="spin"></span>' : ch.error ? `<div class="err">${esc(ch.error)}</div>` : null;
    if (r.kind === 'tokens') {
      h += `<details class="bank" id="jl" ${st.openJ ? 'open' : ''}><summary class="hd"><b>${esc(r.label)}</b><span>${esc(r.note)}, L${r.layers[0]}–${r.layers.at(-1)}</span></summary>${wait ||
        `<table class="jl">${[...r.layers].reverse().map(L => `<tr><td>L${L}</td><td>${esc((cell(L) || []).join(' '))}</td></tr>`).join('')}</table>`}</details>`;
      continue;
    }
    for (const L of r.layers.length === 1 ? r.layers : r.layers.filter(L => st.chosen.has(L))) {
      const scored = r.key === 'olens_bank' && st.bankReads[`${pos}|${L}`];
      h += `<div class="bank"><div class="hd"><b>${esc(r.label)} L${L}</b><span>${scored ? 'scored with the AR' : esc(r.note)}</span>${scored ? `<span class="fve">joint FVE <b>${scored.samples.map(s => s.fve.toFixed(2)).join(' / ')}</b></span>` : ''}</div>`;
      h += scored ? scored.samples.map(s => sampHtml(s, L)).join('') : wait || (cell(L) || []).map(t => `<div class="samp btxt">${esc(t)}</div>`).join('') || '<div class="muted">(empty)</div>';
      h += `</div>`;
    }
  }
  return h;
}

// NLA (L42) + J++ lens (data/extras.jsonl), fetched a chunk of 64 tokens at a time when a token is shown

      <div style="max-height:340px;overflow:auto;margin-bottom:12px"><table class="zt">` + rows.map(([L, top]) => `<tr><td class="muted" style="width:34px">L${L}</td><td style="font-family:var(--mono);font-size:11.5px">` +

  }

(async () => {

  addEventListener('hashchange', () => location.reload());  // a link pasted into an open viewer tab (syncHash's replaceState doesn't fire this)
  for (const ev of ['wheel', 'pointerdown', 'touchstart']) $('#right').addEventListener(ev, () => { st.focus = null; }, {passive: true});
  $('#ovpos').innerHTML = zl.map((t, k) => `<option value="${k}" ${k === st.ovpos ? 'selected' : ''}>+${k} ${esc(t)}</option>`).join('');
  $('#ovpos').onchange = e => { st.ovpos = +e.target.value; ls('ovpos', st.ovpos); renderList(); };
  st.overview = await api('/api/overview');
  $('#q').oninput = renderList; $('#beh').onchange = renderList; $('#sort').onchange = renderList;
  for (const b of document.querySelectorAll('#dstabs button')) b.onclick = () => { if (b.dataset.ds === st.ds) return; st.ds = b.dataset.ds; $('#q').value = ''; fillFilters(); openPattern(firstOf(st.ds)); };
  renderList();
  if (hpat) openPattern(hpat.idx, hp.get('transcript'));
  else if (hp.has('dataset')) openPattern(firstOf(st.ds));
  else { const pi = ls('pat'); if (pi != null && st.patterns[pi]) openPattern(pi, ls('tid')); else openPattern(firstOf('weirdchat')); }
})();
</script>
</body>
</html>
