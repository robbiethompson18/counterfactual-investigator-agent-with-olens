<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lens case study</title>
<link rel="stylesheet" href="/style.css">
<style>
/* case page: the viewer's layout with a wide middle column and the lenses on the right */
.cmain{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);height:calc(100% - 52px)}
#right{padding:16px 22px 60px}
.sec{margin-bottom:18px}
.cmain > section, .cmain > aside{overflow:auto;min-height:0}
@media (max-width:1000px){.cmain{grid-template-columns:1fr;height:auto}}
.card h3, #right h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:0 0 8px;font-weight:650}
.card h3 .muted{text-transform:none;letter-spacing:0;font-weight:400}
.tk.miss{opacity:.5}
.grid{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px}
table.g{border-collapse:collapse;font-family:var(--mono);font-size:11px}
table.g td,table.g th{border-right:1px solid var(--line);padding:1px 4px;white-space:nowrap;max-width:74px;overflow:hidden;text-overflow:ellipsis}
table.g th{position:sticky;top:0;background:var(--panel2);z-index:1;font-weight:500;cursor:pointer}
table.g td.L{position:sticky;left:0;background:var(--panel2);color:var(--ink3);z-index:1}
table.g td.c{cursor:pointer} table.g .on{outline:2px solid var(--sel);outline-offset:-2px}
.vb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.vb input,.vb select{width:auto;padding:3px 8px;font-size:12.5px}
table.vt{border-collapse:collapse;font-size:12.5px;width:100%} table.vt td{border-top:1px solid var(--line);padding:4px 6px;vertical-align:middle}
table.vt input{width:auto;padding:2px 6px;font-size:12px}
table.vt tr.on td{background:var(--blue-soft)}
.smp{border-top:1px solid var(--line);padding:6px 0;font-size:12.5px;white-space:pre-wrap} .smp.m{border-left:3px solid var(--accent);padding-left:8px}
.jt td{padding:1px 3px;font-family:var(--mono);font-size:11.5px;vertical-align:top}
.jt span{padding:0 3px;margin-right:2px;border-radius:3px;display:inline-block}
.nla{white-space:pre-wrap;font-size:13px}
table.ct{border-collapse:collapse;width:100%;font-size:11px;font-variant-numeric:tabular-nums}
table.ct td{padding:1px 4px;height:15px} table.ct td.L{color:var(--ink3);width:30px}
.dv{position:relative;height:11px;background:var(--panel2);border-radius:2px}
table.ct tr.lrow{cursor:pointer} table.ct tr.lrow:hover td{background:var(--panel2)} table.ct tr.lrow.on td{background:var(--blue-soft)}
.hgrid{display:grid;gap:1px;height:14px} .hgrid i{display:block;border-radius:2px;border:1px solid var(--line)}
.dv i{position:absolute;top:0;height:100%;border-radius:2px} .dv::after{content:"";position:absolute;left:50%;top:-1px;bottom:-1px;border-left:1px solid var(--ink3)}
</style>
</head>
<body>
<header>
  <h1>WeirdChat <span>×</span> lens case study</h1>
  <div class="sub" id="sub"></div>
  <div class="grow"></div>
  <span class="muted" id="cov"></span>
  <button class="btn" id="fill" title="Queue the O-lens at all 11 layers and run NLA + J++ on every token in range that hasn't been read">Read missing</button>
  <div class="pill"><span class="dot" id="poddot"></span><span id="podtxt">GPU: checking…</span></div>
  <a class="btn" id="back" href="/">viewer</a>
</header>
<div class="cmain">
<section id="mid">
  <div class="card"><h3>Tokens <span class="muted" id="rng"></span></h3><div id="toks"></div></div>
  <div class="card" id="vcard"><h3>Probe / steering vectors</h3>
    <div class="vb">
      <select id="vkind"><option value="jpp">J++ tokens</option><option value="ar">O-lens AR of text</option><option value="nla">NLA AR of text (L42)</option><option value="diff">difference of two vectors</option></select>
      <span id="vlayerw">layer <select id="vlayer"></select></span>
      <span id="vjpp">+ <input id="vplus" placeholder="words, comma-separated: Yes, absolutely" size="26"> − <input id="vminus" placeholder="e.g. No, not" size="14"></span>
      <span id="vtext" hidden><input id="vtxt" placeholder="free text for the AR, e.g. the user is too drunk to drive" size="44"></span>
      <span id="vdiff" hidden><select id="va"></select> − <select id="vbb"></select></span>
      <input id="vname" placeholder="name (optional)" size="14">
      <button class="btn primary" id="vbuild">Build</button><span class="muted" id="vmsg"></span>
    </div>
    <table class="vt" id="vlist"></table>
    <h3 style="margin-top:14px">Behaviour rate under steering <span class="muted" id="base"></span></h3>
    <div class="vb"><span class="muted">zero-ablate</span><input id="abl" placeholder="L12 attn, L40 h5, L20 mlp" size="30" title="every position; heads are slices of the attention output projection's input">
      <button class="btn" id="ablrun">Sample 64 ablated</button><label class="muted"><input type="checkbox" id="ablsteer" style="width:auto"> also apply to Steer runs</label></div>
    <div class="vb"><button class="btn" id="unst">Unsteered baseline (64)</button><button class="btn" id="calib" title="Judge WeirdChat's stored rollouts of this prompt and compare with its labels">Check judge vs WeirdChat</button><span class="muted" id="calibmsg"></span></div>
    <table class="vt" id="runs"></table><div id="samples"></div>
  </div>
</section>
<aside id="right">
  <h3 id="otitle">Token</h3><div class="ctx" id="ctx"></div>
  <div class="sec"><h3>Residual writes <button class="btn" id="cbtn" style="padding:1px 8px;float:right;text-transform:none;letter-spacing:0">attention / MLP / heads</button></h3><div id="contrib"></div></div>
  <div class="sec"><h3>NLA · L42</h3><div id="nla"></div></div>
  <div class="sec"><h3>O-lens</h3><div id="olens"></div></div>
  <div class="sec"><h3>J++ lens · top 8 <label class="muted" style="text-transform:none;letter-spacing:0;font-weight:400;float:right"><input type="checkbox" id="jppall" style="width:auto"> all 63 layers</label></h3><div id="jpp"></div></div>
</aside>
</div>
<script>
// /case#t=<tid>&a=<first>&b=<last>  (default: whole user turn + the first 20 reply tokens)
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async (p, body) => { const r = await fetch(p, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {}); const j = await r.json(); if (j.error) throw new Error(j.error); return j; };
const tokStr = t => JSON.stringify(t).slice(1, -1);
const LAYERS = [20, 24, 28, 32, 36, 40, 44, 48, 52, 56, 60];
const st = {sel: null, open: new Set()};
const hp = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map(x => x.split('=').map(decodeURIComponent)));

async function load(){
  const tid = hp.t || '64946fe603c30451478e522376ef4c0fae1fd52f53579b049678a3a6f742e256a1/t035';
  const [tr, ex] = await Promise.all([api('/api/transcript?tid=' + encodeURIComponent(tid)), api('/api/extras_all?tid=' + encodeURIComponent(tid))]);
  const am = tr.msgs[tr.msgs.length - 1];
  st.tr = tr; st.ex = ex; st.a = +(hp.a || 0); st.b = +(hp.b || am[0] + 19); st.asst0 = am[0];
  st.reads = {}; for (const r of tr.reads) if (r.temperature === 0 && r.n === 1) st.reads[r.pos + '|' + r.layer] = r;
  $('#sub').textContent = `${tr.tid.split('/').pop()} · ${tr.match ? 'judge: match' : 'judge: no match'}`;
  if (tr.prompt_rate) $('#base').textContent = `WeirdChat's own rate for this prompt: ${tr.prompt_rate.matched}/${tr.prompt_rate.n}`;
  api('/api/locate?tid=' + encodeURIComponent(tid)).then(l => $('#back').href = `/#p=${l.pattern}&t=${encodeURIComponent(tid)}`);
  if (st.sel == null) st.sel = st.asst0;
  render();
}
const range = () => Array.from({length: st.b - st.a + 1}, (_, k) => st.a + k);
function coverage(){
  const P = range(); let o = 0, n = 0, j = 0;
  for (const p of P) { o += LAYERS.filter(L => st.reads[p + '|' + L]).length; if ((st.ex[p] || {}).nla) n++; if ((st.ex[p] || {}).jpp) j++; }
  return `O-lens ${o}/${P.length * LAYERS.length} · NLA ${n}/${P.length} · J++ ${j}/${P.length}`;
}
function render(){
  const tr = st.tr, P = range();
  $('#rng').textContent = `${st.a}–${st.b} (user turn + first ${st.b - st.asst0 + 1} reply tokens)` + (st.probe ? ` · probe: ${st.probe.name} at L${st.probe.layer} (orange +, purple −; max |cos| ${st.probeMax.toFixed(3)})` : '');
  $('#cov').textContent = coverage();
  // tokens rendered as in the viewer: message boxes, template boxes, special tokens, ↵ for newlines
  const zoneOf = new Set(); tr.zones.forEach(([x, y]) => { for (let i = x; i < y; i++) zoneOf.add(i); });
  const tokHtml = (x, y, compact) => { let h = ''; for (let p = Math.max(x, st.a); p < Math.min(y, st.b + 1); p++) {
      const t = tr.tokens[p], cls = ['tk'], nl = /^\s*\n\s*$/.test(t);
      const done = (st.ex[p] || {}).jpp && (st.ex[p] || {}).nla && LAYERS.every(L => st.reads[p + '|' + L]);
      if (tr.special[p]) cls.push('sp'); if (zoneOf.has(p) && !st.probe) cls.push('zone'); if (p === st.sel) cls.push('sel'); if (!done && !st.probe) cls.push('miss');
      const ap = st.attnPat && st.attnPat.weights && st.attnPat.pos === st.sel ? st.attnPat : null;
      const aw = ap && p <= ap.pos ? ap.weights[p] / Math.max(...ap.weights.map(Math.abs)) : null;
      const pc = st.probe && !ap ? st.probe.cos[p] : null;
      const bg = aw != null ? `background:color-mix(in srgb, ${aw >= 0 ? 'var(--blue)' : 'var(--bad)'} ${Math.round(Math.sqrt(Math.abs(aw)) * 70)}%, transparent)`
        : pc == null ? '' : `background:color-mix(in srgb, ${pc > 0 ? 'var(--accent)' : 'var(--blue)'} ${Math.round(Math.min(1, Math.abs(pc) / st.probeMax) * 65)}%, transparent)`;
      const title = `token ${p}${pc == null ? '' : ' · cos ' + pc.toFixed(3)}`;
      if (nl) { cls.push('nlg'); h += `<span class="${cls.join(' ')}" style="${bg}" data-p="${p}" title="${title}">↵</span>${compact ? '' : esc(t)}`; continue; }
      h += `<span class="${cls.join(' ')}" style="${bg}" data-p="${p}" title="${title}">${esc(t)}</span>`; } return h; };
  let html = '', at = 0;
  tr.msgs.forEach((m, k) => {
    if (!m || m[0] > st.b) { return; }
    if (m[0] > at) html += `<div class="tmpl toks"><span class="lbl">template</span>${tokHtml(at, m[0], true)}</div>`;
    html += `<div class="msg ${tr.roles[k]}"><div class="role">${esc(tr.roles[k])}${m[1] > st.b + 1 ? ` · first ${st.b + 1 - m[0]} tokens` : ''}</div><div class="toks">${tokHtml(m[0], m[1])}</div></div>`;
    at = m[1];
  });
  $('#toks').innerHTML = html;
  for (const el of document.querySelectorAll('#toks .tk')) el.onclick = () => pick(+el.dataset.p);
  renderDetail();
}
function renderDetail(){
  const p = st.sel, x = st.ex[p] || {}, tr = st.tr;
  $('#otitle').innerHTML = `<span style="font-family:var(--mono);text-transform:none;letter-spacing:0;color:var(--ink);font-size:13px">${esc(JSON.stringify(tr.tokens[p]))}</span> <span class="muted" style="text-transform:none;letter-spacing:0">token ${p}${st.probe ? ` · probe cos ${st.probe.cos[p].toFixed(3)}` : ''}</span>`;
  $('#ctx').innerHTML = `…${esc(tr.tokens.slice(Math.max(0, p - 24), p).join(''))}<b>${esc(tr.tokens[p])}</b>`;
  const rs = LAYERS.map(L => [L, st.reads[p + '|' + L]]).filter(([, r]) => r);
  $('#olens').innerHTML = rs.length ? rs.map(([L, r]) => { const s = r.samples[0];
    return `<div class="lr"><div class="hd"><b>L${L}</b><span>‖h‖ ${Math.round(r.norm)}</span><span class="fve">joint FVE <b>${s.fve.toFixed(2)}</b></span><button class="btn" style="padding:1px 7px" data-edit="${L}" title="Edit the bullets and re-score them against this activation">edit</button></div>` +
      (s.bullets.map((b, j) => { const f = s.bfve ? s.bfve[j] : null; return `<div class="bl"><span>${esc(b)}</span><div class="w"><i style="width:${f == null ? 0 : Math.min(100, 100 * f / Math.max(1e-9, s.fve))}%"></i></div><span class="n">${f == null ? '' : f.toFixed(2)}</span></div>`; }).join('') || '<div class="muted">(no bullets)</div>') + `<div id="ed${L}"></div></div>`; }).join('')
    : '<div class="muted">Not read yet.</div>';
  $('#nla').innerHTML = x.nla ? `<div class="lr"><div class="hd"><span title="AR reconstruction from the explanation: cosine, and FVE = 1 − ‖p̂−v̂‖²/E‖v̂−μ‖² (μ over 64 random WeirdChat transcripts)">reconstruction</span><span class="fve">cos <b>${x.nla.cos.toFixed(2)}</b> · FVE <b>${x.nla.fve.toFixed(2)}</b></span></div><div class="nla">${esc(x.nla.text)}</div><button class="btn" style="padding:1px 7px;margin-top:6px" data-edit="nla" title="Edit the explanation and re-score it with the NLA reconstructor">edit</button><div id="ednla"></div></div>` : '<div class="muted" style="margin-bottom:14px">Not read yet (needs the H200 pod).</div>';
  renderContrib();
  const all = $('#jppall').checked;
  $('#jpp').innerHTML = x.jpp ? `<table class="jt">` + x.jpp.layers.map((L, i) => [L, x.jpp.top[i]]).filter(([L]) => all || L % 4 === 3 || L >= 56).reverse().map(([L, top]) => `<tr><td class="muted">L${L}</td><td>` +
    top.map(([t, q]) => `<span title="p ${q.toFixed(3)}" style="background:color-mix(in srgb, var(--zone-ink) ${Math.round(Math.min(1, q * 2) * 45)}%, transparent)">${esc(tokStr(t))}</span>`).join('') + `</td></tr>`).join('') + `</table>` : '<div class="muted">Not read yet.</div>';
}
$('#jppall').onchange = renderDetail;
// per-block writes into the residual stream at the selected token, by cosine with a chosen direction
st.contrib = {};
function renderContrib(){
  const c = st.contrib[st.sel], box = $('#contrib');
  if (!c) { box.innerHTML = arForm() + '<div class="muted">What each attention block (full or linear), each attention head and each MLP adds to this token\'s residual stream, against a direction. Press the button (needs the H200).</div>'; bindArForm(); return; }
  const keys = Object.keys(c.layers[0].attn.cos); if (!keys.includes(st.cdir)) st.cdir = 'final residual';
  const K = st.cdir, proj = st.cmode === 'proj';
  const val = x => proj ? x.cos[K] * x.norm : x.cos[K];  // projection = ‖write‖·cos = write · unit direction
  const nmax = Math.max(...c.layers.flatMap(r => [r.attn.norm, r.mlp.norm]));
  const sc = Math.max(1e-3, ...c.layers.flatMap(r => [Math.abs(val(r.attn)), Math.abs(val(r.mlp))]));
  const scR = Math.max(1e-3, ...c.layers.map(r => r.resid ? Math.abs(val(r.resid)) : 0));
  const fmt = x => proj ? (Math.abs(x) >= 10 ? x.toFixed(0) : x.toFixed(1)) : x.toFixed(2);
  const bar = (x, col, ab, scl = sc) => { const w = Math.min(50, Math.abs(val(x)) * 50 / scl), o = proj || scl !== sc ? 1 : 0.25 + 0.75 * Math.sqrt(x.norm / nmax);
    return `<div class="dv" data-ab="${ab}" title="cos ${x.cos[K].toFixed(3)} · ‖write‖ ${x.norm} · projection ${(x.cos[K] * x.norm).toFixed(2)}${ab.endsWith('mlp') ? ' · click to add to the ablation list' : ''}"><i style="${val(x) >= 0 ? 'left:50%' : 'right:50%'};width:${w}%;background:${col};opacity:${o.toFixed(2)}"></i></div>`; };
  const heads = (r, L) => { const hm = Math.max(...r.heads.map(h => h.norm)), hs = Math.max(1e-3, ...r.heads.map(h => Math.abs(val(h))));
    const top = r.heads.map((h, i) => [i, h.cos[K] * h.norm]).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 5);
    return `<tr class="hd"><td></td><td colspan="4"><div class="hgrid" style="grid-template-columns:repeat(${r.heads.length},1fr)">` + r.heads.map((h, i) =>
      `<i data-ab="L${L} h${i}" title="L${L} head ${i} · cos ${h.cos[K].toFixed(3)} · ‖write‖ ${h.norm} · projection ${(h.cos[K] * h.norm).toFixed(2)} · click: what it attends to" style="cursor:pointer;background:color-mix(in srgb, ${val(h) >= 0 ? 'var(--blue)' : 'var(--bad)'} ${Math.round(Math.abs(val(h)) / hs * 85)}%, transparent);opacity:${proj ? 1 : (0.3 + 0.7 * Math.sqrt(h.norm / hm)).toFixed(2)}"></i>`).join('') +
      `</div><div class="muted" style="font-size:11px;margin:2px 0 4px">${r.kind} attention, ${r.heads.length} heads. Largest projections: ${top.map(([i, p]) => `h${i} ${p >= 0 ? '+' : ''}${p.toFixed(2)}`).join(', ')}. <a href="#" data-ab="L${L} attn">ablate the whole block</a></div>${st.attnPat && st.attnPat.layer === L && st.attnPat.pos === st.sel ? attnHtml(st.attnPat) : ''}</td></tr>`; };
  box.innerHTML = arForm() + `<div class="row" style="margin-bottom:6px;font-size:12px;flex-wrap:wrap"><select id="cmode" style="width:auto;padding:1px 6px;font-size:12px"><option value="cos">cosine</option><option value="proj" ${proj ? 'selected' : ''}>projection</option></select>
    <span class="muted">with</span><select id="cdir" style="width:auto;padding:1px 6px;font-size:12px">${keys.map(k => `<option ${k === K ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select>
    <span class="muted">bars to ±${fmt(sc)} (residual ±${fmt(scR)}) · click a layer for its heads, a head for what it attends to · click an MLP bar to add it to the ablation list</span></div>
    ${arFveHtml(c)}
    <table class="ct"><tr><td></td><td class="muted">attention</td><td style="width:46px"></td><td class="muted">MLP</td><td style="width:46px"></td><td class="muted" title="the residual stream after this block (not a write)">residual</td><td style="width:46px"></td></tr>` +
    c.layers.map((r, L) => `<tr class="lrow ${st.open.has(L) ? 'on' : ''}" data-l="${L}"><td class="L">L${L}${r.kind === 'full' ? '<sup title="full attention">f</sup>' : ''}</td><td>${bar(r.attn, 'var(--blue)', `L${L} attn`)}</td><td class="muted">${fmt(val(r.attn))}</td><td class="mc">${bar(r.mlp, 'var(--accent)', `L${L} mlp`)}</td><td class="muted">${fmt(val(r.mlp))}</td><td>${r.resid ? bar(r.resid, 'var(--good)', `L${L} resid`, scR) : ''}</td><td class="muted">${r.resid ? fmt(val(r.resid)) : ''}</td></tr>` + (st.open.has(L) ? heads(r, L) : '')).join('') + `</table>`;
  $('#cdir').onchange = e => { st.cdir = e.target.value; renderContrib(); };
  $('#cmode').onchange = e => { st.cmode = e.target.value; renderContrib(); };
  for (const tr of box.querySelectorAll('.lrow')) tr.onclick = e => { if (e.target.closest('.mc')) return; const L = +tr.dataset.l; st.open.has(L) ? st.open.delete(L) : st.open.add(L); renderContrib(); };
  for (const el of box.querySelectorAll('.mc [data-ab], a[data-ab]')) el.onclick = e => { e.preventDefault(); e.stopPropagation(); addAblation(el.dataset.ab); };
  for (const el of box.querySelectorAll('.hgrid [data-ab]')) el.onclick = e => { e.stopPropagation(); const [, L, h] = el.dataset.ab.match(/L(\d+) h(\d+)/); showAttn(+L, +h); };
  bindArForm();
}
// how well each per-layer AR text explains this token's activation: its FVE as an O-lens bullet, per AR layer
function arFveHtml(c){
  const f = c.ar_fve || {}; if (!Object.keys(f).length) return '';
  return `<div style="margin:2px 0 8px;font-size:11.5px"><div class="muted">FVE of each AR text at this token (as a single O-lens bullet; whitened cos², 0 if negative)</div><table class="ct" style="width:auto">` +
    Object.entries(f).map(([k, byL]) => { const Ls = Object.keys(byL).map(Number).sort((x, y) => x - y), hasB = Ls.some(L => byL[L].b != null);
      const row = (lab, key) => `<tr><td class="muted" style="max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(k)}">${lab}</td>` + Ls.map(L =>
        `<td title="L${L}" style="text-align:right;background:color-mix(in srgb, var(--zone-ink) ${Math.round(Math.min(1, byL[L][key] / 0.3) * 50)}%, transparent)">${byL[L][key].toFixed(2)}</td>`).join('') + `</tr>`;
      return `<tr><td class="muted" style="font-size:10.5px">${esc(k.replace(/^AR per layer: /, ''))}</td>${Ls.map(L => `<td class="muted" style="text-align:right">L${L}</td>`).join('')}</tr>` + row('a', 'a') + (hasB ? row('b', 'b') : ''); }).join('') + `</table></div>`;
}
// one head's attention from the selected token (full-attention blocks only), also shaded on the tokens
async function showAttn(L, h){
  const p = st.sel;
  st.attnPat = {layer: L, head: h, pos: p, loading: true}; renderContrib();
  try { st.attnPat = {...await api('/api/attn', {tid: st.tr.tid, pos: p, layer: L, head: h}), pos: p}; }
  catch (e) { st.attnPat = {layer: L, head: h, pos: p, error: e.message}; }
  render();
}
function attnHtml(a){
  if (a.loading) return '<div class="muted"><span class="spin"></span> attention pattern…</div>';
  if (a.error) return `<div class="err">${esc(a.error)}</div>`;
  const tr = st.tr, wm = Math.max(...a.weights.map(Math.abs)), xm = Math.max(...a.write);
  const wcol = x => x >= 0 ? 'var(--blue)' : 'var(--bad)';
  return `<div style="margin:4px 0 8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px"><div class="row" style="font-size:12px;margin-bottom:4px"><b>L${a.layer} head ${a.head}</b><span class="muted">${a.linear ? `linear attention: effective coefficients c_j from unrolling the DeltaNet memory (red = erases; exact to ${(100 * a.check).toFixed(2)}%)` : 'attention'} from token ${a.pos}; tokens are shaded above</span><span class="grow"></span><a href="#" data-ab2="L${a.layer} h${a.head}">add to ablation list</a> · <a href="#" data-attnclose>close</a></div>
    <table class="ct"><tr><td class="muted">token</td><td class="muted">${a.linear ? 'coefficient' : 'weight'}</td><td style="width:42px"></td><td class="muted" title="‖w_j · v_j W_O,h‖: how much this token moves into the residual stream through this head (before the output gate)">weighted write</td><td style="width:42px"></td></tr>` +
    a.top.map(j => `<tr class="atr"><td style="font-family:var(--mono);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="token ${j}">${j} ${esc(JSON.stringify(tr.tokens[j]))}</td>
      <td><div class="dv" style="height:9px"><i style="left:0;width:${100 * Math.abs(a.weights[j]) / wm}%;background:${wcol(a.weights[j])}"></i></div></td><td class="muted">${a.linear ? a.weights[j].toExponential(1) : a.weights[j].toFixed(3)}</td>
      <td><div class="dv" style="height:9px"><i style="left:0;width:${100 * a.write[j] / xm}%;background:var(--accent)"></i></div></td><td class="muted">${a.write[j].toFixed(2)}</td></tr>`).join('') + `</table></div>`;
}
document.addEventListener('click', e => {
  const ab = e.target.closest('[data-ab2]'); if (ab) { e.preventDefault(); addAblation(ab.dataset.ab2); return; }
  if (e.target.closest('[data-attnclose]')) { e.preventDefault(); st.attnPat = null; render(); return; }
});
// ablation list for sampling: "L12 attn, L40 h5, L20 mlp"
function addAblation(x){ const i = $('#abl'); const cur = i.value.split(',').map(s => s.trim()).filter(Boolean); if (!cur.includes(x)) cur.push(x); i.value = cur.join(', '); i.scrollIntoView({block: 'nearest'}); }
function parseAblation(s){
  return s.split(',').map(x => x.trim()).filter(Boolean).map(x => {
    const m = x.match(/^L?(\d+)\s*(attn|mlp|a|m|h\s*(\d+)|head\s*(\d+))$/i);
    if (!m) throw new Error(`can't read "${x}": use e.g. L12 attn, L40 h5, L20 mlp`);
    const k = m[2].toLowerCase(), h = m[3] ?? m[4];
    return h != null ? {layer: +m[1], kind: 'head', head: +h} : {layer: +m[1], kind: k.startsWith('a') ? 'attn' : 'mlp'};
  });
}
// per-layer AR directions: v_L = AR(a, L) − AR(b, L) (or − the whitener mean), recomputed at every block
const LKEY = 'case.layered';
try { st.layered = JSON.parse(localStorage.getItem(LKEY) || '{}'); } catch (e) { st.layered = {}; }
function arForm(){
  return `<div class="vb" style="font-size:12px"><span class="muted" title="O-lens AR of the text at each block's layer (AR layers 20–60 step 4; other blocks use the nearest)">per-layer AR</span>
    <input id="lara" placeholder="text a, e.g. the user is too drunk to drive" size="26"> − <input id="larb" placeholder="text b (optional; else the mean)" size="20">
    <button class="btn" id="laradd">add</button>${Object.keys(st.layered).map(k => `<span class="tag" style="cursor:pointer" data-ldel="${esc(k)}" title="remove">${esc(k)} ×</span>`).join('')}</div>`;
}
function bindArForm(){
  const add = $('#laradd'); if (!add) return;
  add.onclick = () => { const a = $('#lara').value.trim(), b = $('#larb').value.trim(); if (!a) return;
    const k = `AR per layer: “${a.slice(0, 30)}”` + (b ? ` − “${b.slice(0, 24)}”` : '');
    st.layered[k] = b ? {text: a, minus: b} : {text: a}; st.cdir = k; saveLayered(); st.contrib = {}; $('#cbtn').onclick(); };
  for (const t of document.querySelectorAll('[data-ldel]')) t.onclick = () => { delete st.layered[t.dataset.ldel]; saveLayered(); st.contrib = {}; renderContrib(); };
}
function saveLayered(){ try { localStorage.setItem(LKEY, JSON.stringify(st.layered)); } catch (e) {} }
$('#cbtn').onclick = async () => {
  const p = st.sel; $('#contrib').innerHTML = '<div class="muted"><span class="spin"></span> one forward pass on the GPU…</div>';
  try { st.contrib[p] = await api('/api/contrib', {tid: st.tr.tid, pos: p, layered: st.layered}); } catch (e) { $('#contrib').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  if (st.sel === p) renderContrib();
};
// edit a readout and re-score it against the same activation (O-lens: AR + whitened FVE; NLA: its AR)
document.addEventListener('click', e => {
  const b = e.target.closest('[data-edit]'); if (!b) return;
  const p = st.sel, k = b.dataset.edit, box = $('#ed' + k);
  const init = k === 'nla' ? st.ex[p].nla.text : st.reads[p + '|' + k].samples[0].bullets.map(x => '- ' + x).join('\n');
  box.innerHTML = `<textarea rows="${k === 'nla' ? 6 : 5}" style="width:100%;margin-top:6px;font:12.5px/1.4 var(--sans);background:var(--panel2);color:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px">${esc(init)}</textarea>
    <div class="row" style="margin-top:4px"><button class="btn primary" style="padding:2px 9px">Score</button><span class="muted"></span></div><div></div>`;
  const [ta, , out] = [box.querySelector('textarea'), null, box.lastElementChild], msg = box.querySelector('.muted');
  box.querySelector('.btn').onclick = async () => {
    msg.textContent = 'scoring…';
    try {
      const r = await api('/api/score_edit', {tid: st.tr.tid, pos: p, layer: k === 'nla' ? 42 : +k, text: ta.value, lens: k === 'nla' ? 'nla' : 'olens'});
      msg.textContent = '';
      out.innerHTML = k === 'nla' ? `<div class="muted">edited: cos <b>${r.cos.toFixed(2)}</b> · FVE <b>${r.fve.toFixed(2)}</b></div>`
        : `<div class="muted" style="margin:4px 0">edited: joint FVE <b>${r.fve.toFixed(2)}</b></div>` + r.bullets.map((x, j) => `<div class="bl"><span>${esc(x)}</span><div class="w"><i style="width:${Math.min(100, 100 * r.bfve[j] / Math.max(1e-9, r.fve))}%"></i></div><span class="n">${r.bfve[j].toFixed(2)}</span></div>`).join('');
    } catch (err) { msg.textContent = err.message; }
  };
});
async function pollPod(){
  try { const s = await api('/api/status'), p = s.pod;
    $('#poddot').className = 'dot ' + (p.state === 'ready' ? (p.server && p.server.busy ? 'busy' : 'ready') : ['launching', 'starting'].includes(p.state) ? 'busy' : '');
    $('#podtxt').textContent = (p.state === 'ready' ? 'H200 ready' + (p.server && p.server.busy ? ' · ' + p.server.task : '') : 'GPU pod ' + p.state) + (s.jpp_local ? ' · J++ local' : '');
  } catch (e) {}
}
pollPod(); setInterval(pollPod, 15000);
// ---- vectors: build on the pod, probe the transcript, steer + judge
const JLAYERS = Array.from({length: 63}, (_, i) => i);
function vform(){
  const k = $('#vkind').value;
  $('#vjpp').hidden = k !== 'jpp'; $('#vtext').hidden = !(k === 'ar' || k === 'nla'); $('#vdiff').hidden = k !== 'diff'; $('#vlayerw').hidden = k === 'nla' || k === 'diff';
  const Ls = k === 'jpp' ? JLAYERS : LAYERS, cur = +$('#vlayer').value || 40;
  $('#vlayer').innerHTML = Ls.map(L => `<option ${L === cur ? 'selected' : ''}>${L}</option>`).join('');
}
async function loadVectors(){
  const r = await api('/api/vectors'); st.vecs = r.vectors; st.hasJudge = r.judge;
  const opts = st.vecs.map(v => `<option value="${v.vid}">${esc(v.name)} (L${v.layer})</option>`).join('');
  $('#va').innerHTML = opts; $('#vbb').innerHTML = opts;
  $('#vlist').innerHTML = st.vecs.map(v => `<tr class="${st.probe && st.probe.vid === v.vid ? 'on' : ''}"><td>${esc(v.name)}</td><td class="muted">L${v.layer}</td>
    <td class="muted">${esc(JSON.stringify(v.info))}</td>
    <td style="white-space:nowrap"><button class="btn" data-probe="${v.vid}">Probe</button>
      α <input data-alpha="${v.vid}" value="0.1" size="4" title="h ← h + α·‖h‖·v̂ at every position"> <button class="btn" data-steer="${v.vid}">Steer 64</button>
      <button class="btn" data-del="${v.vid}" title="delete">×</button></td></tr>`).join('') || '<tr><td class="muted">No vectors yet.</td></tr>';
  for (const b of document.querySelectorAll('[data-probe]')) b.onclick = () => doProbe(b.dataset.probe);
  for (const b of document.querySelectorAll('[data-steer]')) b.onclick = () => doSteer(b.dataset.steer, +document.querySelector(`[data-alpha="${b.dataset.steer}"]`).value);
  for (const b of document.querySelectorAll('[data-del]')) b.onclick = async () => { await api('/api/vector/delete', {vid: b.dataset.del}); loadVectors(); };
}
const toks = s => [...new Set(s.split(',').map(x => x.trim()).filter(Boolean).flatMap(x => [x, ' ' + x]))];  // each word with and without a leading space
$('#vkind').onchange = vform;
$('#vbuild').onclick = async () => {
  const k = $('#vkind').value, L = +$('#vlayer').value; let spec;
  if (k === 'jpp') spec = {kind: 'jpp', layer: L, plus: toks($('#vplus').value), minus: toks($('#vminus').value)};
  else if (k === 'ar') spec = {kind: 'ar', layer: L, text: $('#vtxt').value};
  else if (k === 'nla') spec = {kind: 'nla', text: $('#vtxt').value};
  else { const a = st.vecs.find(v => v.vid === $('#va').value), b = st.vecs.find(v => v.vid === $('#vbb').value); spec = {kind: 'diff', a: a.spec, b: b.spec}; }
  $('#vmsg').textContent = 'building…';
  try { await api('/api/vector', {name: $('#vname').value || null, spec}); $('#vmsg').textContent = ''; $('#vname').value = ''; loadVectors(); }
  catch (e) { $('#vmsg').textContent = e.message; }
};
async function doProbe(vid){
  $('#vmsg').textContent = 'probing…';
  try { const r = await api('/api/probe', {tid: st.tr.tid, vid}); const v = st.vecs.find(x => x.vid === vid);
    st.probe = {...r, vid, name: v.name}; st.probeMax = Math.max(1e-6, ...range().map(p => Math.abs(r.cos[p]))); $('#vmsg').textContent = ''; render(); loadVectors(); }
  catch (e) { $('#vmsg').textContent = e.message; }
}
async function doSteer(vid, alpha, ablate){
  try {
    if (ablate === undefined) ablate = vid && $('#ablsteer').checked ? parseAblation($('#abl').value) : [];
    await api('/api/steer', {tid: st.tr.tid, vid, alpha, n: 64, ablate}); loadRuns();
  } catch (e) { alert(e.message); }
}
$('#ablrun').onclick = () => { try { const ab = parseAblation($('#abl').value); if (!ab.length) return alert('list components to ablate first'); doSteer(null, 0, ab); } catch (e) { alert(e.message); } };
$('#unst').onclick = () => doSteer(null, 0);
$('#calib').onclick = async () => { await api('/api/judge_calib', {tid: st.tr.tid}); $('#calibmsg').textContent = 'judging WeirdChat’s rollouts…'; setTimeout(loadRuns, 5000); };
async function loadRuns(){
  const r = await api('/api/steer?tid=' + encodeURIComponent(st.tr.tid)); const c = r.calib;
  $('#calibmsg').textContent = !c ? '' : c.state === 'done' ? `judge vs WeirdChat on its ${c.n} rollouts: WeirdChat ${(100 * c.weirdchat_rate).toFixed(0)}%, this judge ${(100 * c.judge_rate).toFixed(0)}%, agreement ${(100 * c.agree).toFixed(0)}%, κ ${c.kappa == null ? '–' : c.kappa.toFixed(2)}` : c.state === 'error' ? c.error : 'judging WeirdChat’s rollouts…';
  $('#runs').innerHTML = r.runs.map(x => `<tr data-rid="${x.rid}"><td>${esc(x.name)}</td><td class="muted">${x.layer == null ? '' : 'L' + x.layer + ' α ' + x.alpha}</td>
    <td>${x.state === 'done' ? (x.rate == null ? (x.note || 'sampled') : `<b>${(100 * x.rate).toFixed(0)}%</b> (${x.labels.filter(Boolean).length}/${x.n_judged})`) : x.state === 'error' ? `<span style="color:var(--bad)">${esc(x.error)}</span>` : x.state + '…'}</td>
    <td>${x.state === 'done' ? `<button class="btn" data-show="${x.rid}">samples</button>${x.n_judged != null && x.n_judged < x.n ? ` <button class="btn" data-rejudge="${x.rid}" title="${x.n - x.n_judged} judge calls failed">re-judge ${x.n - x.n_judged}</button>` : ''}` : ''}</td></tr>`).join('');
  for (const b of document.querySelectorAll('[data-rejudge]')) b.onclick = async () => { b.disabled = true; try { await api('/api/steer/rejudge', {rid: b.dataset.rejudge}); } catch (e) { alert(e.message); } loadRuns(); };
  for (const b of document.querySelectorAll('[data-show]')) b.onclick = () => showSamples(b.dataset.show);
  if (r.runs.some(x => !['done', 'error'].includes(x.state)) || (c && c.state === 'running')) setTimeout(loadRuns, 10000);
}
async function showSamples(rid){
  const r = (await api('/api/steer?full=1&tid=' + encodeURIComponent(st.tr.tid))).runs.find(x => x.rid === rid);
  $('#samples').innerHTML = `<h2 style="margin-top:10px">${esc(r.name)} · α ${r.alpha} · ${r.texts.length} samples (red bar = judged match)</h2>` + r.texts.map((t, i) =>
    `<div class="smp ${r.labels && r.labels[i] ? 'm' : ''}" title="${esc((r.explanations || [])[i] || '')}">${esc(t.slice(0, 700))}${t.length > 700 ? '…' : ''}</div>`).join('');
}
function pick(p){ st.sel = p; render(); }
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight' && st.sel < st.b) pick(st.sel + 1); if (e.key === 'ArrowLeft' && st.sel > st.a) pick(st.sel - 1); });
$('#fill').onclick = async () => {
  const b = $('#fill'); b.disabled = true; const P = range();
  try {
    const q = await api('/api/queue/add', {tid: st.tr.tid, scope: 'token', positions: P, layers: LAYERS});
    b.textContent = `O-lens: ${q.added} queued · NLA/J++ running…`;
    const pod = (await api('/api/status')).pod.state === 'ready';
    await api('/api/extras', {tid: st.tr.tid, positions: P, kinds: pod ? ['nla', 'jpp'] : ['jpp']});
    b.textContent = 'Read missing';
  } catch (e) { b.textContent = 'Read missing'; alert(e.message); }
  b.disabled = false; load();
};
vform(); loadVectors(); setTimeout(loadRuns, 500);
load(); setInterval(() => { if (!document.hidden) load(); }, 30000);
</script>
</body>
