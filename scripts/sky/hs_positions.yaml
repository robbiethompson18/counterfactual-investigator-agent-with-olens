# HF transformers forward passes (scripts/hs_at_positions.py: residuals at given token positions + letter log-probs) on a
# SkyPilot RunPod H200: Kylie's compute. Launch once (setup = venv + Qwen3.6-27B weights), then each job is a `sky exec`
# (never nohup over ssh: `-i 15 --down` would kill it), outputs in ~/hs/<OUT>/; fetch them before the cluster idles out:
#   uvx --from 'skypilot[runpod]==0.13.0' sky launch -c qwen-hs -y -i 15 --down --secret HF_TOKEN scripts/sky/hs_positions.yaml
#   sky exec qwen-hs -d --env IN=hs_inputs.jsonl --env OUT=name --env ARGS="--layers 32,40,48,52,56,60 --chunk 2000" \
#     scripts/sky/hs_positions.yaml   # after rsyncing the inputs to qwen-hs:~/hs/
name: author-probe

resources:
  disk_size: 300
  ordered:
    - {infra: runpod, accelerators: "H200-SXM:1"}
    - {infra: runpod, accelerators: "H200:1"}

secrets:
  HF_TOKEN: null

envs:
  HF_HOME: /data/hf
  HF_XET_HIGH_PERFORMANCE: 1
  MAX_HOURS: 4
  IN: ""
  OUT: ""
  ARGS: ""

file_mounts:
  ~/repo/scripts: ./scripts

setup: |
  set -euo pipefail
  mkdir -p /data/hf ~/hs
  command -v uv || curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH=$HOME/.local/bin:$PATH
  cd ~ && test -x hs-env/bin/python || uv venv -q --python 3.12 hs-env
  export VIRTUAL_ENV=~/hs-env
  uv pip install -q torch --torch-backend=cu129
  uv pip install -q transformers accelerate numpy flash-linear-attention huggingface_hub hf_transfer
  ~/hs-env/bin/hf download Qwen/Qwen3.6-27B >/dev/null
  echo SETUP_DONE

run: |
  [ -z "$IN" ] && { echo "no IN: setup only"; exit 0; }
  cd ~/hs
  timeout "${MAX_HOURS}h" ~/hs-env/bin/python ~/repo/scripts/hs_at_positions.py "$IN" "$OUT" $ARGS
  echo HS_DONE
