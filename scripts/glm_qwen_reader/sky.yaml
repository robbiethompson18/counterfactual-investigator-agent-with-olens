# GLM-5.3 O-lens + Qwen reader of GLM block 51 over REQ (af_v8x_olens_requests.py glm), one sky job on a 4xB200 box so --down
# never kills nohup'd work; box.sh uploads the raw outputs to HF (runs/alignment_faking/$RUN/raw) before the job ends.
#   REQ=data/runs/alignment_faking/$RUN/requests.jsonl RUN=$RUN uvx --from 'skypilot[runpod]==0.13.0' sky launch -c glm-qreader \
#     -y -i 15 --down --secret HF_TOKEN --env REQ --env RUN scripts/glm_qwen_reader/sky.yaml
name: glm-qreader

resources:
  disk_size: 900
  any_of:
    - {infra: runpod, accelerators: "B200:4"}
    - {infra: runpod, accelerators: "B200:8"}

secrets:
  HF_TOKEN: null

envs:
  W: /root/w
  REQ: requests.jsonl
  RUN: ""
  MAX_HOURS: 3

file_mounts:
  ~/code/glm_qwen_reader: ./scripts/glm_qwen_reader
  ~/code/glm_olens_dense: ./scripts/glm_olens_dense
  ~/code/glm_qwen_reader/requests.jsonl: ${REQ}

setup: |
  set -euo pipefail
  timeout 2h bash ~/code/glm_qwen_reader/box.sh setup

run: |
  set -euo pipefail
  [ -z "${CUDA_VISIBLE_DEVICES-x}" ] || [ -n "$CUDA_VISIBLE_DEVICES" ] || unset CUDA_VISIBLE_DEVICES
  timeout "${MAX_HOURS}h" bash ~/code/glm_qwen_reader/box.sh run
