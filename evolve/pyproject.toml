[project]
name = "evolve"
version = "0.1.0"
description = "Evolve counterfactual behaviour settings: baseline / real diff / null diff / grader, scored on Qwen"
requires-python = ">=3.11"
dependencies = ["openai>=1.40", "httpx>=0.27"]

[project.scripts]
evolve = "evolve.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
