# H100 backend for the viewer: Qwen3.6-27B (HF, bf16) + the agu18dec lens and AR as hook-LoRAs.
# `web/pod.py` launches it and starts the read server as a sky job; the server exits after
# IDLE_MIN minutes without reads (hard cap 4 h) and SkyPilot then downs the pod.
#   HF_TOKEN=... uvx --from 'skypilot[runpod,vast]==0.13.0' sky launch \
#     -c weirdchat-olens -y --down -i 15 --secret HF_TOKEN sky/pod.yaml
name: weirdchat-olens

resources:
  disk_size: 200
  ordered:
    - {infra: vast, accelerators: "H100:1"}
    - {infra: vast, accelerators: "H200:1"}
    - {infra: runpod, accelerators: "H100-SXM:1"}
    - {infra: runpod, accelerators: "H200-SXM:1"}

workdir: .

file_mounts:
  ~/olens: ../olens                # the lens library (repo-root olens/); sky runs from weirdchat-viewer/

secrets:
  HF_TOKEN: null

envs:
  HF_HOME: /data/hf
  HF_XET_HIGH_PERFORMANCE: 1
  MODEL_REVISION: 6a9e13bd6fc8f0983b9b99948120bc37f49c13e9

setup: |
  set -euo pipefail
  curl -LsSf https://astral.sh/uv/install.sh | sh
  mkdir -p /data/hf
  grep -q "HF_HOME=/data/hf" ~/.bashrc || echo "export HF_HOME=/data/hf" >> ~/.bashrc
  cd ~/olens
  test -x .venv/bin/python || ~/.local/bin/uv venv -q --python 3.12 .venv
  VIRTUAL_ENV=$PWD/.venv ~/.local/bin/uv pip install -q --index-strategy unsafe-best-match \
    --extra-index-url https://download.pytorch.org/whl/cu128 "torch==2.9.1+cu128" \
    -r requirements.txt kernels flash-linear-attention
  .venv/bin/hf download Qwen/Qwen3.6-27B --revision "$MODEL_REVISION" >/dev/null
  EVAL=1 bash scripts/download.sh
  .venv/bin/python -c "import torch; assert torch.cuda.is_available(); print(torch.__version__, torch.cuda.get_device_name(0))"

run: |
  nvidia-smi --query-gpu=name,driver_version,memory.used --format=csv
