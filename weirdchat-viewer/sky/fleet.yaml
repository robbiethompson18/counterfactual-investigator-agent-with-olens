# Bare GPU node for the precompute fleet (scripts/fleet.py). No setup here, so launches return
# quickly; the setup + read server run as one detached sky job (pod/fleet_job.sh).
name: weirdchat-olens-fleet

resources:
  disk_size: 200
  ordered:
    - {infra: runpod, accelerators: "H100-SXM:1"}
    - {infra: runpod, accelerators: "H200-SXM:1"}
    - {infra: vast, accelerators: "H100:1"}
    - {infra: vast, accelerators: "H200:1"}
    - {infra: vast, accelerators: "A100:1"}

workdir: .

file_mounts:
  ~/olens: ../olens                # the lens library (repo-root olens/); sky runs from weirdchat-viewer/

envs:
  HF_HOME: /data/hf
  HF_XET_HIGH_PERFORMANCE: 1
  MODEL_REVISION: 6a9e13bd6fc8f0983b9b99948120bc37f49c13e9

run: |
  nvidia-smi --query-gpu=name,memory.total --format=csv
